};
function applyColors(){
  const st = document.documentElement.style, th = THEMES[S.palette] || THEMES.neon;
  ['run','cycle','yoga','walk','swim','hike','strength','hiit'].forEach(k => {
    const v = (S.typeColors || {})[k] || (th.c ? th.c[k] : '');
    if (v) st.setProperty('--c-' + k, v); else st.removeProperty('--c-' + k);
  });
  const acc = S.accent || th.accent || '';
  if (acc) st.setProperty('--accent', acc); else st.removeProperty('--accent');
  if (S.lineColor) st.setProperty('--line', S.lineColor); else st.removeProperty('--line');
}
function colorsSettingsHtml(){
  const th = THEMES[S.palette] ? S.palette : 'neon';
  const cs = getComputedStyle(document.documentElement);
  const hex = v => { v = (v || '').trim(); if (/^#[0-9a-f]{6}$/i.test(v)) return v; const m = v.match(/\d+/g); return m ? '#' + m.slice(0, 3).map(x => (+x).toString(16).padStart(2, '0')).join('') : '#888888'; };
  return `<h3>Colours</h3><div class="card">
    <div class="stack"><div class="lbl">Theme</div><div class="chips wrap" style="padding:0">${Object.keys(THEMES).map(k => `<button class="chip ${th === k ? 'on' : ''}" data-palette="${k}">${THEMES[k].label}</button>`).join('')}</div></div>
    <div class="stack" style="border-top:1px solid var(--grid)"><div class="lbl">Workout colours</div><div class="cgrid">
      ${SLOT_ORDER.map(k => `<label class="cpick"><input type="color" value="${hex(cs.getPropertyValue('--c-' + k))}" data-tcolor="${k}"><span>${TYPES[k].label}</span></label>`).join('')}</div></div>
    <div class="stack" style="border-top:1px solid var(--grid)"><div class="cgrid">
      <label class="cpick"><input type="color" value="${hex(cs.getPropertyValue('--accent'))}" data-accent><span>Accent</span></label>
      <label class="cpick"><input type="color" value="${hex(S.lineColor || cs.getPropertyValue('--ink'))}" data-linecolor><span>Line overlay</span></label></div>
      <div class="btnrow"><button class="btn" data-colorsreset>Reset colours</button></div></div>
    <div class="note" style="padding:0 0 10px">Neon, Classic and High contrast keep neighbouring colours distinguishable for colour-blind viewers. Pastel and Mono are softer and rely more on the legends.</div>
  </div>`;
}

/* ---------- Settings: profile, sync & schedule ---------- */
const SCHEDULE = [['6:17 AM', '47 0 * * *'], ['9:30 AM', '0 4 * * *'], ['6:17 PM', '47 12 * * *'], ['9:30 PM', '0 16 * * *']];
function profileSettingsHtml(){
  return `<h3>Profile (for Pro)</h3><div class="card">
    <div class="srow"><div class="grow">Age</div><input type="number" min="10" max="100" value="${S.age || ''}" data-set="age" style="width:84px" placeholder="–"></div>
    <div class="srow"><div class="grow">Sex<div class="n">For the fitness rating against population norms</div></div><select data-set="sex">${[['','Not set'],['m','Male'],['f','Female']].map(([k, l]) => `<option value="${k}" ${S.sex === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="srow"><div class="grow">Resting heart rate<div class="n">Lowest you see on waking, in bpm</div></div><input type="number" min="30" max="110" value="${S.restHr || ''}" data-set="restHr" style="width:84px" placeholder="–"></div>
    <div class="srow"><div class="grow">Max heart rate<div class="n">Sets zone boundaries. Pro suggests values.</div></div><input type="number" min="120" max="230" value="${S.maxHr}" data-set="maxHr" style="width:84px"></div>
  </div>`;
}
function syncSettingsHtml(){
  const g = GH();
  return `<h3>Sync with Zepp</h3><div class="card">
    <div class="stack"><div class="lbl">Automatic syncs (India time)</div>
      <div class="sched">${SCHEDULE.map(s => `<span>${s[0]}</span>`).join('')}</div>
      <div class="n">Run by GitHub from your zepp-sync repository. GitHub often starts these late, sometimes by hours. Pull down on any screen to sync right away.</div>
      <div id="lastrun" class="n">${DATA_INFO.synced ? 'Data last synced: ' + esc(syncedText().replace('Synced ', '')) : ''}</div></div>
    <div class="stack" style="border-top:1px solid var(--grid)"><div class="lbl">Pull-to-refresh connection</div>
      <div class="n">Lets this app start a Zepp sync and load the result straight away. Saved only in this browser.</div>
      <label class="fl">Repository<input type="text" id="ghRepo" value="${esc(g.repo)}" placeholder="your-name/zepp-sync" autocapitalize="off" spellcheck="false"></label>
      <label class="fl">Token<input type="password" id="ghToken" value="${esc(g.token)}" placeholder="github_pat_…" autocomplete="off"></label>
      <div class="btnrow"><button class="btn primary" data-ghsave>Save and test</button>${hasGH() ? '<button class="btn" data-refresh>Sync now</button><button class="btn" data-ghforget>Remove</button>' : ''}</div>
      <div id="ghMsg" class="msg"></div>
      <details><summary class="n" style="cursor:pointer">How to make the token</summary><ol class="n steps">
        <li>On GitHub: your picture → <b>Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token</b>.</li>
        <li>Name it, set the longest expiry, and under <b>Repository access</b> pick <b>Only select repositories → zepp-sync</b>.</li>
        <li><b>Permissions → Repository permissions</b>: <b>Actions: Read and write</b>, <b>Contents: Read-only</b>.</li>
        <li>Generate, copy it, paste it above. It can only start this sync and read its data.</li></ol></details>
    </div></div>`;
}

/* ---------------- events ---------------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('button, [data-i], [data-psort], [data-sclose], [data-explain]'); if (!b) return;
  const d = b.dataset;

  // ---- refresh / sync ----
  if ('refresh' in d){ doRefresh(); return; }
  if ('ghsave' in d){
    S.gh = Object.assign(GH(), {repo:$('#ghRepo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, ''), token:$('#ghToken').value.trim()}); save();
    const msg = $('#ghMsg'); msg.className = 'msg'; msg.textContent = 'Checking…';
    try { const r = await lastRun(); msg.textContent = 'Connected. Loading data…';
      try { const res = await loadGitHubData(); S.source = 'github'; save(); ensureNav(); renderNav(); renderSettings();
        const m2 = $('#ghMsg'); m2.className = 'msg ok'; m2.textContent = `Connected · loaded ${res.acts.length} workouts. Pull down on any screen to sync.`; }
      catch(err){ msg.className = 'msg err'; msg.textContent = 'Connected to GitHub, but: ' + err.message; } }
    catch(err){ msg.className = 'msg err'; msg.textContent = err.message; }
    return;
  }
  if ('ghforget' in d){ S.gh = Object.assign(GH(), {token:''}); save(); renderSettings(); return; }
  // ---- colours ----
  if (d.palette){ S.palette = d.palette; S.typeColors = {}; S.accent = ''; save(); applyColors(); renderSettings(); return; }
  if ('colorsreset' in d){ S.palette = 'neon'; S.typeColors = {}; S.accent = ''; S.lineColor = ''; save(); applyColors(); renderSettings(); return; }
  // ---- pro ----
  if (d.usemax){ S.maxHr = +d.usemax; ACTS.forEach(a => delete a._load); save(); renderPro(); toast('Max heart rate set to ' + d.usemax + ' bpm', 'ok'); return; }
  // ---- analysis (pivot) ----
  if ('sclose' in d){ closeSheet(); return; }
  if (d.explain){ explainSheet(d.explain); return; }
  const pv = () => { save(); const y = window.scrollY; renderAnalysis(); window.scrollTo({top:y}); };
  const numKey = v => isNaN(+v) || v === '' ? v : +v;
  if (d.pchip){ sheetFor(d.pchip); return; }
  if (d.padd){ sheetFor('add:' + d.padd); return; }
  if (d.psetrows != null){ const P = curPivot(); if (P.cols === d.psetrows) P.cols = ''; P.rows = d.psetrows; P.sort = null; if (P.chart === 'heat' && P.rows !== 'day') P.chart = 'bar'; closeSheet(); pv(); return; }
  if (d.psetcols != null){ const P = curPivot(); P.cols = d.psetcols; if (P.cols && P.chart === 'bar') P.chart = 'stack'; if (!P.cols && P.showAs === 'col') P.showAs = 'value'; closeSheet(); pv(); return; }
  if (d.paddval){ const P = curPivot(); P.vals.push({m:d.paddval, how:AM[d.paddval].hows[0]}); closeSheet(); pv(); return; }
  if (d.phow){ const P = curPivot(); P.vals[+d.i].how = d.phow; pv(); sheetFor('val:' + d.i); return; }
  if (d.pchval){ const P = curPivot(); P.vals[+d.vi] = {m:d.pchval, how:AM[d.pchval].hows[0]}; closeSheet(); pv(); return; }
  if (d.pvmove != null){ const P = curPivot(), i = +d.pvmove, j = i + +d.dir; [P.vals[i], P.vals[j]] = [P.vals[j], P.vals[i]]; closeSheet(); pv(); return; }
  if (d.pvdel != null){ const P = curPivot(); P.vals.splice(+d.pvdel, 1); closeSheet(); pv(); return; }
  if (d.paddfilt){ const P = curPivot(); P.filters.push(d.paddfilt.startsWith('m:') ? {f:d.paddfilt, min:'', max:''} : {f:d.paddfilt, in:[]}); save(); sheetFor('filter:' + (P.filters.length - 1)); return; }
  if (d.pdate){ const P = curPivot(), f = P.filters[+d.i]; f.preset = d.pdate; pv(); if (d.pdate === 'custom') sheetFor('filter:' + d.i); else closeSheet(); return; }
  if (d.pfall != null){ const P = curPivot(), f = P.filters[+d.pfall]; f.in = [...document.querySelectorAll(`[data-pfin="${d.pfall}"]`)].map(x => numKey(x.value)); pv(); sheetFor('filter:' + d.pfall); return; }
  if (d.pfnone != null){ curPivot().filters[+d.pfnone].in = []; pv(); sheetFor('filter:' + d.pfnone); return; }
  if (d.pfdel != null){ const P = curPivot(); if (P.filters[+d.pfdel].f !== 'date') P.filters.splice(+d.pfdel, 1); closeSheet(); pv(); return; }
  if (d.pfnum != null){
    const P = curPivot(), f = P.filters[+d.pfnum], c = numConv(f.f.slice(2));
    const rd = id => { const t = $(id).value.trim(); if (!t) return ''; const n = c.mmss ? num(t) : parseFloat(t.replace(',', '.')); return n == null || isNaN(n) ? '' : c.from(n); };
    f.min = rd('#pfmin'); f.max = rd('#pfmax'); closeSheet(); pv(); return;
  }
  if (d.pview){ curPivot().view = d.pview; pv(); return; }
  if (d.psort){ const P = curPivot(); const cur = P.sort || {k:'label', dir:TIME_DIMS.includes(P.rows) || P.rows === 'workout' ? -1 : 1};
    P.sort = cur.k === d.psort ? {k:d.psort, dir:-cur.dir} : {k:d.psort, dir:d.psort === 'label' ? 1 : -1}; pv(); return; }
  if ('pvall' in d){ V.pvAll = true; const y = window.scrollY; renderAnalysis(); window.scrollTo({top:y}); return; }
  if ('pswap' in d){ const P = curPivot(); if (P.cols && !['workout','day'].includes(P.rows)){ [P.rows, P.cols] = [P.cols, P.rows]; P.sort = null; } else if (P.cols) toast('Each workout and Day can only be rows.'); pv(); return; }
  if ('pren' in d){ const bx = $('#arename'); bx.hidden = !bx.hidden; if (!bx.hidden) bx.querySelector('input').focus(); return; }
  if ('prensave' in d){ curPivot().title = $('#arename input').value.trim(); pv(); return; }
  if ('apin' in d){
    const c = structuredClone(curPivot()); c.title = pivotTitle(c);
    S.custom = [...(S.custom || []), c]; save(); renderNav();
    const m = $('#apinmsg'); m.className = 'msg ok';
    m.textContent = S.navOn.includes('custom') ? 'Pinned. It\'s on your Custom page.' : 'Pinned. Turn on "Custom" in Settings → Bottom bar to see your charts.';
    return;
  }
  if ('areset' in d){ S.analysis = defaultPivot(); V.pvAll = false; pv(); return; }
  if ('asave' in d){ const c = structuredClone(curPivot()); S.custom[V.editIdx] = c; S.analysis = V.prevAnalysis || defaultPivot(); V.editIdx = null; save(); V.tab = 'custom'; render(); toast('Chart updated', 'ok'); return; }
  if ('acancel' in d){ S.analysis = V.prevAnalysis || defaultPivot(); V.editIdx = null; save(); V.tab = 'custom'; render(); return; }
  // ---- custom page ----
  if (d.cmv != null){ const i = +d.cmv, j = i + +d.dir, o = S.custom; [o[i], o[j]] = [o[j], o[i]]; save(); const y = window.scrollY; renderCustom(); window.scrollTo({top:y}); return; }
  if (d.cedit != null){ V.prevAnalysis = structuredClone(curPivot()); S.analysis = toPivot(structuredClone(S.custom[+d.cedit])); V.editIdx = +d.cedit; V.pvAll = false; V.tab = 'analysis'; render(); return; }
  if (d.cren != null){ const box = $('#cr' + d.cren); box.hidden = !box.hidden; if (!box.hidden) box.querySelector('input').focus(); return; }
  if (d.crensave != null){ const i = +d.crensave, v = $('#cr' + i).querySelector('input').value.trim(); S.custom[i].title = v; save(); const y = window.scrollY; renderCustom(); window.scrollTo({top:y}); return; }
  if (d.cdel != null){
    if (b.dataset.armed){ S.custom.splice(+d.cdel, 1); save(); renderNav(); const y = window.scrollY; renderCustom(); window.scrollTo({top:y}); return; }
    b.dataset.armed = '1'; b.textContent = 'Tap again to remove'; b.classList.add('primary'); setTimeout(() => { if (b.isConnected){ delete b.dataset.armed; b.textContent = 'Remove'; b.classList.remove('primary'); } }, 3000); return;
  }
  if ('ccopy' in d){ try { await navigator.clipboard.writeText($('#cexport').value); b.textContent = 'Copied'; } catch(err){ $('#cexport').select(); b.textContent = 'Select and copy the code above'; } return; }
  if ('cimport' in d){
    const m = $('#cmsg');
    try { const arr = JSON.parse(decodeURIComponent(escape(atob($('#cimport').value.trim()))));
      if (!Array.isArray(arr) || !arr.every(x => x && (x.rows || (x.measure && x.f)))) throw new Error('bad');
      S.custom = [...(S.custom || []), ...arr.map(toPivot)]; save(); renderNav(); renderCustom(); toast(`Added ${arr.length} chart${arr.length > 1 ? 's' : ''}`, 'ok'); }
    catch(err){ m.className = 'msg err'; m.textContent = 'That code didn\'t work. Copy it again from the other device.'; }
    return;
  }
  if (d.tab){ if (d.tab !== V.tab){ if (V.tab === 'analysis' && V.editIdx != null){ S.analysis = V.prevAnalysis || S.analysis; V.editIdx = null; } closeSheet(); V.pvAll = false; V.tab = d.tab; V.sel = null; V.listLimit = 25; if (d.tab !== 'settings'){ S.lastTab = d.tab; save(); } render(); } return; }
  if (d.period){ V.period = d.period; V.sel = null; V.listLimit = 25; renderWorkout(); return; }
  if ('compare' in d){ S.compare = !S.compare; V.sel = null; save(); renderWorkout(); return; }
  if (d.metric || d.gmetric){
    const ti = typeInfo(V.tab), k = d.metric || d.gmetric; let a = selMetrics(V.tab, ti);
    if (d.gmetric) a = [k, ...a.slice(1).filter(x => x !== k)];
    else if (a.includes(k)){ if (a.length > 1) a = a.filter(x => x !== k); }   // tap a selected box: remove it (keep at least one)
    else a = a.length < 2 ? [...a, k] : [a[0], k];                             // a third tap replaces the line
    S.metric[V.tab] = a; save(); const sy = window.scrollY; renderWorkout(); window.scrollTo({top:sy}); return;
  }
  if (d.vmode){ S.viewMode = d.vmode; V.sel = null; save(); renderWorkout(); window.scrollTo({top:0}); return; }
  if (d.gby){ S.graphsBy = d.gby; V.sel = null; save(); renderWorkout(); return; }
  if ('clearsel' in d){ V.sel = null; renderWorkout(); return; }
  if ('more' in d){ const sy = window.scrollY; V.listLimit += 50; renderWorkout(); window.scrollTo({top:sy}); return; }
  if (d.allf){
    const keys = Object.keys(presentTypes());
    if (d.allf === '__all') S.allFilter = null;
    else {
      let f = S.allFilter ? S.allFilter.slice() : keys.slice();
      // first tap from "all types" isolates the tapped type; afterwards taps toggle
      if (!S.allFilter) f = [d.allf];
      else if (f.includes(d.allf)) f = f.filter(k => k !== d.allf); else f.push(d.allf);
      S.allFilter = !f.length || keys.every(k => f.includes(k)) ? null : f;
    }
    V.sel = null; save(); renderWorkout(); return;
  }
  // settings
  if (d.mv != null){ const i = +d.mv, j = i + +d.dir, o = S.navOrder; [o[i], o[j]] = [o[j], o[i]]; save(); renderNav(); renderSettings(); return; }
  if (d.navtog){ const k = d.navtog; S.navOn = S.navOn.includes(k) ? S.navOn.filter(x => x !== k) : [...S.navOn, k];
    S.navOn = S.navOrder.filter(x => S.navOn.includes(x)); if (S.start !== 'last' && !S.navOn.includes(S.start)) S.start = 'last'; save(); renderNav(); renderSettings(); return; }
  if (d.units){ S.units = d.units; save(); renderSettings(); return; }
  if (d.themeSet){ S.theme = d.themeSet; save(); applyTheme(); renderSettings(); return; }
  if ('sample' in d){ store.del('data'); S.source = 'sample'; S.allFilter = null; save(); setData(genSample(), {label:'Sample data'}); render(); dataMsg('Switched back to sample data.', 'ok'); return; }
  if ('paste' in d){
    try { const res = parseAny($('#pasteIn').value); setData(res.acts, {label:'Pasted data', at:Date.now()}); afterDataChange(res, 'Pasted data'); }
    catch(err){ dataMsg('Could not read that: ' + err.message, 'err'); }
    return;
  }
  if ('sheet' in d){
    const url = $('#sheetIn').value.trim(); if (!url){ dataMsg('Paste the published CSV link first.', 'err'); return; }
    dataMsg('Loading…');
    try { const res = await loadSheet(url); S.sheetUrl = url; S.source = 'sheet'; save(); afterDataChange(res, DATA_INFO.label); S.source = 'sheet'; save(); }
    catch(err){ dataMsg(`Couldn't load the Sheet (${err.message}). If you are viewing this inside Claude, outside links are blocked here; host the page yourself, or download the CSV and use Import a file.`, 'err'); }
    return;
  }
  if ('unsheet' in d){ S.sheetUrl = ''; if (S.source === 'sheet') S.source = 'local'; save(); renderSettings(); return; }
  if ('copyschema' in d){ try { await navigator.clipboard.writeText(SCHEMA.split('\n')[0]); b.textContent = 'Copied'; } catch(err){ b.textContent = 'Copy blocked – select the text above'; } return; }
  if ('reset' in d){ const keep = {source:S.source, sheetUrl:S.sheetUrl, gh:S.gh, custom:S.custom}; Object.keys(S).forEach(k => delete S[k]); Object.assign(S, structuredClone(DEFAULTS), keep); ensureNav(); save(); applyTheme(); V.tab = 'settings'; render(); return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pfin != null){ const P = curPivot(), f = P.filters[+t.dataset.pfin], v = isNaN(+t.value) ? t.value : +t.value;
    f.in = t.checked ? [...new Set([...f.in, v])] : f.in.filter(x => x !== v); save(); const y = window.scrollY; renderAnalysis(); window.scrollTo({top:y}); return; }
  if (t.dataset.pdatefrom != null || t.dataset.pdateto != null){ const i = +(t.dataset.pdatefrom ?? t.dataset.pdateto), f = curPivot().filters[i];
    f[t.dataset.pdatefrom != null ? 'from' : 'to'] = t.value; save(); renderAnalysis(); return; }
  if (t.dataset.pchart != null){ const P = curPivot(); P.chart = t.value; if (t.value === 'heat' && P.rows !== 'day'){ P.rows = 'day'; P.cols = ''; } if (t.value === 'scatter' && P.vals.length < 2) P.vals.push({m:'pace', how:'wavg'}); save(); renderAnalysis(); return; }
  if (t.dataset.pshow != null){ curPivot().showAs = t.value; save(); const y = window.scrollY; renderAnalysis(); window.scrollTo({top:y}); return; }

  if (t.id === 'fileIn' && t.files[0]){
    const f = t.files[0];
    f.text().then(txt => { const res = parseAny(txt); const label = 'File: ' + f.name; setData(res.acts, {label, at:Date.now()}); afterDataChange(res, label); })
           .catch(err => dataMsg('Could not read that file: ' + err.message, 'err'));
    return;
  }
  if (t.dataset.set){
    const k = t.dataset.set; let v = t.value;
    if (k === 'maxHr'){ v = Math.min(230, Math.max(120, parseInt(v) || 190)); t.value = v; ACTS.forEach(a => delete a._load); }
    if (k === 'age' || k === 'restHr'){ v = parseInt(v) || ''; t.value = v; }
    S[k] = v; save();
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.tcolor){ S.typeColors = Object.assign({}, S.typeColors, {[t.dataset.tcolor]: t.value}); applyColors(); save(); }
  else if ('accent' in t.dataset){ S.accent = t.value; applyColors(); save(); }
  else if ('linecolor' in t.dataset){ S.lineColor = t.value; applyColors(); save(); }
});
document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('filters')) V.filtersOpen = e.target.open; }, true);
let compactHdr = false;
window.addEventListener('scroll', () => {
  const y = window.scrollY;
  if (!compactHdr && y > 60){ compactHdr = true; $('#hdr').classList.add('scrolled'); }
  else if (compactHdr && y < 8){ compactHdr = false; $('#hdr').classList.remove('scrolled'); }
}, {passive:true});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (V.redraw) V.redraw(); else if (V.tab !== 'settings') drawAll(); }, 120); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet').classList.contains('open')){ closeSheet(); return; } if (e.key === 'Escape' && V.sel != null){ V.sel = null; renderWorkout(); } });

/* installable app: offline helper (only when hosted, e.g. on GitHub Pages) */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch(e){}
}

/* ---------------- boot ---------------- */
(async function boot(){
  applyTheme(); applyColors();
  if (S.source === 'sample' || !loadLocal()) { setData(genSample(), {label:'Sample data'}); if (S.source !== 'sample'){ S.source = 'sample'; } }
  ensureNav(); save();
  const tabs = navTabs();
  V.tab = S.start === 'last' ? (tabs.includes(S.lastTab) ? S.lastTab : tabs[0]) : (tabs.includes(S.start) ? S.start : tabs[0]);
  V.period = S.startPeriod || 'd7';
  render();
  if (hasGH()){
    try { await loadGitHubData(); S.source = 'github'; save(); ensureNav(); rerender(); } catch(err){ toast(esc(err.message), 'err'); }
  } else if (S.source === 'sheet' && S.sheetUrl){
    try { await loadSheet(S.sheetUrl); ensureNav(); rerender(); } catch(err){ /* keep cached copy */ }
  }
})();
</script>
</body>
</html>
