/* =====================================================================
   Generic chart engine — used by Analysis, Custom and Pro
   ===================================================================== */
const CAT_COLORS = ['var(--c-run)','var(--c-cycle)','var(--c-yoga)','var(--c-walk)','var(--c-swim)','var(--c-hike)','var(--c-strength)','var(--c-hiit)'];
let GUID = 0;

function tipFor(el){
  let t = el.querySelector(':scope > .tip');
  if (!t){ t = document.createElement('div'); t.className = 'tip'; t.hidden = true; el.appendChild(t); }
  return t;
}
function showTipAt(el, html, cx, top, W){
  const tip = tipFor(el); tip.innerHTML = html; tip.hidden = false;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(Math.max(0, cx - tw/2), W - tw) + 'px';
  tip.style.top = Math.max(-th + 10, top - th - 10) + 'px';
}
function bindTips(el, n, html, pos, W){
  const tip = tipFor(el);
  el.querySelectorAll('[data-gi]').forEach(r => {
    const i = +r.dataset.gi;
    r.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') showTipAt(el, html(i), ...pos(i), W); });
    r.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') tip.hidden = true; });
    r.addEventListener('click', () => {
      if (!tip.hidden && tip.dataset.i === String(i)){ tip.hidden = true; tip.dataset.i = ''; return; }
      showTipAt(el, html(i), ...pos(i), W); tip.dataset.i = String(i);
    });
  });
}
const tipRow = (k, v, color, line) => `<div class="r"><span class="k">${color ? (line ? `<i class="lnsw" style="background:${color}"></i>` : `<i class="sw" style="background:${color}"></i>`) : ''}${esc(k)}</span><b>${esc(v)}</b></div>`;

/* Category charts: bar, grouped bar, stacked bar, line, area, and mixes.
   c = {cats:[{lab,sub,title}], series:[{name,color,values,as:'bar'|'line'|'area',ownScale,fmt,full}],
        stack, fmt, full, H, refLines:[{v,label}], labelLines, hi} */
function renderCat(el, c){
  if (!el) return;
  const uid = ++GUID, n = c.cats.length;
  const W = Math.max(260, el.clientWidth), H = c.H || 220, pb = 34, pl = 4, pr = 4;
  const bars = c.series.filter(s => (s.as || 'bar') === 'bar');
  const lines = c.series.filter(s => s.as === 'line' || s.as === 'area');
  const shared = lines.filter(s => !s.ownScale);
  // value range (bars stacked or not, plus shared lines)
  let vmax = 0, vmin = 0;
  const totals = c.cats.map((_, i) => bars.reduce((t, s) => t + (s.values[i] > 0 ? s.values[i] : 0), 0));
  if (c.stack) vmax = Math.max(0, ...totals);
  bars.forEach(s => s.values.forEach(v => { if (v != null){ if (!c.stack) vmax = Math.max(vmax, v); vmin = Math.min(vmin, v); } }));
  shared.forEach(s => s.values.forEach(v => { if (v != null){ vmax = Math.max(vmax, v); vmin = Math.min(vmin, v); } }));
  let zoomed = false;
  if (!bars.length && c.zero !== true){
    const vs = shared.flatMap(se => se.values).filter(v => v != null);
    const lo = Math.min(...vs), hi = Math.max(...vs);
    if (vs.length && lo > 0 && lo / hi > .4){ const pad = (hi - lo) * .25 || hi * .05; vmin = lo - pad; vmax = hi + pad; zoomed = true; }
  }
  (c.refLines || []).forEach(r => { vmax = Math.max(vmax, r.v); vmin = Math.min(vmin, r.v); });
  if (vmax === vmin) vmax = vmin + 1;
  const fmt = c.fmt || (v => compact(v)), full = c.full || fmt;
  const slot = (W - pl - pr) / n;
  // bar value labels: horizontal, shrink then stagger, else skip
  const showBarLabels = c.labels !== false && bars.length && (c.stack || bars.length === 1);
  const labelVals = c.cats.map((_, i) => c.stack ? (c.totals === false ? null : totals[i] || null) : (bars[0] ? bars[0].values[i] : null));
  const labs = labelVals.map(v => v == null || (v === 0 && c.hideZero !== false) ? '' : fmt(v));
  const longest = Math.max(1, ...labs.map(l => l.length));
  const fs = Math.max(8, Math.min(10.5, (slot - 2) / (longest * .6)));
  const fitsOne = longest * .6 * fs <= slot - 2, fitsTwo = longest * .6 * fs <= 2 * slot - 4;
  const barLabelMode = !showBarLabels ? 'none' : fitsOne ? 'all' : fitsTwo ? 'stagger' : 'none';
  const pt = 18 + (barLabelMode === 'stagger' ? fs + 3 : 0) + (lines.length && c.labelLines !== false ? 4 : 0);
  const ph = H - pt - pb;
  const y = v => pt + (vmax - v) / (vmax - vmin) * ph;
  const y0 = zoomed ? pt + ph : y(0);
  const hi = c.hi != null ? c.hi : n - 1;
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img"><defs>`;
  c.series.forEach((se, si) => {
    s += `<linearGradient id="gg${uid}_${si}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${se.color}"/><stop offset="1" style="stop-color:${se.color};stop-opacity:var(--bar-fade)"/></linearGradient>`;
    s += `<linearGradient id="ga${uid}_${si}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${se.color};stop-opacity:.45"/><stop offset="1" style="stop-color:${se.color};stop-opacity:0"/></linearGradient>`;
  });
  s += `</defs>`;
  (c.refLines || []).forEach(r => {
    const yy = y(r.v);
    s += `<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>`;
    if (r.label) s += `<text class="reflab" x="${W-pr-2}" y="${yy-3}" text-anchor="end">${esc(r.label)}</text>`;
  });
  s += `<line x1="${pl}" x2="${W-pr}" y1="${y0}" y2="${y0}" stroke="var(--axis)" stroke-width="1"/>`;
  // bars
  const nb = bars.length, groupW = Math.min(slot * .72, c.stack || nb === 1 ? 26 : 12 * nb + 4);
  const bw = c.stack || nb <= 1 ? Math.max(3, Math.min(26, slot * .64)) : Math.max(2, (groupW - (nb - 1) * 2) / nb);
  c.cats.forEach((cat, i) => {
    const cx = pl + i * slot + slot / 2;
    if (nb){
      if (c.stack){
        let acc = 0; const segs = [];
        bars.forEach((se, si) => { const v = se.values[i]; if (v > 0){ segs.push({a:acc, b:acc + v, v, se, si}); acc += v; } });
        const x = cx - bw / 2;
        segs.forEach((g, gi) => {
          const t = y(g.b), bot = y(g.a) - (gi > 0 ? 1.5 : 0), h = bot - t; if (h <= .5) return;
          const st = `fill:url(#gg${uid}_${c.series.indexOf(g.se)});filter:drop-shadow(0 0 ${i === hi ? 'var(--glow-hi)' : 'var(--glow)'} ${g.se.color})`;
          if (gi === segs.length - 1){ const r = Math.min(4, h, bw / 2); s += `<path d="M${x},${bot}V${t+r}Q${x},${t} ${x+r},${t}H${x+bw-r}Q${x+bw},${t} ${x+bw},${t+r}V${bot}Z" style="${st}"/>`; }
          else s += `<rect x="${x}" y="${t}" width="${bw}" height="${h}" style="${st}"/>`;
          if (segs.length > 1){ const lab = (g.se.fmt || fmt)(g.v), ifs = Math.min(9, (bw - 2) / (lab.length * .58));
            if (ifs >= 7 && h >= ifs + 4) s += `<text class="inl" x="${cx}" y="${t + h/2 + ifs*.36}" text-anchor="middle" style="font-size:${ifs.toFixed(1)}px">${esc(lab)}</text>`; }
        });
      } else {
        bars.forEach((se, bi) => {
          const v = se.values[i]; if (v == null || v === 0) return;
          const x = nb === 1 ? cx - bw / 2 : cx - groupW / 2 + bi * (bw + 2);
          const t = Math.min(y(v), y0), h = Math.abs(y(v) - y0); if (h <= .5) return;
          const neg = v < 0, r = Math.min(4, h, bw / 2);
          const st = `fill:${neg ? se.color : `url(#gg${uid}_${c.series.indexOf(se)})`};opacity:${neg ? .75 : 1};filter:drop-shadow(0 0 ${i === hi ? 'var(--glow-hi)' : 'var(--glow)'} ${se.color})`;
          s += neg ? `<path d="M${x},${t}V${t+h-r}Q${x},${t+h} ${x+r},${t+h}H${x+bw-r}Q${x+bw},${t+h} ${x+bw},${t+h-r}V${t}Z" style="${st}"/>`
                   : `<path d="M${x},${t+h}V${t+r}Q${x},${t} ${x+r},${t}H${x+bw-r}Q${x+bw},${t} ${x+bw},${t+r}V${t+h}Z" style="${st}"/>`;
        });
      }
      // label on top (or below for negatives)
      if (barLabelMode !== 'none' && labs[i]){
        const v = labelVals[i], lift = barLabelMode === 'stagger' && (n - 1 - i) % 2 === 1 ? fs + 2 : 0;
        const ly = v < 0 ? y(v) + fs + 3 : y(v) - 5 - lift;
        s += `<text class="vlabel${i === hi ? ' hi' : ''}" x="${cx}" y="${ly}" text-anchor="middle" style="font-size:${fs.toFixed(1)}px">${esc(labs[i])}</text>`;
      }
    }
  });
  // lines / areas
  lines.forEach((se, li) => {
    const vals = se.values, ok = vals.filter(v => v != null);
    if (!ok.length) return;
    let yy = y;
    if (se.ownScale){ const mx = Math.max(...ok), mn = Math.min(0, ...ok); yy = v => pt + ph - ((v - mn) / ((mx - mn) || 1)) * ph * .7; }
    const pts = vals.map((v, i) => v == null ? null : [pl + i * slot + slot / 2, yy(v)]);
    const P = pts.filter(Boolean), d = smoothPath(P);
    if (se.as === 'area' && P.length > 1) s += `<path d="${d}L${P[P.length-1][0]},${y0}L${P[0][0]},${y0}Z" style="fill:url(#ga${uid}_${c.series.indexOf(se)})"/>`;
    s += `<path d="${d}" fill="none" style="stroke:${se.color};stroke-width:2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 var(--glow) ${se.color})"/>`;
    const lf = se.fmt || fmt;
    const labelAll = c.labelLines !== false && c.lineLabels !== 'hi' && n <= 14 && lines.length <= 2;
    pts.forEach((p, i) => {
      if (!p) return;
      const showDot = n <= 60 || i === hi;
      if (showDot) s += `<circle cx="${p[0]}" cy="${p[1]}" r="${i === hi ? 4 : n > 30 ? 2 : 3}" style="fill:${se.color};stroke:var(--surface);stroke-width:1.5"/>`;
      if (c.labelLines !== false && (labelAll || i === hi)){
        const ly = li % 2 === 1 ? p[1] + 14 : p[1] - 8;
        s += `<text class="ovlabel${i === hi ? ' hi' : ''}" x="${p[0]}" y="${ly}" text-anchor="middle" style="fill:${se.color === 'var(--line)' ? 'var(--ink)' : 'var(--ink)'}">${esc(lf(vals[i]))}</text>`;
      }
    });
  });
  // x labels (thinned to fit)
  const lw = Math.max(...c.cats.map(k => String(k.lab).length)) * 5.6 + 6;
  const step = Math.max(1, Math.ceil(lw / slot));
  c.cats.forEach((cat, i) => {
    if ((n - 1 - i) % step) return;
    const cx = pl + i * slot + slot / 2;
    s += `<text class="xl" x="${cx}" y="${H-pb+15}" text-anchor="middle" style="${i === n - 1 && c.boldLast !== false ? 'font-weight:700;fill:var(--ink)' : ''}">${esc(cat.lab)}</text>`;
    if (cat.sub) s += `<text class="xs" x="${cx}" y="${H-pb+28}" text-anchor="middle">${esc(cat.sub)}</text>`;
  });
  c.cats.forEach((_, i) => { s += `<rect data-gi="${i}" x="${pl + i*slot}" y="0" width="${slot}" height="${H}" fill="transparent" style="cursor:pointer"/>`; });
  s += `</svg>`;
  el.innerHTML = s;
  const html = i => {
    let t = `<div class="t">${esc(c.cats[i].title || c.cats[i].lab)}</div>`;
    if (c.stack && bars.length > 1) t += tipRow('Total', full(totals[i]));
    c.series.forEach(se => { const v = se.values[i]; if (v != null && !(c.stack && !v)) t += tipRow(se.name, (se.full || full)(v), se.color, se.as === 'line' || se.as === 'area'); });
    if (c.extraTip) t += c.extraTip(i);
    return t;
  };
  const pos = i => { const top = c.stack ? y(totals[i] || 0) : Math.min(...c.series.map(se => se.values[i] != null && !se.ownScale ? y(Math.max(0, se.values[i])) : y0)); return [pl + i * slot + slot / 2, top]; };
  bindTips(el, n, html, pos, W);
}

/* Scatter: p = {points:[{x,y,color,title}], xf, yf, xLabel, yLabel} */
function renderScatter(el, p){
  if (!el) return;
  const W = Math.max(260, el.clientWidth), H = p.H || 260, pl = 40, pr = 10, pt = 12, pb = 34;
  const xs = p.points.map(q => q.x), ys = p.points.map(q => q.y);
  if (!xs.length){ el.innerHTML = `<div class="empty">No workouts have both values.</div>`; return; }
  const pad = (a, b) => { const d = (b - a) || Math.abs(a) || 1; return [a - d * .06, b + d * .06]; };
  const [x0, x1] = pad(Math.min(...xs), Math.max(...xs)), [y0, y1] = pad(Math.min(...ys), Math.max(...ys));
  const X = v => pl + (v - x0) / (x1 - x0) * (W - pl - pr), Y = v => pt + (y1 - v) / (y1 - y0) * (H - pt - pb);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
  for (let k = 0; k <= 2; k++){
    const xv = x0 + (x1 - x0) * (.08 + k * .42), yv = y0 + (y1 - y0) * (.08 + k * .42);
    s += `<line x1="${pl}" x2="${W-pr}" y1="${Y(yv)}" y2="${Y(yv)}" stroke="var(--grid)"/>`;
    s += `<text class="tick" x="${pl-5}" y="${Y(yv)+3}" text-anchor="end">${esc(p.yf(yv))}</text>`;
    s += `<text class="tick" x="${X(xv)}" y="${H-pb+14}" text-anchor="middle">${esc(p.xf(xv))}</text>`;
  }
  s += `<text class="xs" x="${(pl + W - pr)/2}" y="${H-4}" text-anchor="middle">${esc(p.xLabel)}</text>`;
  s += `<text class="xs" x="10" y="${(pt + H - pb)/2}" text-anchor="middle" transform="rotate(-90 10 ${(pt + H - pb)/2})">${esc(p.yLabel)}</text>`;
  p.points.forEach((q, i) => {
    s += `<circle data-gi="${i}" cx="${X(q.x)}" cy="${Y(q.y)}" r="${p.points.length > 300 ? 3 : 4.5}" style="fill:${q.color};fill-opacity:.8;stroke:var(--surface);stroke-width:1;cursor:pointer;filter:drop-shadow(0 0 var(--glow) ${q.color})"/>`;
  });
  s += `</svg>`;
  el.innerHTML = s;
  bindTips(el, p.points.length, i => { const q = p.points[i]; return `<div class="t">${esc(q.title)}</div>` + tipRow(p.xLabel, p.xf(q.x)) + tipRow(p.yLabel, p.yf(q.y)); },
           i => [X(p.points[i].x), Y(p.points[i].y)], W);
}

/* Donut: d = {slices:[{name,color,value}], full, total} */
function renderDonut(el, d){
  if (!el) return;
  const tot = d.slices.reduce((a, b) => a + b.value, 0);
  if (!tot){ el.innerHTML = `<div class="empty">Nothing to show for this selection.</div>`; return; }
  const R = 78, r = 50, C = 90; let a0 = -Math.PI / 2, s = `<svg viewBox="0 0 180 180" width="180" height="180" class="donut">`;
  d.slices.forEach((sl, i) => {
    const frac = sl.value / tot; if (frac <= 0) return;
    const a1 = a0 + frac * Math.PI * 2 - (d.slices.length > 1 ? .025 : 0);
    const large = a1 - a0 > Math.PI ? 1 : 0, P = (rad, a) => [C + rad * Math.cos(a), C + rad * Math.sin(a)];
    const [x1, y1] = P(R, a0), [x2, y2] = P(R, a1), [x3, y3] = P(r, a1), [x4, y4] = P(r, a0);
    s += frac >= .9999 ? `<circle cx="${C}" cy="${C}" r="${(R + r)/2}" fill="none" style="stroke:${sl.color};stroke-width:${R - r}"/>`
      : `<path data-gi="${i}" d="M${x1},${y1}A${R},${R} 0 ${large} 1 ${x2},${y2}L${x3},${y3}A${r},${r} 0 ${large} 0 ${x4},${y4}Z" style="fill:${sl.color};cursor:pointer;filter:drop-shadow(0 0 var(--glow) ${sl.color})"/>`;
    a0 += frac * Math.PI * 2;
  });
  s += `<text x="${C}" y="${C-2}" text-anchor="middle" class="dtot">${esc(d.short(tot))}</text><text x="${C}" y="${C+14}" text-anchor="middle" class="xs">${esc(d.unit || 'total')}</text></svg>`;
  const legend = `<div class="dleg">${d.slices.map(sl => `<div><i class="sw" style="background:${sl.color}"></i><span>${esc(sl.name)}</span><b>${esc(d.full(sl.value))}</b><em>${Math.round(sl.value / tot * 100)}%</em></div>`).join('')}</div>`;
  el.innerHTML = `<div class="donutwrap">${s}${legend}</div>`;
}

/* Calendar heatmap: h = {from, to, values: Map(dayKey -> v), full, color} */
function renderHeat(el, h){
  if (!el) return;
  const start = new Date(h.from); start.setDate(start.getDate() - ((start.getDay() + 6) % 7));   // Monday
  const days = Math.round((h.to - start) / DAY) + 1, weeks = Math.ceil(days / 7);
  const W = Math.max(260, el.clientWidth), lab = 22, gap = 2;
  const cell = Math.max(10, Math.min(16, Math.floor((W - lab - 14) / weeks) - gap));
  const totalW = lab + weeks * (cell + gap) + 14, Hh = 16 + 7 * (cell + gap);
  const vals = [...h.values.values()].filter(v => v > 0), mx = Math.max(1e-9, ...vals);
  let s = `<svg viewBox="0 0 ${totalW} ${Hh}" width="${totalW}" height="${Hh}">`;
  ['M','','W','','F','','S'].forEach((d, i) => { if (d) s += `<text class="xs" x="0" y="${16 + i*(cell+gap) + cell*.8}">${d}</text>`; });
  let lastM = -1;
  for (let i = 0; i < days; i++){
    const d = addDays(start, i), w = Math.floor(i / 7), r = i % 7;
    if (d < h.from || d > h.to) continue;
    if (r === 0 && d.getMonth() !== lastM && d.getDate() <= 7){ lastM = d.getMonth(); s += `<text class="xs" x="${lab + w*(cell+gap)}" y="10">${MON[d.getMonth()]}</text>`; }
    const v = h.values.get(dayKey(d)) || 0, op = v > 0 ? .25 + .75 * Math.sqrt(v / mx) : 0;
    s += `<rect data-gi="${i}" x="${lab + w*(cell+gap)}" y="${16 + r*(cell+gap)}" width="${cell}" height="${cell}" rx="2" style="fill:${v > 0 ? h.color : 'var(--chip)'};fill-opacity:${v > 0 ? op.toFixed(2) : 1};cursor:pointer"/>`;
  }
  s += `</svg>`;
  el.innerHTML = `<div class="heatscroll">${s}</div>`;
  const sc = el.querySelector('.heatscroll'); sc.scrollLeft = sc.scrollWidth;
  el.querySelectorAll('[data-gi]').forEach(rc => rc.addEventListener('click', () => {
    const d = addDays(start, +rc.dataset.gi), v = h.values.get(dayKey(d)) || 0;
    const t = tipFor(el); t.innerHTML = `<div class="t">${esc(fmtDay(d))}</div>` + tipRow(h.label, v ? h.full(v) : 'Rest day'); t.hidden = false;
    t.style.left = '0px'; t.style.top = (Hh + 4) + 'px';
  }));
}
function dayKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

function legendHtml(series){
  return `<div class="legend">${series.map(se => `<span>${se.as === 'line' || se.as === 'area' ? `<i class="lnsw" style="background:${se.color}"></i>` : `<i class="sw" style="background:${se.color}"></i>`}${esc(se.name)}</span>`).join('')}</div>`;
}

/* =====================================================================
   Analysis: measures (every column in the data), dimensions, filters

// Per-workout training load (Edwards TRIMP: minutes in each zone x zone number)
function loadOf(a){
  if (a._load != null) return a._load;
  let L;
  if (a.zones) L = a.zones.reduce((t, s, i) => t + s / 60 * (i + 1), 0);
  else if (a.hr) L = a.duration / 60 * (zoneOf(a.hr) + 1);
  else L = a.duration / 60 * 1.5;          // no heart rate: treat as light-moderate
  return (a._load = L);
}
const durUnit = mx => mx < 7200 ? {u:'min', f:v => String(Math.round(v/60))} : {u:'h', f:v => (v/3600 >= 100 ? Math.round(v/3600) : +(v/3600).toFixed(1)).toString()};

const plain = (u, dp = 0) => () => ({u, f:v => dp ? (+v.toFixed(dp)).toString() : compact(Math.round(v))});
// value: per-workout number (null = not recorded). ratio measures also give num/den for weighted averages.
const AM = {
  count:     {label:'Workouts', v:a => 1, hows:['sum'], unit:plain('')},

  distance:  {label:'Distance', v:a => a.distance > 0 ? a.distance : null, hows:['sum','avg','max','min'], unit:distUnit, full:v => fmtNum(v/U().dm, 2) + ' ' + U().d},
  pace:      {label:'Pace', v:a => a.distance > 0 && a.duration ? a.duration / (a.distance / U().dm) : null, num:a => a.duration, den:a => a.distance / U().dm,
              hows:['wavg','min','max'], lower:true, unit:() => ({u:'min/' + U().d, f:fmtMS}), full:v => fmtMS(v) + ' /' + U().d},
  pace100:   {label:'Pace per 100 m', v:a => a.distance > 0 && a.duration ? a.duration / (a.distance / 100) : null, num:a => a.duration, den:a => a.distance / 100,
              hows:['wavg','min','max'], lower:true, unit:() => ({u:'min/100m', f:fmtMS}), full:v => fmtMS(v) + ' /100m'},
  speed:     {label:'Speed', v:a => a.distance > 0 && a.duration ? (a.distance / U().dm) / (a.duration / 3600) : null, num:a => a.distance / U().dm, den:a => a.duration / 3600,
              hows:['wavg','max','min'], unit:() => ({u:U().sp, f:v => v.toFixed(1)})},
  avg_hr:    {label:'Average heart rate', v:a => a.hr || null, num:a => a.hr * a.duration, den:a => a.duration, hows:['wavg','max','min'], unit:plain('bpm')},
  max_hr:    {label:'Max heart rate', v:a => a.maxHr || null, hows:['max','avg','min'], unit:plain('bpm')},
  calories:  {label:'Calories', v:a => a.cal || null, hows:['sum','avg','max'], unit:plain('kcal')},
  elevation: {label:'Elevation gain', v:a => a.elev || null, hows:['sum','avg','max'], unit:() => ({u:U().e, f:v => compact(Math.round(v / U().em))})},
  steps:     {label:'Steps', v:a => a.steps || null, hows:['sum','avg','max'], unit:plain('steps')},
  cadence:   {label:'Cadence', v:a => a.cadence || null, num:a => a.cadence * a.duration, den:a => a.duration, hows:['wavg','max','min'], unit:plain('spm')},
  zone1:     {label:'Time in zone 1', v:a => zoneSecs(a)[0], hows:['sum','avg'], unit:durUnit, full:fmtDur},
  zone2:     {label:'Time in zone 2', v:a => zoneSecs(a)[1], hows:['sum','avg'], unit:durUnit, full:fmtDur},
  zone3:     {label:'Time in zone 3', v:a => zoneSecs(a)[2], hows:['sum','avg'], unit:durUnit, full:fmtDur},
  zone4:     {label:'Time in zone 4', v:a => zoneSecs(a)[3], hows:['sum','avg'], unit:durUnit, full:fmtDur},
  zone5:     {label:'Time in zone 5', v:a => zoneSecs(a)[4], hows:['sum','avg'], unit:durUnit, full:fmtDur},
  easy_share:{label:'Easy share (zone 1–2)', v:a => { const z = zoneSecs(a), t = z.reduce((x, y) => x + y, 0); return t ? (z[0] + z[1]) / t * 100 : null; },
              num:a => { const z = zoneSecs(a); return z[0] + z[1]; }, den:a => zoneSecs(a).reduce((x, y) => x + y, 0), f100:true, hows:['wavg'], unit:() => ({u:'%', f:v => String(Math.round(v))})},
  load:      {label:'Training load (TRIMP)', v:a => loadOf(a), hows:['sum','avg','max'], unit:plain('')},
  efficiency:{label:'Aerobic efficiency', v:a => a.distance > 0 && a.hr ? (a.distance / (a.duration / 60)) / a.hr : null,
              num:a => a.distance / (a.duration / 60), den:a => a.hr, hows:['wavg','max','min'], unit:() => ({u:'m/min per bpm', f:v => v.toFixed(2)})},
  vam:       {label:'Climbing rate (VAM)', v:a => a.elev > 0 && a.duration ? a.elev / (a.duration / 3600) : null, num:a => a.elev, den:a => a.duration / 3600,
              hows:['wavg','max'], unit:() => ({u:'m/h', f:v => String(Math.round(v))})},

function zoneSecs(a){
  if (a.zones) return a.zones;
  const z = [0,0,0,0,0]; if (a.hr) z[zoneOf(a.hr)] = a.duration; return z;
}
// Extra numeric columns from imported data get measures automatically
function extraMeasures(){
  const seen = {};
  ACTS.forEach(a => { if (a.x) for (const k in a.x) seen[k] = (seen[k] || 0) + 1; });
  Object.keys(seen).forEach(k => {
    if (AM['x_' + k]) return;
    const lbl = k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    AM['x_' + k] = {label:lbl, v:a => a.x && a.x[k] != null ? a.x[k] : null, hows:['sum','avg','max','min'], unit:plain(''), extra:true};
  });
}
const HOW_LABEL = {sum:'Total', avg:'Average per workout', wavg:'Overall average', max:'Highest', min:'Lowest'};
function howLabel(mk, how){ const m = AM[mk]; if (m.lower && how === 'min') return 'Fastest'; if (m.lower && how === 'max') return 'Slowest'; return HOW_LABEL[how]; }
function aggA(list, mk, how){
  const m = AM[mk];
  if (how === 'wavg'){
    let n = 0, d = 0;
    list.forEach(a => { if (m.v(a) == null) return; const dd = m.den(a); if (dd > 0){ n += m.num(a); d += dd; } });
    return d > 0 ? n / d * (m.f100 ? 100 : 1) : null;
  }
  const vals = list.map(m.v).filter(v => v != null && isFinite(v));
  if (how === 'sum') return mk === 'count' ? list.length : vals.reduce((a, b) => a + b, 0);
  if (!vals.length) return null;
  if (how === 'avg') return vals.reduce((a, b) => a + b, 0) / vals.length;
  if (how === 'max') return Math.max(...vals);
  if (how === 'min') return Math.min(...vals);
  return null;
}
const fullA = (mk, v, mx) => { if (v == null) return '–'; const m = AM[mk]; if (m.full) return m.full(v); const u = m.unit(mx ?? v); return u.f(v) + (u.u ? ' ' + u.u : ''); };

/* ---------- dimensions ---------- */
const TOD = [['Morning',5,11],['Afternoon',11,17],['Evening',17,21],['Night',21,29]];
const todOf = d => { const h = d.getHours() < 5 ? d.getHours() + 24 : d.getHours(); return TOD.findIndex(t => h >= t[1] && h < t[2]); };
const monday = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const DIST_BANDS = [[0,5,'< 5'],[5,10,'5–10'],[10,15,'10–15'],[15,21.1,'15–21'],[21.1,42.2,'21–42'],[42.2,1e9,'42+']];
const DUR_BANDS = [[0,30,'< 30 min'],[30,60,'30–60 min'],[60,90,'1–1.5 h'],[90,120,'1.5–2 h'],[120,1e9,'2 h +']];
const DIMS = {
  day:     {label:'Day', time:'day'},
  week:    {label:'Week (Mon–Sun)', time:'week'},
  month:   {label:'Month', time:'month'},
  quarter: {label:'Quarter', time:'quarter'},
  year:    {label:'Year', time:'year'},
  workout: {label:'Each workout'},
  moy:     {label:'Month of year (Jan–Dec)', cats:() => MON.map((m, i) => ({k:i, lab:m})), key:a => a.start.getMonth()},
  weekday: {label:'Weekday', cats:() => [1,2,3,4,5,6,0].map(i => ({k:i, lab:WD[i]})), key:a => a.start.getDay()},
  hour:    {label:'Hour of day', cats:() => [...Array(24).keys()].map(h => ({k:h, lab:String(h), title:`${h}:00–${h}:59`})), key:a => a.start.getHours()},
  tod:     {label:'Time of day', cats:() => TOD.map((t, i) => ({k:i, lab:t[0]})), key:a => todOf(a.start)},
  type:    {label:'Workout type', cats:list => typeKeys(list).map(k => ({k, lab:typeInfo(k).label, color:typeInfo(k).color})), key:a => a.type},
  sport:   {label:'Zepp sport', cats:list => [...new Set(list.map(a => a.sport || a.type))].sort().map(k => ({k, lab:prettySport(k)})), key:a => a.sport || a.type},
  zone:    {label:'Zone of average HR', cats:() => ZONES.map((z, i) => ({k:i, lab:'Z' + (i + 1), title:'Zone ' + (i + 1) + ' · ' + z.n})), key:a => a.hr ? zoneOf(a.hr) : null},
  distband:{label:'Distance band', cats:() => DIST_BANDS.map((b, i) => ({k:i, lab:b[2], title:b[2] + ' ' + U().d})), key:a => a.distance > 0 ? DIST_BANDS.findIndex(b => a.distance / U().dm >= b[0] && a.distance / U().dm < b[1]) : null},
  durband: {label:'Duration band', cats:() => DUR_BANDS.map((b, i) => ({k:i, lab:b[2]})), key:a => DUR_BANDS.findIndex(b => a.duration / 60 >= b[0] && a.duration / 60 < b[1])},
};
const SPLITS = ['type','year','sport','weekday','tod','zone','distband','durband'];
DIMS.year.key = a => a.start.getFullYear();
const prettySport = s => String(s).replace(/^sport_/, 'Sport ').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
function typeKeys(list){ const c = {}; list.forEach(a => c[a.type] = 1); return [...SLOT_ORDER.filter(k => c[k]), ...Object.keys(c).filter(k => !TYPES[k]).sort()]; }

/* ---------- filters ---------- */
const PRESETS = [['all','All time'],['7d','Last 7 days'],['30d','Last 30 days'],['90d','Last 90 days'],['12m','Last 12 months'],['tw','This week'],['lw','Last week'],['tm','This month'],['lm','Last month'],['ty','This year'],['ly','Last year'],['custom','Custom dates']];
function presetRange(f){
  const t = today0(), tom = addDays(t, 1);
  switch (f.preset){
    case '7d': return [addDays(tom, -7), tom];
    case '30d': return [addDays(tom, -30), tom];
    case '90d': return [addDays(tom, -90), tom];
    case '12m': return [new Date(t.getFullYear() - 1, t.getMonth(), t.getDate() + 1), tom];
    case 'tw': return [monday(t), tom];
    case 'lw': { const m = monday(t); return [addDays(m, -7), m]; }
    case 'tm': return [new Date(t.getFullYear(), t.getMonth(), 1), tom];
    case 'lm': return [new Date(t.getFullYear(), t.getMonth() - 1, 1), new Date(t.getFullYear(), t.getMonth(), 1)];
    case 'ty': return [new Date(t.getFullYear(), 0, 1), tom];
    case 'ly': return [new Date(t.getFullYear() - 1, 0, 1), new Date(t.getFullYear(), 0, 1)];
    case 'custom': return [f.from ? new Date(f.from + 'T00:00') : null, f.to ? addDays(new Date(f.to + 'T00:00'), 1) : null];
    default: return [null, null];
  }
}
function applyFilters(f){
  const [s, e] = presetRange(f);
  return ACTS.filter(a =>
    (!f.types || !f.types.length || f.types.includes(a.type)) &&
    (!s || a.start >= s) && (!e || a.start < e) &&
    (!f.years || !f.years.length || f.years.includes(a.start.getFullYear())) &&
    (!f.months || !f.months.length || f.months.includes(a.start.getMonth())) &&
    (!f.weekdays || !f.weekdays.length || f.weekdays.includes(a.start.getDay())) &&
    (!f.tod || !f.tod.length || f.tod.includes(todOf(a.start))));
}

/* ---------- grouping ---------- */
function timeCats(unit, list, f){
  let [s, e] = presetRange(f);
  if (!list.length && !s) return [];
  s = s || new Date(Math.min(...list.map(a => +a.start)));
  e = e || addDays(today0(), 1);
  const cats = [], push = (st, en, lab, sub, title) => cats.push({st, en, lab, sub, title});
  if (unit === 'day'){
    let d = new Date(s); d.setHours(0,0,0,0);
    for (; d < e; d = addDays(d, 1)) push(d, addDays(d, 1), String(d.getDate()), d.getDate() === 1 || !cats.length ? MON[d.getMonth()] : '', fmtDay(d));
  } else if (unit === 'week'){
    for (let d = monday(s); d < e; d = addDays(d, 7)) push(d, addDays(d, 7), fmtDM(d), '', `Week of ${fmtDM(d)} ${d.getFullYear()}`);
  } else if (unit === 'month'){
    for (let d = new Date(s.getFullYear(), s.getMonth(), 1); d < e; d = new Date(d.getFullYear(), d.getMonth() + 1, 1))
      push(d, new Date(d.getFullYear(), d.getMonth() + 1, 1), MON[d.getMonth()], d.getMonth() === 0 || !cats.length ? "'" + String(d.getFullYear()).slice(2) : '', `${MON[d.getMonth()]} ${d.getFullYear()}`);
  } else if (unit === 'quarter'){
    for (let d = new Date(s.getFullYear(), Math.floor(s.getMonth() / 3) * 3, 1); d < e; d = new Date(d.getFullYear(), d.getMonth() + 3, 1)){
      const q = Math.floor(d.getMonth() / 3) + 1; push(d, new Date(d.getFullYear(), d.getMonth() + 3, 1), 'Q' + q, "'" + String(d.getFullYear()).slice(2), `Q${q} ${d.getFullYear()}`);
    }
  } else {
    for (let y = s.getFullYear(); y <= addDays(e, -1).getFullYear(); y++) push(new Date(y, 0, 1), new Date(y + 1, 0, 1), String(y), '', String(y));
  }
  return cats;
}
const MAX_CATS = 400;
function groupList(by, list, f){
  const D = DIMS[by];
  if (D.time){
    let cats = timeCats(D.time, list, f), note = '';
    if (cats.length > MAX_CATS){ cats = cats.slice(-MAX_CATS); note = `Showing the last ${MAX_CATS} ${D.label.toLowerCase().split(' ')[0]}s. Narrow the dates or group by a longer period to see more.`; }
    return {cats:cats.map(c => ({lab:c.lab, sub:c.sub, title:c.title, list:list.filter(a => a.start >= c.st && a.start < c.en)})), note};
  }
  if (by === 'workout'){
    let l = list.slice().sort((a, b) => a.start - b.start), note = '';
    if (l.length > 120){ l = l.slice(-120); note = 'Showing the latest 120 workouts. Narrow the filters to see others.'; }
    return {cats:l.map(a => ({lab:fmtDM(a.start), sub:'', title:`${typeInfo(a.type).label} · ${fmtDay(a.start)}`, list:[a]})), note};
  }
  const cats = D.cats(list).map(c => ({...c, list:list.filter(a => D.key(a) === c.k)}));
  return {cats:cats.filter(c => !['type','sport'].includes(by) || c.list.length), note:''};
}
function splitSeries(split, list){
  const D = DIMS[split];
  let keys;
  if (split === 'year') keys = [...new Set(list.map(a => a.start.getFullYear()))].sort().map(y => ({k:y, lab:String(y)}));
  else keys = D.cats(list);
  keys = keys.filter(k => list.some(a => D.key(a) === k.k));
  let other = null;
  if (keys.length > 8){ other = keys.slice(7); keys = keys.slice(0, 7); }
  const out = keys.map((k, i) => ({name:k.lab, color:k.color || (split === 'type' ? typeInfo(k.k).color : CAT_COLORS[i % 8]), test:a => D.key(a) === k.k}));
  if (other){ const ks = other.map(o => o.k); out.push({name:'Other', color:'var(--c-other)', test:a => ks.includes(D.key(a))}); }
  return out;
}

/* =====================================================================
   Pivot table (Excel-style): Filters · Rows · Columns · Values
   ===================================================================== */
const pad2 = n => String(n).padStart(2, '0');
function fixHow(mk, how){ const h = AM[mk].hows; return h.includes(how) ? how : h[0]; }
const TIME_DIMS = ['day','week','month','quarter','year'];
// one category value per workout, for any dimension
function dimVal(dim, a){
  const d = a.start;
  switch (dim){
    case 'day': return dayKey(d);

// which fields can go where
const DIM_GROUPS = [

/* numeric filters are typed in friendly units */
function numConv(mk){
  const u = U();
  if (['distance'].includes(mk)) return {u:u.d, to:v => v / u.dm, from:v => v * u.dm};
  if (['duration','elapsed','zone1','zone2','zone3','zone4','zone5'].includes(mk)) return {u:'min', to:v => v / 60, from:v => v * 60};

/* ---------- config ---------- */

function toPivot(c){            // upgrade charts saved by the earlier Analysis builder

function curPivot(){

  const p = S.analysis;

const valName = v => `${howLabel(v.m, v.how)} ${AM[v.m].label.toLowerCase()}`.replace(/^Total workouts$/, 'Workouts');

/* ---------- filtering ---------- */
function pivotList(p){
  const date = p.filters.find(x => x.f === 'date') || {preset:'all'};
  const [s, e] = presetRange(date);
  return ACTS.filter(a => {
    if (s && a.start < s) return false;
    if (e && a.start >= e) return false;
    for (const f of p.filters){
      if (f.f === 'date') continue;
      if (f.in){ if (f.in.length && !f.in.includes(dimVal(f.f, a))) return false; continue; }
      if (f.f.startsWith('m:')){
        const m = AM[f.f.slice(2)]; if (!m) continue; const v = m.v(a);
        if ((f.min !== '' && f.min != null) || (f.max !== '' && f.max != null)){
          if (v == null) return false;
          if (f.min !== '' && f.min != null && v < f.min) return false;

        }

}
function filterText(f){
  if (f.f === 'date'){ const pr = PRESETS.find(x => x[0] === f.preset); return f.preset === 'custom' ? `${f.from || '…'} → ${f.to || 'today'}` : (pr ? pr[1] : 'All time'); }
  if (f.in){ const nm = DIMS[f.f].label; if (!f.in.length) return nm + ': all';
    const ls = f.in.map(k => dimLabel(f.f, k, true)); return nm + ': ' + (ls.length > 3 ? ls.slice(0, 3).join(', ') + ` +${ls.length - 3}` : ls.join(', ')); }

    const lo = f.min !== '' && f.min != null, hi = f.max !== '' && f.max != null;
    return AM[mk].label + ': ' + (lo && hi ? `${fm(f.min)}–${fm(f.max)}` : lo ? `≥ ${fm(f.min)}` : hi ? `≤ ${fm(f.max)}` : 'any') + ' ' + c.u.replace(' (m:ss)', ''); }

const pivotSummary = p => p.filters.map(filterText).join(' · ');

/* ---------- compute ---------- */
function computePivot(p){
  const list = pivotList(p);
  const date = p.filters.find(x => x.f === 'date') || {preset:'all'};
  // rows: time dims are continuous (empty periods kept), others are the values present
  let rows, note = '';
  if (TIME_DIMS.includes(p.rows)){
    const g = groupList(p.rows, list, date); note = g.note;
    rows = g.cats.map(c => ({k:c.list.length ? dimVal(p.rows, c.list[0]) : c.title, lab:c.lab, sub:c.sub, title:c.title, list:c.list}));
  } else if (p.rows === 'workout'){
    const g = groupList('workout', list, date); note = g.note;
    rows = g.cats.map(c => ({k:c.list[0].id, lab:c.lab, title:c.title, list:c.list, a:c.list[0]}));
  } else {
    const by = {}; list.forEach(a => { const k = dimVal(p.rows, a); if (k == null) return; (by[k] = by[k] || []).push(a); });
    const keys = p.rows === 'zone' || p.rows === 'distband' || p.rows === 'durband' || p.rows === 'weekday' || p.rows === 'moy' || p.rows === 'tod' || p.rows === 'hour'
      ? DIMS[p.rows].cats(list).map(c => c.k) : sortKeys(p.rows, Object.keys(by).map(k => isNaN(+k) ? k : +k));
    rows = keys.map(k => ({k, lab:dimLabel(p.rows, k, true), title:dimLabel(p.rows, k), list:by[k] || [], color:p.rows === 'type' ? typeInfo(k).color : null}));
  }
  // columns: values present, max 8 (+ Other)
  let cols = null;
  if (p.cols){
    const cnt = {}; list.forEach(a => { const k = dimVal(p.cols, a); if (k != null) cnt[k] = (cnt[k] || 0) + 1; });
    let keys = sortKeys(p.cols, Object.keys(cnt).map(k => isNaN(+k) ? k : +k));
    let other = null;
    if (keys.length > 8){ const top = keys.slice().sort((a, b) => cnt[b] - cnt[a]).slice(0, 7); other = keys.filter(k => !top.includes(k)); keys = keys.filter(k => top.includes(k)); }
    cols = keys.map((k, i) => ({k, lab:dimLabel(p.cols, k, true), color:dimColor(p.cols, k, i), test:a => dimVal(p.cols, a) === k}));
    if (other) cols.push({k:'__other', lab:'Other', color:'var(--c-other)', test:a => other.includes(dimVal(p.cols, a))});
  }
  const cell = (l, v) => aggA(l, v.m, v.how);

    cells: cols ? cols.map(c => { const l = r.list.filter(c.test); return p.vals.map(v => l.length ? cell(l, v) : null); }) : [p.vals.map(v => r.list.length ? cell(r.list, v) : (v.how === 'sum' ? 0 : null))],

  }));
  const colTotals = cols ? cols.map(c => { const l = list.filter(c.test); return p.vals.map(v => l.length ? cell(l, v) : null); }) : null;

}
const canPct = v => v.how === 'sum';

/* ---------- table ---------- */
function pivotTableHtml(p, R){
  const vals = p.vals, many = vals.length > 1, showAs = p.showAs || 'value';
  const units = vals.map(v => AM[v.m].unit(Math.abs(R.grand[vals.indexOf(v)] || 0)));
  const fmtV = (vi, x, rowTot, colTot) => {
    if (x == null) return '–';
    const v = vals[vi];
    if (showAs !== 'value' && canPct(v)){
      const base = showAs === 'grand' ? R.grand[vi] : showAs === 'row' ? rowTot : colTot;
      return base ? (x / base * 100).toFixed(1) + '%' : '–';
    }
    if (AM[v.m].full) return AM[v.m].full(x);
    const u = AM[v.m].unit(Math.abs(x)); return u.f(x) + (u.u && !many && !R.cols ? '' : u.u ? ' ' + u.u : '');
  };
  // order of rows
  let idx = R.rows.map((_, i) => i);
  const s = p.sort || {k:'label', dir:TIME_DIMS.includes(p.rows) || p.rows === 'workout' ? -1 : 1};
  if (s.k === 'label'){ if (s.dir < 0) idx.reverse(); }
  else {
    const [kind, ci, vi] = s.k.split(':').map((x, i) => i ? +x : x);
    const get = i => kind === 't' ? R.data[i].total[vi] : R.data[i].cells[ci][vi];
    idx.sort((a, b) => ((get(a) ?? -Infinity) - (get(b) ?? -Infinity)) * s.dir);
  }
  const lim = V.pvAll ? idx.length : Math.min(idx.length, 100);
  const arrow = k => p.sort && p.sort.k === k ? (p.sort.dir > 0 ? ' ▲' : ' ▼') : '';
  const unitTxt = vi => showAs !== 'value' && canPct(vals[vi]) ? '%' : (units[vi].u || '');
  let h = `<div class="pvwrap"><table class="pvt"><thead>`;
  if (R.cols){
    if (many){
      h += `<tr><th class="rh" rowspan="2" data-psort="label">${esc(DIMS[p.rows].label)}${arrow('label')}</th>${R.cols.map(c => `<th colspan="${vals.length}" class="ch"><i class="sw" style="background:${c.color}"></i>${esc(c.lab)}</th>`).join('')}<th colspan="${vals.length}" class="ch tot">Total</th></tr>`;
      h += `<tr>${[...R.cols, {}].map((c, ci) => vals.map((v, vi) => { const k = ci < R.cols.length ? `c:${ci}:${vi}` : `t:0:${vi}`; return `<th data-psort="${k}">${esc(valName(v))}${arrow(k)}</th>`; }).join('')).join('')}</tr>`;
    } else {
      h += `<tr><th class="rh" data-psort="label">${esc(DIMS[p.rows].label)}${arrow('label')}</th>${R.cols.map((c, ci) => `<th class="ch" data-psort="c:${ci}:0"><i class="sw" style="background:${c.color}"></i>${esc(c.lab)}${arrow('c:' + ci + ':0')}</th>`).join('')}<th class="ch tot" data-psort="t:0:0">Total${arrow('t:0:0')}</th></tr>`;
    }
  } else {
    h += `<tr><th class="rh" data-psort="label">${esc(DIMS[p.rows].label)}${arrow('label')}</th>${vals.map((v, vi) => `<th data-psort="t:0:${vi}">${esc(valName(v))}${unitTxt(vi) ? ` <span class="u">(${esc(unitTxt(vi))})</span>` : ''}${arrow('t:0:' + vi)}</th>`).join('')}</tr>`;
  }
  h += `</thead><tbody>`;
  for (let n = 0; n < lim; n++){
    const i = idx[n], r = R.rows[i], d = R.data[i];
    const lab = r.color ? `<i class="sw" style="background:${r.color}"></i>${esc(r.title)}` : esc(r.title);
    if (R.cols){
      h += `<tr><td class="rh">${lab}</td>${R.cols.map((c, ci) => vals.map((v, vi) => `<td>${esc(fmtV(vi, d.cells[ci][vi], d.total[vi], R.colTotals[ci][vi]))}</td>`).join('')).join('')}${vals.map((v, vi) => `<td class="tot">${esc(fmtV(vi, d.total[vi], d.total[vi], R.grand[vi]))}</td>`).join('')}</tr>`;
    } else h += `<tr><td class="rh">${lab}</td>${vals.map((v, vi) => `<td>${esc(fmtV(vi, d.total[vi], d.total[vi], R.grand[vi]))}</td>`).join('')}</tr>`;
  }
  // grand total row
  h += `<tr class="pvgt"><td class="rh">Grand total</td>`;
  if (R.cols) h += R.cols.map((c, ci) => vals.map((v, vi) => `<td>${esc(fmtV(vi, R.colTotals[ci][vi], R.grand[vi], R.colTotals[ci][vi]))}</td>`).join('')).join('');
  h += vals.map((v, vi) => `<td class="tot">${esc(fmtV(vi, R.grand[vi], R.grand[vi], R.grand[vi]))}</td>`).join('') + `</tr>`;
  h += `</tbody></table></div>`;
  if (idx.length > lim) h += `<button class="more" data-pvall>Show all ${idx.length} rows</button>`;
  return h;
}

/* ---------- chart ---------- */
const PCHARTS = [['bar','Bar'],['stack','Stacked bar'],['group','Grouped bar'],['line','Line'],['area','Area'],['donut','Donut'],['scatter','Scatter'],['heat','Calendar']];
function drawPivot(el, foot, p){
  extraMeasures();
  const R = computePivot(p);
  if (foot) foot.innerHTML = '';
  if (!R.list.length){ el.innerHTML = `<div class="empty">No workouts match these filters.</div>`; return ''; }
  if (p.view === 'table'){ el.innerHTML = pivotTableHtml(p, R); if (foot && R.note) foot.innerHTML = `<div class="note">${esc(R.note)}</div>`; return ''; }
  const v0 = p.vals[0], m0 = AM[v0.m], showPct = (p.showAs || 'value') !== 'value' && canPct(v0);
  const chart = p.chart || 'bar';
  const notes = [];
  let ou = null;
  // value transform for "show as %"
  const pct = (x, i, ci) => {
    if (!showPct || x == null) return x;
    const base = p.showAs === 'grand' ? R.grand[0] : p.showAs === 'row' ? R.data[i].total[0] : R.cols ? R.colTotals[ci][0] : R.grand[0];

    const sl = R.rows.map((r, i) => ({name:r.title, color:r.color || CAT_COLORS[i % 8], value:Math.max(0, pct(R.data[i].total[0], i, 0) || 0)})).filter(x => x.value > 0).sort((a, b) => b.value - a.value);
    const top = sl.slice(0, 7); if (sl.length > 7) top.push({name:'Other', color:'var(--c-other)', value:sl.slice(7).reduce((t, x) => t + x.value, 0)});
    renderDonut(el, {slices:top, full, short:yu.f, unit:yu.u || m0.label.toLowerCase()});
    if (!canPct(v0)) notes.push(`${m0.label} (${howLabel(v0.m, v0.how).toLowerCase()}) doesn't add up, so slice sizes compare groups but the centre total isn't meaningful.`);
  } else if (chart === 'scatter'){
    if (p.vals.length < 2){ el.innerHTML = `<div class="empty">Scatter needs two values. Add a second value under Values.</div>`; return ''; }
    const v1 = p.vals[1], xm = AM[v0.m], ym = AM[v1.m];
    const pts = R.rows.map((r, i) => ({x:R.data[i].total[0], y:R.data[i].total[1], color:r.a ? typeInfo(r.a.type).color : (r.color || 'var(--accent)'), title:r.title})).filter(q => q.x != null && q.y != null);
    const xu = xm.unit(Math.max(0, ...pts.map(q => q.x))), yu2 = ym.unit(Math.max(0, ...pts.map(q => q.y)));
    renderScatter(el, {points:pts, xf:xu.f, yf:yu2.f, xLabel:valName(v0) + (xu.u ? ` (${xu.u})` : ''), yLabel:valName(v1) + (yu2.u ? ` (${yu2.u})` : '')});
    if (p.rows === 'workout') { const ks = typeKeys(R.list); if (ks.length > 1 && foot) foot.innerHTML = legendHtml(ks.map(k => ({name:typeInfo(k).label, color:typeInfo(k).color}))); }
    return '';
  } else if (chart === 'heat'){
    if (p.rows !== 'day'){ el.innerHTML = `<div class="empty">The calendar needs Rows = Day.</div>`; return ''; }
    const vals = new Map(); R.rows.forEach((r, i) => { if (r.list.length) vals.set(dayKey(r.list[0].start), R.data[i].total[0] || 0); });
    const ds = R.list.map(a => +a.start), date = p.filters.find(x => x.f === 'date') || {};
    let [s, e] = presetRange(date); s = s || new Date(Math.min(...ds)); e = e ? addDays(e, -1) : today0(); if ((e - s) / DAY > 371) s = addDays(e, -371);
    const mx = Math.max(0, ...vals.values());

      series = R.cols.map((c, ci) => ({name:c.lab, color:c.color, values:R.data.map((d, i) => pct(d.cells[ci][0], i, ci)), as:kind === 'line' ? 'line' : kind === 'area' ? 'area' : 'bar'}))
        .filter(se => se.values.some(x => x != null && x !== 0));
    } else {
      const col = p.rows === 'type' ? null : 'var(--accent)';
      series = [{name:valName(v0), color:col || 'var(--accent)', values:R.data.map((d, i) => pct(d.total[0], i, 0)), as:kind === 'line' ? 'line' : kind === 'area' ? 'area' : 'bar'}];
    }

      ou = AM[v1.m].unit(Math.max(0, ...vv.filter(x => x != null)));
      series.push({name:valName(v1), color:'var(--line)', values:vv, as:'line', ownScale:true, fmt:ou.f, full:x => fullA(v1.m, x)});

      const own = R.rows.map((r, i) => ({name:r.title, color:r.color, values:R.rows.map((_, j) => j === i ? series[0].values[i] : null), as:'bar'}));
      renderCat(el, {cats, series:[...own, ...series.slice(1)], stack:true, fmt:yu.f, full, H:230, hi:-1, boldLast:false, extraTip:i => tipRow('Workouts', String(R.rows[i].list.length))});
    } else {
      renderCat(el, {cats, series, stack, fmt:yu.f, full, H:230, hi:TIME_DIMS.includes(p.rows) ? undefined : -1, boldLast:TIME_DIMS.includes(p.rows),
        extraTip:i => tipRow('Workouts', String(R.rows[i].list.length))});
    }
    if (foot && series.length > 1) foot.innerHTML = legendHtml(series);
  }
  if (foot){ if (R.note) notes.push(R.note); if (notes.length) foot.innerHTML += notes.map(n => `<div class="note">${esc(n)}</div>`).join(''); }
  return `(${[yu.u, ou && ou.u ? ou.u + ' line' : ''].filter(Boolean).join(' · ')})`.replace('()', '');
}
function pivotTitle(p){
  if (p.title) return p.title;

  const t = `${v.slice(0, 2).join(' & ')} by ${DIMS[p.rows].label.toLowerCase()}${p.cols ? ' and ' + DIMS[p.cols].label.toLowerCase() : ''}`;

/* =====================================================================
   Pro: sports-science views (options 1–15)
   ===================================================================== */
const dayIdx = d => Math.round((today0() - (() => { const x = new Date(d); x.setHours(0,0,0,0); return x; })()) / DAY);   // 0 = today
function dailyLoadArray(days){
  const arr = new Array(days).fill(0);       // arr[days-1] = today
  ACTS.forEach(a => { const i = days - 1 - dayIdx(a.start); if (i >= 0 && i < days) arr[i] += loadOf(a); });
  return arr;
}
function proModel(){
  const t = today0();
  const first = ACTS.length ? ACTS[0].start : t;
  const span = Math.max(1, Math.round((t - new Date(first.getFullYear(), first.getMonth(), first.getDate())) / DAY) + 1);
  const L = dailyLoadArray(span);
  // Fitness (CTL, 42-day), fatigue (ATL, 7-day), form = yesterday's fitness - yesterday's fatigue
  const ctl = [], atl = [], form = [];
  let c = 0, a = 0;
  L.forEach((x, i) => { form.push(c - a); c += (x - c) / 42; a += (x - a) / 7; ctl.push(c); atl.push(a); });
  // Acute:chronic (rolling averages)
  const acwr = L.map((_, i) => {
    if (i < 27) return null;
    const ac = L.slice(i - 6, i + 1).reduce((p, q) => p + q, 0) / 7, ch = L.slice(i - 27, i + 1).reduce((p, q) => p + q, 0) / 28;
    return ch > 0 ? ac / ch : null;
  });
  return {L, ctl, atl, form, acwr, span};
}
// rolling 7-day blocks ending today (same as the Weeks view)
function blocks(n){
  const tom = addDays(today0(), 1), out = [];
  for (let k = n - 1; k >= 0; k--){ const e = addDays(tom, -7 * k), s = addDays(e, -7); out.push({s, e, lab:fmtDM(s), sub:fmtDM(addDays(e, -1)), title:`${fmtDM(s)} – ${fmtDM(addDays(e, -1))}`, list:ACTS.filter(x => x.start >= s && x.start < e)}); }
  return out;
}
const zoneTotals = list => list.reduce((z, a) => { zoneSecs(a).forEach((s, i) => z[i] += s); return z; }, [0,0,0,0,0]);

/* ---- running: VDOT (Jack Daniels), predictions, paces ---- */
function vdotOf(dm, tmin){
  const v = dm / tmin;
  const vo2 = -4.60 + 0.182258 * v + 0.000104 * v * v;
  const pct = 0.8 + 0.1894393 * Math.exp(-0.012778 * tmin) + 0.2989558 * Math.exp(-0.1932605 * tmin);
  return vo2 / pct;
}
function timeFor(dm, vdot){   // minutes, by bisection (VDOT falls as time rises)
  let lo = dm / 1000 * 1.5, hi = dm / 1000 * 20;
  for (let k = 0; k < 60; k++){ const mid = (lo + hi) / 2; if (vdotOf(dm, mid) > vdot) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}
const velAt = vo2 => (-0.182258 + Math.sqrt(0.182258 ** 2 + 4 * 0.000104 * (vo2 + 4.60))) / (2 * 0.000104);   // m/min
const paceFromV = v => U().dm / v * 60;   // seconds per km/mi
function fmtHMS(min){ const s = Math.round(min * 60), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); }
function runFitness(){
  const since = addDays(today0(), -180);
  const runs = ACTS.filter(a => a.type === 'run' && a.distance >= 3000 && a.duration > 0 && a.start >= since);
  if (!runs.length) return null;
  let best = null;
  runs.forEach(r => { const v = vdotOf(r.distance, r.duration / 60); if (!best || v > best.v) best = {v, r}; });
  const races = [['5K', 5000], ['10K', 10000], ['Half marathon', 21097.5], ['Marathon', 42195]];
  const pred = races.map(([n, d]) => ({n, d, vdot:timeFor(d, best.v), riegel:best.r.duration / 60 * Math.pow(d / best.r.distance, 1.06)}));
  const V = best.v, mar = pred[3].vdot;
  const paces = [
    ['Easy', `${fmtMS(paceFromV(velAt(V * .74)))}–${fmtMS(paceFromV(velAt(V * .59)))}`, 'Most of your running; conversational'],
    ['Marathon', fmtMS(paceFromV(42195 / mar)), 'Steady long efforts'],
    ['Threshold', fmtMS(paceFromV(velAt(V * .88))), '20–40 min tempo, or 5–10 min repeats'],
    ['Interval', fmtMS(paceFromV(velAt(V * .98))), '3–5 min repeats with equal recovery'],
    ['Repetition', fmtMS(paceFromV(velAt(V * .98)) - 15 * U().dm / 1000), '200–400 m fast repeats, full recovery'],
  ];
  return {best, pred, paces, n:runs.length};
}

/* ---- personal records & streaks ---- */
function streaks(){
  const days = new Set(ACTS.map(a => dayKey(a.start)));
  let longest = 0, run = 0, prev = null, longestEnd = null;
  [...days].sort().forEach(k => {
    const d = new Date(k + 'T00:00');
    run = prev && Math.round((d - prev) / DAY) === 1 ? run + 1 : 1; prev = d;
    if (run > longest){ longest = run; longestEnd = d; }
  });
  let cur = 0, d = today0();
  if (!days.has(dayKey(d))) d = addDays(d, -1);           // today not done yet: count to yesterday
  while (days.has(dayKey(d))){ cur++; d = addDays(d, -1); }
  const wk = blocks(12), active = wk.map(b => new Set(b.list.map(a => dayKey(a.start))).size);
  return {longest, longestEnd, cur, perWeek:active.reduce((p, q) => p + q, 0) / wk.length, days};
}
function records(){
  const u = U(), out = [];
  const runs = ACTS.filter(a => a.type === 'run');
  const maxBy = (l, f) => l.reduce((b, a) => (f(a) != null && (!b || f(a) > f(b))) ? a : b, null);
  const minBy = (l, f) => l.reduce((b, a) => (f(a) != null && (!b || f(a) < f(b))) ? a : b, null);
  const when = a => fmtDay(a.start) + (a.start.getFullYear() !== new Date().getFullYear() ? '' : '');
  let r = maxBy(runs, a => a.distance || null); if (r) out.push(['Longest run', fmtNum(r.distance / u.dm, 2) + ' ' + u.d, when(r)]);
  [[5000, '5 km'], [10000, '10 km'], [21097, 'half marathon']].forEach(([d, l]) => {
    const p = minBy(runs.filter(a => a.distance >= d), a => a.duration / (a.distance / u.dm));
    if (p) out.push([`Fastest average pace, ${l}+`, fmtMS(p.duration / (p.distance / u.dm)) + ' /' + u.d, `${fmtNum(p.distance / u.dm, 1)} ${u.d} · ${when(p)}`]);
  });
  r = maxBy(ACTS, a => a.duration); if (r) out.push(['Longest workout', fmtDur(r.duration), `${typeInfo(r.type).label} · ${when(r)}`]);
  r = maxBy(ACTS, a => a.elev || null); if (r) out.push(['Most elevation gain', fmtNum(r.elev / u.em) + ' ' + u.e, `${typeInfo(r.type).label} · ${when(r)}`]);
  r = maxBy(ACTS, a => loadOf(a)); if (r) out.push(['Hardest workout (load)', fmtNum(loadOf(r)), `${typeInfo(r.type).label} · ${when(r)}`]);
  // biggest calendar week and month
  const wk = {}, mo = {};
  ACTS.forEach(a => { const w = dayKey(monday(a.start)), m = a.start.getFullYear() + '-' + a.start.getMonth();
    wk[w] = wk[w] || {run:0, time:0, n:0}; mo[m] = mo[m] || {run:0, time:0};
    if (a.type === 'run'){ wk[w].run += a.distance; mo[m].run += a.distance; }
    wk[w].time += a.duration; wk[w].n++; mo[m].time += a.duration; });
  const top = (o, f) => Object.entries(o).sort((x, y) => f(y[1]) - f(x[1]))[0];
  let w = top(wk, v => v.run); if (w && w[1].run) out.push(['Biggest running week', fmtNum(w[1].run / u.dm, 1) + ' ' + u.d, 'Week of ' + fmtDM(new Date(w[0] + 'T00:00')) + ' ' + w[0].slice(0, 4)]);
  w = top(wk, v => v.time); if (w) out.push(['Most training in a week', fmtDur(w[1].time), 'Week of ' + fmtDM(new Date(w[0] + 'T00:00')) + ' ' + w[0].slice(0, 4)]);
  w = top(wk, v => v.n); if (w) out.push(['Most workouts in a week', String(w[1].n), 'Week of ' + fmtDM(new Date(w[0] + 'T00:00')) + ' ' + w[0].slice(0, 4)]);
  const m = top(mo, v => v.run); if (m && m[1].run){ const [yy, mm] = m[0].split('-'); out.push(['Biggest running month', fmtNum(m[1].run / u.dm, 1) + ' ' + u.d, MON[+mm] + ' ' + yy]); }
  const st = streaks(); if (st.longest) out.push(['Longest streak', st.longest + ' days', 'ending ' + fmtDay(st.longestEnd)]);
  return out;
}

/* ---- today's suggestion ---- */
function suggestion(pm){
  const n = pm.L.length, i = n - 1;
  const recent = ACTS.filter(a => a.start >= addDays(today0(), -28));
  const form = pm.form[i], ratio = pm.acwr[i];
  const z14 = zoneTotals(ACTS.filter(a => a.start >= addDays(today0(), -13))), zt = z14.reduce((p, q) => p + q, 0);
  const easy = zt ? (z14[0] + z14[1]) / zt * 100 : null;
  const hard = ACTS.filter(a => { const z = zoneSecs(a); return z[3] + z[4] >= 600; }).pop();
  const sinceHard = hard ? dayIdx(hard.start) : null;
  const bl = blocks(2), r0 = bl[0].list.filter(a => a.type === 'run').reduce((p, a) => p + a.distance, 0), r1 = bl[1].list.filter(a => a.type === 'run').reduce((p, a) => p + a.distance, 0);
  const ramp = r0 > 0 && r1 > 0 ? (r1 - r0) / r0 * 100 : null;
  const reasons = []; let level = 'steady', head;
  if (!recent.length){ level = 'easy'; head = 'Ease back in'; reasons.push('No workouts in the last 4 weeks, so start with short, easy sessions and build over 2–3 weeks.'); }
  else {
    if (ratio != null && ratio > 1.5){ level = 'rest'; reasons.push(`Your last 7 days were ${ratio.toFixed(2)}× your 4-week average. Above 1.5 is the high-risk zone for injury.`); }
    else if (ratio != null && ratio > 1.3){ level = level === 'rest' ? level : 'easy'; reasons.push(`Load is climbing fast (ratio ${ratio.toFixed(2)}; 0.8–1.3 is the usual safe band).`); }
    if (form < -30){ level = 'rest'; reasons.push(`Form is ${Math.round(form)}: you're carrying a lot of fatigue.`); }
    else if (form < -10){ if (level === 'steady') level = 'easy'; reasons.push(`Form is ${Math.round(form)}: productive training, but you're tired.`); }
    if (easy != null && easy < 70){ if (level === 'steady' || level === 'quality') level = 'easy'; reasons.push(`Only ${Math.round(easy)}% of your time in the last 14 days was easy (zone 1–2). Around 80% is the usual target.`); }
    if (ramp != null && ramp > 10) reasons.push(`Running distance is up ${Math.round(ramp)}% on the previous 7 days. More than about 10% at a time raises injury risk.`);
    if (level === 'steady' && form >= -10 && (ratio == null || ratio <= 1.3) && (sinceHard == null || sinceHard >= 3)){
      level = 'quality'; reasons.push(sinceHard == null ? 'You\'re fresh and haven\'t logged a hard session yet.' : `You're fresh, and your last hard session was ${sinceHard} days ago.`);
    }
    if (ratio != null && ratio < 0.8) reasons.push(`Load is below your usual (ratio ${ratio.toFixed(2)}), so there's room to build gradually.`);
  }
  head = head || {rest:'Rest or very easy today', easy:'Keep it easy today', quality:'Good day for a hard session', steady:'Carry on as planned'}[level];
  const tip = {rest:'A rest day, a walk, or 20–30 min very easy.', easy:'Easy effort in zone 1–2, e.g. an easy run or ride.', quality:'Intervals, a tempo run, or a hill session; keep the rest of the week easy.', steady:'A normal session at easy to moderate effort.'}[level];
  return {level, head, tip, reasons, form, ratio, easy, sinceHard};
}

// Cooper Institute VO2max norms (ml/kg/min), percentile cut-offs 95/80/60/40 by age group
const COOPER = {
  m:{'20':[55.4,51.1,45.4,41.7],'30':[54,48.3,44,40.5],'40':[52.5,46.4,42.4,38.5],'50':[48.9,43.4,39.2,35.6],'60':[45.7,39.5,35.5,32.3],'70':[42.1,36.7,32.3,29.4]},
  f:{'20':[49.6,43.9,39.5,36.1],'30':[47.4,42.4,37.8,34.4],'40':[45.3,39.7,36.3,33],'50':[41.1,36.7,33,30.1],'60':[37.8,33,30,27.5],'70':[36.7,30.9,28.1,25.9]},
};
function coopRating(v){
  const age = +S.age, sex = S.sex;
  if (!age || !['m','f'].includes(sex)) return null;
  const g = String(Math.min(70, Math.max(20, Math.floor(age / 10) * 10)));
  const t = COOPER[sex][g], names = ['Superior','Excellent','Good','Fair','Poor'];
  const i = t.findIndex(x => v >= x); const k = i < 0 ? 4 : i;
  return {name:names[k], pct:['top 5%','top 20%','top 40%','top 60%','bottom 40%'][k], group:`${sex === 'm' ? 'men' : 'women'} ${g}–${+g + 9}`, cls:k <= 1 ? 'good' : k === 2 ? 'ok' : 'low', next:k > 0 ? t[k - 1] : null, nextName:k > 0 ? names[k - 1] : null};
}
function runnerLevel(v){
  return v < 30 ? 'Beginner' : v < 40 ? 'Recreational runner' : v < 50 ? 'Experienced recreational / club runner' : v < 60 ? 'Advanced club runner' : v < 70 ? 'Sub-elite' : 'Elite';
}
// WHO 2020: adults 150–300 min/week moderate, or 75–150 vigorous (1 vigorous minute ≈ 2 moderate)
function whoWeek(){
  const since = addDays(today0(), -27), l = ACTS.filter(a => a.start >= since);
  let mod = 0, vig = 0;
  l.forEach(a => { const z = zoneSecs(a); mod += (z[1] + z[2]) / 60; vig += (z[3] + z[4]) / 60; });
  const days = new Set(l.filter(a => a.type === 'strength' || a.type === 'hiit').map(a => dayKey(a.start))).size;
  return {mod:mod / 4, vig:vig / 4, eq:(mod + 2 * vig) / 4, strengthDays:days / 4};
}
function trainingStyle(z){
  const t = z.reduce((p, q) => p + q, 0); if (!t) return null;
  const e = (z[0] + z[1]) / t * 100, m = z[2] / t * 100, h = (z[3] + z[4]) / t * 100;
  const name = e >= 75 ? (h > m ? 'Polarised' : 'Pyramidal') : e >= 60 ? 'Moderate-heavy' : 'Intensity-heavy';
  const what = {Polarised:'mostly easy with some hard work and little in between, the pattern most elite endurance athletes use',
    Pyramidal:'mostly easy, with more moderate than hard work; also common and effective',
    'Moderate-heavy':'a lot of time at moderate effort; easier easy days usually help more',
    'Intensity-heavy':'much of your time is moderate to hard, which builds fatigue faster than fitness'}[name];
  return {e, m, h, name, what};
}
function badge(text, cls){ return `<span class="badge ${cls || ''}">${esc(text)}</span>`; }

function proInsights(pm, rf, st){
  const n = pm.L.length, i = n - 1, ctl = pm.ctl[i], ctl6 = pm.ctl[Math.max(0, i - 42)];
  const trend = ctl6 > 0 ? (ctl - ctl6) / ctl6 * 100 : null;
  const yr = pm.ctl.slice(-365), peak = Math.max(...yr), peakIdx = pm.ctl.lastIndexOf(peak);
  const rank = yr.filter(x => x <= ctl).length / yr.length * 100;
  const z12 = zoneTotals(ACTS.filter(a => a.start >= addDays(today0(), -83)));
  const style = trainingStyle(z12);
  const who = whoWeek();
  const a28 = pm.acwr.slice(-28).filter(v => v != null), safe = a28.filter(v => v >= 0.8 && v <= 1.3).length;
  const rating = rf ? coopRating(rf.best.v) : null;
  return {ctl, ctl6, trend, peak, peakDay:addDays(today0(), -(n - 1 - peakIdx)), rank, style, who, safe, a28, rating, rf, st};
}

/* "Your level" card */

/* ---------- GitHub: start the sync, wait for it, load the fresh data ---------- */
const GH = () => Object.assign({repo:'', token:'', branch:'main', workflow:'sync.yml', path:'data/workouts.json'}, S.gh || {});
const hasGH = () => !!(GH().repo && GH().token);
async function ghFetch(path, opts = {}){
  const g = GH();
  let r;
  try {
    r = await fetch(`https://api.github.com/repos/${g.repo}${path}`, {method:opts.method || 'GET', cache:'no-store', body:opts.body,
      headers:{'Authorization':'Bearer ' + g.token, 'Accept':opts.accept || 'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'}});
  } catch(e){ throw new Error('Can\'t reach GitHub (offline, or blocked in this preview).'); }
  if (r.status === 401) throw new Error('GitHub rejected the token (wrong or expired). Make a new one in Settings → Sync.');
  if (r.status === 403) throw new Error('The token lacks permission. It needs Actions: Read and write, and Contents: Read on ' + g.repo + '.');
  if (r.status === 404) throw new Error(opts.notFound || 'Not found on GitHub. Check the repository name in Settings → Sync.');
  return r;
}
async function loadGitHubData(){
  const g = GH();
  const r = await ghFetch(`/contents/${g.path}?ref=${encodeURIComponent(g.branch)}`, {accept:'application/vnd.github.raw+json',
    notFound:'No data file in the repository yet. Update the sync workflow (see the update notes), then run a sync once.'});
  if (!r.ok) throw new Error('GitHub error ' + r.status);
  const text = await r.text();
  const res = parseAny(text);
  let synced = null; try { synced = JSON.parse(text).generated_at || null; } catch(e){}
  const info = {label:'GitHub · ' + g.repo, at:Date.now(), synced};
  store.set('data', {acts:serial(res.acts), label:info.label, at:info.at, synced});
  setData(res.acts, info);
  return res;
}
async function startSync(onStep){
  const g = GH(), t0 = Date.now();
  onStep('Starting the Zepp sync…');
  const r = await ghFetch(`/actions/workflows/${g.workflow}/dispatches`, {method:'POST', body:JSON.stringify({ref:g.branch}),
    notFound:`Couldn't find the workflow ${g.workflow} in ${g.repo}.`});
  if (r.status !== 204) throw new Error('GitHub didn\'t start the sync (error ' + r.status + ').');
  let run = null;
  for (let k = 0; k < 60; k++){              // up to ~4 minutes
    await new Promise(res => setTimeout(res, k < 3 ? 2500 : 4000));
    const q = await ghFetch(`/actions/workflows/${g.workflow}/runs?event=workflow_dispatch&per_page=5`);
    const j = await q.json();
    run = (j.workflow_runs || []).find(x => new Date(x.created_at) >= t0 - 60000) || run;
    if (!run){ onStep('Waiting for GitHub to pick it up…'); continue; }
    if (run.status !== 'completed'){ onStep(run.status === 'queued' ? 'Queued on GitHub…' : 'Fetching from Zepp…'); continue; }
    if (run.conclusion !== 'success') throw new Error('The sync failed on GitHub. Open zepp-sync → Actions to see why.');
    return run;
  }
  throw new Error('The sync is taking unusually long. It may still finish; pull again in a minute.');
}
async function lastRun(){
  const g = GH(), r = await ghFetch(`/actions/workflows/${g.workflow}/runs?per_page=1`);
  const j = await r.json(); return (j.workflow_runs || [])[0] || null;
}

/* ---------- refresh (pull-down, the ↻ button, or "Sync now") ---------- */
function toast(msg, cls, keep){
  let t = $('#toast'); clearTimeout(V.toastT);
  t.className = 'toast show ' + (cls || ''); t.innerHTML = msg;
  if (!keep) V.toastT = setTimeout(() => t.className = 'toast', 3800);
}
async function doRefresh(){
  if (V.refreshing) return;
  V.refreshing = true; document.body.classList.add('syncing');
  const before = new Set(ACTS.map(a => a.id));
  try {
    if (hasGH()){
      await startSync(m => toast(`<span class="spin"></span>${esc(m)}`, '', true));
      toast(`<span class="spin"></span>Loading new data…`, '', true);
      await loadGitHubData();
    } else if (S.sheetUrl){
      toast(`<span class="spin"></span>Reloading the Sheet…`, '', true);
      await loadSheet(S.sheetUrl);
    } else { toast('Add a data source in Settings → Sync and data.', 'err'); return; }
    const added = ACTS.filter(a => !before.has(a.id)).length;
    ensureNav(); rerender();
    toast(added ? `✓ ${added} new workout${added > 1 ? 's' : ''}` : (hasGH() ? '✓ Up to date' : '✓ Reloaded. Connect GitHub in Settings to fetch from Zepp.'), 'ok');
  } catch(e){ toast(esc(e.message), 'err'); }
  finally { V.refreshing = false; document.body.classList.remove('syncing'); }
}
function rerender(){ const y = window.scrollY; renderNav(); route(); window.scrollTo({top:y}); }

/* pull-to-refresh gesture */
(function(){
  let y0 = null, pulling = false, armed = false;
  const ind = () => $('#ptr');
  window.addEventListener('touchstart', e => { if (window.scrollY <= 0 && !V.refreshing && e.touches.length === 1){ y0 = e.touches[0].clientY; pulling = false; armed = false; } else y0 = null; }, {passive:true});
  window.addEventListener('touchmove', e => {
    if (y0 == null) return;
    const dy = e.touches[0].clientY - y0;
    if (dy <= 0 || window.scrollY > 0){ if (pulling){ ind().style.transform = ''; ind().classList.remove('on'); } pulling = false; return; }
    pulling = true;
    const h = Math.min(90, dy * .45); armed = h > 62;
    ind().classList.add('on'); ind().style.transform = `translateY(${h}px)`;
    ind().querySelector('span').textContent = armed ? 'Release to sync' : 'Pull to sync';
    ind().classList.toggle('armed', armed);
  }, {passive:true});
  window.addEventListener('touchend', () => {
    if (pulling){ ind().style.transform = ''; ind().classList.remove('on', 'armed'); if (armed) doRefresh(); }
    y0 = null; pulling = false; armed = false;
  }, {passive:true});
})();
