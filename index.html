/* =====================================================================
   Pro: sports-science views (options 1–15)
   ===================================================================== */
const dayIdx = d => Math.round((today0() - (() => { const x = new Date(d); x.setHours(0,0,0,0); return x; })()) / DAY);   // 0 = today
function dailyLoadArray(days){
  const arr = new Array(days).fill(0);       // arr[days-1] = today
  ACTS.forEach(a => { const i = days - 1 - dayIdx(a.start); if (i >= 0 && i < days) arr[i] += loadOf(a); });
  return arr;
}
function proModel(){
  const t = today0();
  const first = ACTS.length ? ACTS[0].start : t;
  const span = Math.max(1, Math.round((t - new Date(first.getFullYear(), first.getMonth(), first.getDate())) / DAY) + 1);
  const L = dailyLoadArray(span);
  // Fitness (CTL, 42-day), fatigue (ATL, 7-day), form = yesterday's fitness - yesterday's fatigue
  const ctl = [], atl = [], form = [];
  let c = 0, a = 0;
  L.forEach((x, i) => { form.push(c - a); c += (x - c) / 42; a += (x - a) / 7; ctl.push(c); atl.push(a); });
  // Acute:chronic (rolling averages)
  const acwr = L.map((_, i) => {
    if (i < 27) return null;
    const ac = L.slice(i - 6, i + 1).reduce((p, q) => p + q, 0) / 7, ch = L.slice(i - 27, i + 1).reduce((p, q) => p + q, 0) / 28;
    return ch > 0 ? ac / ch : null;
  });
  return {L, ctl, atl, form, acwr, span};
}
// rolling 7-day blocks ending today (same as the Weeks view)
function blocks(n){
  const tom = addDays(today0(), 1), out = [];
  for (let k = n - 1; k >= 0; k--){ const e = addDays(tom, -7 * k), s = addDays(e, -7); out.push({s, e, lab:fmtDM(s), sub:fmtDM(addDays(e, -1)), title:`${fmtDM(s)} – ${fmtDM(addDays(e, -1))}`, list:ACTS.filter(x => x.start >= s && x.start < e)}); }
  return out;
}
const zoneTotals = list => list.reduce((z, a) => { zoneSecs(a).forEach((s, i) => z[i] += s); return z; }, [0,0,0,0,0]);

/* ---- running: VDOT (Jack Daniels), predictions, paces ---- */
function vdotOf(dm, tmin){
  const v = dm / tmin;
  const vo2 = -4.60 + 0.182258 * v + 0.000104 * v * v;
  const pct = 0.8 + 0.1894393 * Math.exp(-0.012778 * tmin) + 0.2989558 * Math.exp(-0.1932605 * tmin);
  return vo2 / pct;
}
function timeFor(dm, vdot){   // minutes, by bisection (VDOT falls as time rises)
  let lo = dm / 1000 * 1.5, hi = dm / 1000 * 20;
  for (let k = 0; k < 60; k++){ const mid = (lo + hi) / 2; if (vdotOf(dm, mid) > vdot) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}
const velAt = vo2 => (-0.182258 + Math.sqrt(0.182258 ** 2 + 4 * 0.000104 * (vo2 + 4.60))) / (2 * 0.000104);   // m/min
const paceFromV = v => U().dm / v * 60;   // seconds per km/mi
function fmtHMS(min){ const s = Math.round(min * 60), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); }
function runFitness(){
  const since = addDays(today0(), -180);
  const runs = ACTS.filter(a => a.type === 'run' && a.distance >= 3000 && a.duration > 0 && a.start >= since);
  if (!runs.length) return null;
  let best = null;
  runs.forEach(r => { const v = vdotOf(r.distance, r.duration / 60); if (!best || v > best.v) best = {v, r}; });
  const races = [['5K', 5000], ['10K', 10000], ['Half marathon', 21097.5], ['Marathon', 42195]];
  const pred = races.map(([n, d]) => ({n, d, vdot:timeFor(d, best.v), riegel:best.r.duration / 60 * Math.pow(d / best.r.distance, 1.06)}));
  const V = best.v, mar = pred[3].vdot;
  const paces = [
    ['Easy', `${fmtMS(paceFromV(velAt(V * .74)))}–${fmtMS(paceFromV(velAt(V * .59)))}`, 'Most of your running; conversational'],
    ['Marathon', fmtMS(paceFromV(42195 / mar)), 'Steady long efforts'],
    ['Threshold', fmtMS(paceFromV(velAt(V * .88))), '20–40 min tempo, or 5–10 min repeats'],
    ['Interval', fmtMS(paceFromV(velAt(V * .98))), '3–5 min repeats with equal recovery'],
    ['Repetition', fmtMS(paceFromV(velAt(V * .98)) - 15 * U().dm / 1000), '200–400 m fast repeats, full recovery'],
  ];
  return {best, pred, paces, n:runs.length};
}

/* ---- personal records & streaks ---- */
function streaks(){
  const days = new Set(ACTS.map(a => dayKey(a.start)));
  let longest = 0, run = 0, prev = null, longestEnd = null;
  [...days].sort().forEach(k => {
    const d = new Date(k + 'T00:00');
    run = prev && Math.round((d - prev) / DAY) === 1 ? run + 1 : 1; prev = d;
    if (run > longest){ longest = run; longestEnd = d; }
  });
  let cur = 0, d = today0();
  if (!days.has(dayKey(d))) d = addDays(d, -1);           // today not done yet: count to yesterday
  while (days.has(dayKey(d))){ cur++; d = addDays(d, -1); }
  const wk = blocks(12), active = wk.map(b => new Set(b.list.map(a => dayKey(a.start))).size);
  return {longest, longestEnd, cur, perWeek:active.reduce((p, q) => p + q, 0) / wk.length, days};
}
function records(){
  const u = U(), out = [];
  const runs = ACTS.filter(a => a.type === 'run');
  const maxBy = (l, f) => l.reduce((b, a) => (f(a) != null && (!b || f(a) > f(b))) ? a : b, null);
  const minBy = (l, f) => l.reduce((b, a) => (f(a) != null && (!b || f(a) < f(b))) ? a : b, null);
  const when = a => fmtDay(a.start) + (a.start.getFullYear() !== new Date().getFullYear() ? '' : '');
  let r = maxBy(runs, a => a.distance || null); if (r) out.push(['Longest run', fmtNum(r.distance / u.dm, 2) + ' ' + u.d, when(r)]);
  [[5000, '5 km'], [10000, '10 km'], [21097, 'half marathon']].forEach(([d, l]) => {
    const p = minBy(runs.filter(a => a.distance >= d), a => a.duration / (a.distance / u.dm));
    if (p) out.push([`Fastest average pace, ${l}+`, fmtMS(p.duration / (p.distance / u.dm)) + ' /' + u.d, `${fmtNum(p.distance / u.dm, 1)} ${u.d} · ${when(p)}`]);
  });
  r = maxBy(ACTS, a => a.duration); if (r) out.push(['Longest workout', fmtDur(r.duration), `${typeInfo(r.type).label} · ${when(r)}`]);
  r = maxBy(ACTS, a => a.elev || null); if (r) out.push(['Most elevation gain', fmtNum(r.elev / u.em) + ' ' + u.e, `${typeInfo(r.type).label} · ${when(r)}`]);
  r = maxBy(ACTS, a => loadOf(a)); if (r) out.push(['Hardest workout (load)', fmtNum(loadOf(r)), `${typeInfo(r.type).label} · ${when(r)}`]);
  // biggest calendar week and month
  const wk = {}, mo = {};
  ACTS.forEach(a => { const w = dayKey(monday(a.start)), m = a.start.getFullYear() + '-' + a.start.getMonth();
    wk[w] = wk[w] || {run:0, time:0, n:0}; mo[m] = mo[m] || {run:0, time:0};
    if (a.type === 'run'){ wk[w].run += a.distance; mo[m].run += a.distance; }
    wk[w].time += a.duration; wk[w].n++; mo[m].time += a.duration; });
  const top = (o, f) => Object.entries(o).sort((x, y) => f(y[1]) - f(x[1]))[0];
  let w = top(wk, v => v.run); if (w && w[1].run) out.push(['Biggest running week', fmtNum(w[1].run / u.dm, 1) + ' ' + u.d, 'Week of ' + fmtDM(new Date(w[0] + 'T00:00')) + ' ' + w[0].slice(0, 4)]);
  w = top(wk, v => v.time); if (w) out.push(['Most training in a week', fmtDur(w[1].time), 'Week of ' + fmtDM(new Date(w[0] + 'T00:00')) + ' ' + w[0].slice(0, 4)]);
  w = top(wk, v => v.n); if (w) out.push(['Most workouts in a week', String(w[1].n), 'Week of ' + fmtDM(new Date(w[0] + 'T00:00')) + ' ' + w[0].slice(0, 4)]);
  const m = top(mo, v => v.run); if (m && m[1].run){ const [yy, mm] = m[0].split('-'); out.push(['Biggest running month', fmtNum(m[1].run / u.dm, 1) + ' ' + u.d, MON[+mm] + ' ' + yy]); }
  const st = streaks(); if (st.longest) out.push(['Longest streak', st.longest + ' days', 'ending ' + fmtDay(st.longestEnd)]);
  return out;
}

/* ---- today's suggestion ---- */
function suggestion(pm){
  const n = pm.L.length, i = n - 1;
  const recent = ACTS.filter(a => a.start >= addDays(today0(), -28));
  const form = pm.form[i], ratio = pm.acwr[i];
  const z14 = zoneTotals(ACTS.filter(a => a.start >= addDays(today0(), -13))), zt = z14.reduce((p, q) => p + q, 0);
  const easy = zt ? (z14[0] + z14[1]) / zt * 100 : null;
  const hard = ACTS.filter(a => { const z = zoneSecs(a); return z[3] + z[4] >= 600; }).pop();
  const sinceHard = hard ? dayIdx(hard.start) : null;
  const bl = blocks(2), r0 = bl[0].list.filter(a => a.type === 'run').reduce((p, a) => p + a.distance, 0), r1 = bl[1].list.filter(a => a.type === 'run').reduce((p, a) => p + a.distance, 0);
  const ramp = r0 > 0 && r1 > 0 ? (r1 - r0) / r0 * 100 : null;
  const reasons = []; let level = 'steady', head;
  if (!recent.length){ level = 'easy'; head = 'Ease back in'; reasons.push('No workouts in the last 4 weeks, so start with short, easy sessions and build over 2–3 weeks.'); }
  else {
    if (ratio != null && ratio > 1.5){ level = 'rest'; reasons.push(`Your last 7 days were ${ratio.toFixed(2)}× your 4-week average. Above 1.5 is the high-risk zone for injury.`); }
    else if (ratio != null && ratio > 1.3){ level = level === 'rest' ? level : 'easy'; reasons.push(`Load is climbing fast (ratio ${ratio.toFixed(2)}; 0.8–1.3 is the usual safe band).`); }
    if (form < -30){ level = 'rest'; reasons.push(`Form is ${Math.round(form)}: you're carrying a lot of fatigue.`); }
    else if (form < -10){ if (level === 'steady') level = 'easy'; reasons.push(`Form is ${Math.round(form)}: productive training, but you're tired.`); }
    if (easy != null && easy < 70){ if (level === 'steady' || level === 'quality') level = 'easy'; reasons.push(`Only ${Math.round(easy)}% of your time in the last 14 days was easy (zone 1–2). Around 80% is the usual target.`); }
    if (ramp != null && ramp > 10) reasons.push(`Running distance is up ${Math.round(ramp)}% on the previous 7 days. More than about 10% at a time raises injury risk.`);
    if (level === 'steady' && form >= -10 && (ratio == null || ratio <= 1.3) && (sinceHard == null || sinceHard >= 3)){
      level = 'quality'; reasons.push(sinceHard == null ? 'You\'re fresh and haven\'t logged a hard session yet.' : `You're fresh, and your last hard session was ${sinceHard} days ago.`);
    }
    if (ratio != null && ratio < 0.8) reasons.push(`Load is below your usual (ratio ${ratio.toFixed(2)}), so there's room to build gradually.`);
  }
  head = head || {rest:'Rest or very easy today', easy:'Keep it easy today', quality:'Good day for a hard session', steady:'Carry on as planned'}[level];
  const tip = {rest:'A rest day, a walk, or 20–30 min very easy.', easy:'Easy effort in zone 1–2, e.g. an easy run or ride.', quality:'Intervals, a tempo run, or a hill session; keep the rest of the week easy.', steady:'A normal session at easy to moderate effort.'}[level];
  return {level, head, tip, reasons, form, ratio, easy, sinceHard};
}

function syncedText(){

  if (!t || isNaN(t)) return '';
  const today = dayKey(new Date()) === dayKey(t), yest = dayKey(addDays(new Date(), -1)) === dayKey(t);

}

    + ` <button class="sublink" data-refresh aria-label="Sync now">${icon('refresh', 2.2)}<span>Sync</span></button>`;

const refreshBtn = () => '';

/* ---------- GitHub: start the sync, wait for it, load the fresh data ---------- */
const GH = () => Object.assign({repo:'', token:'', branch:'main', workflow:'sync.yml', path:'data/workouts.json'}, S.gh || {});
const hasGH = () => !!(GH().repo && GH().token);
async function ghFetch(path, opts = {}){
  const g = GH();
  let r;
  try {
    r = await fetch(`https://api.github.com/repos/${g.repo}${path}`, {method:opts.method || 'GET', cache:'no-store', body:opts.body,
      headers:{'Authorization':'Bearer ' + g.token, 'Accept':opts.accept || 'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'}});
  } catch(e){ throw new Error('Can\'t reach GitHub (offline, or blocked in this preview).'); }
  if (r.status === 401) throw new Error('GitHub rejected the token (wrong or expired). Make a new one in Settings → Sync.');
  if (r.status === 403) throw new Error('The token lacks permission. It needs Actions: Read and write, and Contents: Read on ' + g.repo + '.');
  if (r.status === 404) throw new Error(opts.notFound || 'Not found on GitHub. Check the repository name in Settings → Sync.');
  return r;
}
async function loadGitHubData(){
  const g = GH();
  const r = await ghFetch(`/contents/${g.path}?ref=${encodeURIComponent(g.branch)}`, {accept:'application/vnd.github.raw+json',
    notFound:'No data file in the repository yet. Update the sync workflow (see the update notes), then run a sync once.'});
  if (!r.ok) throw new Error('GitHub error ' + r.status);
  const text = await r.text();
  const res = parseAny(text);
  let synced = null; try { synced = JSON.parse(text).generated_at || null; } catch(e){}
  const info = {label:'GitHub · ' + g.repo, at:Date.now(), synced};
  store.set('data', {acts:serial(res.acts), label:info.label, at:info.at, synced});
  setData(res.acts, info);
  return res;
}
async function startSync(onStep){
  const g = GH(), t0 = Date.now();
  onStep('Starting the Zepp sync…');
  const r = await ghFetch(`/actions/workflows/${g.workflow}/dispatches`, {method:'POST', body:JSON.stringify({ref:g.branch}),
    notFound:`Couldn't find the workflow ${g.workflow} in ${g.repo}.`});
  if (r.status !== 204) throw new Error('GitHub didn\'t start the sync (error ' + r.status + ').');
  let run = null;
  for (let k = 0; k < 60; k++){              // up to ~4 minutes
    await new Promise(res => setTimeout(res, k < 3 ? 2500 : 4000));
    const q = await ghFetch(`/actions/workflows/${g.workflow}/runs?event=workflow_dispatch&per_page=5`);
    const j = await q.json();
    run = (j.workflow_runs || []).find(x => new Date(x.created_at) >= t0 - 60000) || run;
    if (!run){ onStep('Waiting for GitHub to pick it up…'); continue; }
    if (run.status !== 'completed'){ onStep(run.status === 'queued' ? 'Queued on GitHub…' : 'Fetching from Zepp…'); continue; }
    if (run.conclusion !== 'success') throw new Error('The sync failed on GitHub. Open zepp-sync → Actions to see why.');
    return run;
  }
  throw new Error('The sync is taking unusually long. It may still finish; pull again in a minute.');
}
async function lastRun(){
  const g = GH(), r = await ghFetch(`/actions/workflows/${g.workflow}/runs?per_page=1`);
  const j = await r.json(); return (j.workflow_runs || [])[0] || null;
}

/* ---------- refresh (pull-down, the ↻ button, or "Sync now") ---------- */
function toast(msg, cls, keep){
  let t = $('#toast'); clearTimeout(V.toastT);
  t.className = 'toast show ' + (cls || ''); t.innerHTML = msg;
  if (!keep) V.toastT = setTimeout(() => t.className = 'toast', 3800);
}
async function doRefresh(){
  if (V.refreshing) return;
  V.refreshing = true; document.body.classList.add('syncing');
  const before = new Set(ACTS.map(a => a.id));
  try {
    if (hasGH()){
      await startSync(m => toast(`<span class="spin"></span>${esc(m)}`, '', true));
      toast(`<span class="spin"></span>Loading new data…`, '', true);
      await loadGitHubData();
    } else if (S.sheetUrl){
      toast(`<span class="spin"></span>Reloading the Sheet…`, '', true);
      await loadSheet(S.sheetUrl);
    } else { toast('Add a data source in Settings → Sync and data.', 'err'); return; }
    const added = ACTS.filter(a => !before.has(a.id)).length;
    ensureNav(); rerender();
    toast(added ? `✓ ${added} new workout${added > 1 ? 's' : ''}` : (hasGH() ? '✓ Up to date' : '✓ Reloaded. Connect GitHub in Settings to fetch from Zepp.'), 'ok');
  } catch(e){ toast(esc(e.message), 'err'); }
  finally { V.refreshing = false; document.body.classList.remove('syncing'); }
}
function rerender(){ const y = window.scrollY; renderNav(); route(); window.scrollTo({top:y}); }

/* pull-to-refresh gesture */
(function(){
  let y0 = null, pulling = false, armed = false;
  const ind = () => $('#ptr');
  window.addEventListener('touchstart', e => { if (window.scrollY <= 0 && !V.refreshing && e.touches.length === 1){ y0 = e.touches[0].clientY; pulling = false; armed = false; } else y0 = null; }, {passive:true});
  window.addEventListener('touchmove', e => {
    if (y0 == null) return;
    const dy = e.touches[0].clientY - y0;
    if (dy <= 0 || window.scrollY > 0){ if (pulling){ ind().style.transform = ''; ind().classList.remove('on'); } pulling = false; return; }
    pulling = true;
    const h = Math.min(90, dy * .45); armed = h > 62;
    ind().classList.add('on'); ind().style.transform = `translateY(${h}px)`;
    ind().querySelector('span').textContent = armed ? 'Release to sync' : 'Pull to sync';
    ind().classList.toggle('armed', armed);
  }, {passive:true});
  window.addEventListener('touchend', () => {
    if (pulling){ ind().style.transform = ''; ind().classList.remove('on', 'armed'); if (armed) doRefresh(); }
    y0 = null; pulling = false; armed = false;
  }, {passive:true});
})();

/* ---------- colour themes ---------- */
const THEMES = {
  neon:    {label:'Neon', note:'Default'},
  classic: {label:'Classic', c:{run:'#2a78d6', cycle:'#eb6834', yoga:'#e87ba4', walk:'#1baf7a', swim:'#008300', hike:'#eda100', strength:'#6250d6', hiit:'#e34948'}, accent:'#2a78d6'},
  pastel:  {label:'Pastel', c:{run:'#6fa8f0', cycle:'#f0a173', yoga:'#ee9cc2', walk:'#79cf98', swim:'#8f9ff5', hike:'#e8c463', strength:'#b29af0', hiit:'#ef8585'}, accent:'#6fa8f0'},
  ocean:   {label:'Ocean', c:{run:'#00a6c8', cycle:'#ff8a3d', yoga:'#c86bff', walk:'#2ec4a0', swim:'#3d6bff', hike:'#e0b000', strength:'#7a5cff', hiit:'#ff4f7b'}, accent:'#00a6c8'},
  vivid:   {label:'High contrast', c:{run:'#0095ff', cycle:'#ff6a00', yoga:'#ff2d95', walk:'#00c060', swim:'#5b4bff', hike:'#f5c400', strength:'#a53dff', hiit:'#ff2a2a'}, accent:'#0095ff'},
  mono:    {label:'Mono', c:{run:'#0bb5d0', cycle:'#0a8fa6', yoga:'#5fd3e4', walk:'#076d7e', swim:'#8fe3ef', hike:'#0a7f93', strength:'#36c4da', hiit:'#055866'}, accent:'#0bb5d0'},
};
function applyColors(){
  const st = document.documentElement.style, th = THEMES[S.palette] || THEMES.neon;
  ['run','cycle','yoga','walk','swim','hike','strength','hiit'].forEach(k => {
    const v = (S.typeColors || {})[k] || (th.c ? th.c[k] : '');
    if (v) st.setProperty('--c-' + k, v); else st.removeProperty('--c-' + k);
  });
  const acc = S.accent || th.accent || '';
  if (acc) st.setProperty('--accent', acc); else st.removeProperty('--accent');
  if (S.lineColor) st.setProperty('--line', S.lineColor); else st.removeProperty('--line');
}
function colorsSettingsHtml(){
  const th = THEMES[S.palette] ? S.palette : 'neon';
  const cs = getComputedStyle(document.documentElement);
  const hex = v => { v = (v || '').trim(); if (/^#[0-9a-f]{6}$/i.test(v)) return v; const m = v.match(/\d+/g); return m ? '#' + m.slice(0, 3).map(x => (+x).toString(16).padStart(2, '0')).join('') : '#888888'; };
  return `<h3>Colours</h3><div class="card">
    <div class="stack"><div class="lbl">Theme</div><div class="chips wrap" style="padding:0">${Object.keys(THEMES).map(k => `<button class="chip ${th === k ? 'on' : ''}" data-palette="${k}">${THEMES[k].label}</button>`).join('')}</div></div>
    <div class="stack" style="border-top:1px solid var(--grid)"><div class="lbl">Workout colours</div><div class="cgrid">
      ${SLOT_ORDER.map(k => `<label class="cpick"><input type="color" value="${hex(cs.getPropertyValue('--c-' + k))}" data-tcolor="${k}"><span>${TYPES[k].label}</span></label>`).join('')}</div></div>
    <div class="stack" style="border-top:1px solid var(--grid)"><div class="cgrid">
      <label class="cpick"><input type="color" value="${hex(cs.getPropertyValue('--accent'))}" data-accent><span>Accent</span></label>
      <label class="cpick"><input type="color" value="${hex(S.lineColor || cs.getPropertyValue('--ink'))}" data-linecolor><span>Line overlay</span></label></div>
      <div class="btnrow"><button class="btn" data-colorsreset>Reset colours</button></div></div>
    <div class="note" style="padding:0 0 10px">Neon, Classic and High contrast keep neighbouring colours distinguishable for colour-blind viewers. Pastel and Mono are softer and rely more on the legends.</div>
  </div>`;
}

/* ---------- Settings: profile, sync & schedule ---------- */
const SCHEDULE = [['6:17 AM', '47 0 * * *'], ['9:30 AM', '0 4 * * *'], ['6:17 PM', '47 12 * * *'], ['9:30 PM', '0 16 * * *']];
function profileSettingsHtml(){
  return `<h3>Profile (for Pro)</h3><div class="card">
    <div class="srow"><div class="grow">Age</div><input type="number" min="10" max="100" value="${S.age || ''}" data-set="age" style="width:84px" placeholder="–"></div>
    <div class="srow"><div class="grow">Resting heart rate<div class="n">Lowest you see on waking, in bpm</div></div><input type="number" min="30" max="110" value="${S.restHr || ''}" data-set="restHr" style="width:84px" placeholder="–"></div>
    <div class="srow"><div class="grow">Max heart rate<div class="n">Sets zone boundaries. Pro suggests values.</div></div><input type="number" min="120" max="230" value="${S.maxHr}" data-set="maxHr" style="width:84px"></div>
  </div>`;
}
function syncSettingsHtml(){
  const g = GH();
  return `<h3>Sync with Zepp</h3><div class="card">
    <div class="stack"><div class="lbl">Automatic syncs (India time)</div>
      <div class="sched">${SCHEDULE.map(s => `<span>${s[0]}</span>`).join('')}</div>
      <div class="n">Run by GitHub from your zepp-sync repository. GitHub often starts these late, sometimes by hours. Pull down on any screen to sync right away.</div>
      <div id="lastrun" class="n">${DATA_INFO.synced ? 'Data last synced: ' + esc(syncedText().replace('Synced ', '')) : ''}</div></div>
    <div class="stack" style="border-top:1px solid var(--grid)"><div class="lbl">Pull-to-refresh connection</div>
      <div class="n">Lets this app start a Zepp sync and load the result straight away. Saved only in this browser.</div>
      <label class="fl">Repository<input type="text" id="ghRepo" value="${esc(g.repo)}" placeholder="your-name/zepp-sync" autocapitalize="off" spellcheck="false"></label>
      <label class="fl">Token<input type="password" id="ghToken" value="${esc(g.token)}" placeholder="github_pat_…" autocomplete="off"></label>
      <div class="btnrow"><button class="btn primary" data-ghsave>Save and test</button>${hasGH() ? '<button class="btn" data-refresh>Sync now</button><button class="btn" data-ghforget>Remove</button>' : ''}</div>
      <div id="ghMsg" class="msg"></div>
      <details><summary class="n" style="cursor:pointer">How to make the token</summary><ol class="n steps">
        <li>On GitHub: your picture → <b>Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token</b>.</li>
        <li>Name it, set the longest expiry, and under <b>Repository access</b> pick <b>Only select repositories → zepp-sync</b>.</li>
        <li><b>Permissions → Repository permissions</b>: <b>Actions: Read and write</b>, <b>Contents: Read-only</b>.</li>
        <li>Generate, copy it, paste it above. It can only start this sync and read its data.</li></ol></details>
    </div></div>`;
}

/* ---------------- events ---------------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('button, [data-i]'); if (!b) return;
  const d = b.dataset;

  // ---- refresh / sync ----
  if ('refresh' in d){ doRefresh(); return; }
  if ('ghsave' in d){
    S.gh = Object.assign(GH(), {repo:$('#ghRepo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, ''), token:$('#ghToken').value.trim()}); save();
    const msg = $('#ghMsg'); msg.className = 'msg'; msg.textContent = 'Checking…';
    try { const r = await lastRun(); msg.textContent = 'Connected. Loading data…';
      try { const res = await loadGitHubData(); S.source = 'github'; save(); ensureNav(); renderNav(); renderSettings();
        const m2 = $('#ghMsg'); m2.className = 'msg ok'; m2.textContent = `Connected · loaded ${res.acts.length} workouts. Pull down on any screen to sync.`; }
      catch(err){ msg.className = 'msg err'; msg.textContent = 'Connected to GitHub, but: ' + err.message; } }
    catch(err){ msg.className = 'msg err'; msg.textContent = err.message; }
    return;
  }
  if ('ghforget' in d){ S.gh = Object.assign(GH(), {token:''}); save(); renderSettings(); return; }
  // ---- colours ----
  if (d.palette){ S.palette = d.palette; S.typeColors = {}; S.accent = ''; save(); applyColors(); renderSettings(); return; }
  if ('colorsreset' in d){ S.palette = 'neon'; S.typeColors = {}; S.accent = ''; S.lineColor = ''; save(); applyColors(); renderSettings(); return; }
  // ---- pro ----
  if (d.usemax){ S.maxHr = +d.usemax; ACTS.forEach(a => delete a._load); save(); renderPro(); toast('Max heart rate set to ' + d.usemax + ' bpm', 'ok'); return; }
  // ---- analysis ----
  if (d.af){
    const c = curCfg(), arr = c.f[d.af] || [], v = d.af === 'types' ? d.v : +d.v;
    c.f[d.af] = arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];
    V.filtersOpen = true; save(); const y = window.scrollY; renderAnalysis(); window.scrollTo({top:y}); return;
  }
  if (d.afclear){ curCfg().f[d.afclear] = []; V.filtersOpen = true; save(); const y = window.scrollY; renderAnalysis(); window.scrollTo({top:y}); return; }
  if ('apin' in d){
    const c = structuredClone(curCfg()); c.title = c.title || autoTitle(c);
    S.custom = [...(S.custom || []), c]; save(); renderNav();
    const m = $('#apinmsg'); m.className = 'msg ok';
    m.textContent = S.navOn.includes('custom') ? 'Pinned. It\'s on your Custom page.' : 'Pinned. Turn on "Custom" in Settings → Bottom bar to see your charts.';
    return;
  }
  if ('areset' in d){ S.analysis = defaultCfg(); save(); renderAnalysis(); return; }
  if ('asave' in d){ const c = structuredClone(curCfg()); S.custom[V.editIdx] = c; S.analysis = V.prevAnalysis || defaultCfg(); V.editIdx = null; save(); V.tab = 'custom'; render(); toast('Chart updated', 'ok'); return; }
  if ('acancel' in d){ S.analysis = V.prevAnalysis || defaultCfg(); V.editIdx = null; save(); V.tab = 'custom'; render(); return; }
  // ---- custom page ----
  if (d.cmv != null){ const i = +d.cmv, j = i + +d.dir, o = S.custom; [o[i], o[j]] = [o[j], o[i]]; save(); const y = window.scrollY; renderCustom(); window.scrollTo({top:y}); return; }
  if (d.cedit != null){ V.prevAnalysis = structuredClone(curCfg()); S.analysis = structuredClone(S.custom[+d.cedit]); V.editIdx = +d.cedit; V.filtersOpen = false; V.tab = 'analysis'; render(); return; }
  if (d.cren != null){ const box = $('#cr' + d.cren); box.hidden = !box.hidden; if (!box.hidden) box.querySelector('input').focus(); return; }
  if (d.crensave != null){ const i = +d.crensave, v = $('#cr' + i).querySelector('input').value.trim(); S.custom[i].title = v; save(); const y = window.scrollY; renderCustom(); window.scrollTo({top:y}); return; }
  if (d.cdel != null){
    if (b.dataset.armed){ S.custom.splice(+d.cdel, 1); save(); renderNav(); const y = window.scrollY; renderCustom(); window.scrollTo({top:y}); return; }
    b.dataset.armed = '1'; b.textContent = 'Tap again to remove'; b.classList.add('primary'); setTimeout(() => { if (b.isConnected){ delete b.dataset.armed; b.textContent = 'Remove'; b.classList.remove('primary'); } }, 3000); return;
  }
  if ('ccopy' in d){ try { await navigator.clipboard.writeText($('#cexport').value); b.textContent = 'Copied'; } catch(err){ $('#cexport').select(); b.textContent = 'Select and copy the code above'; } return; }
  if ('cimport' in d){
    const m = $('#cmsg');
    try { const arr = JSON.parse(decodeURIComponent(escape(atob($('#cimport').value.trim()))));
      if (!Array.isArray(arr) || !arr.every(x => x && x.measure && x.f)) throw new Error('bad');
      S.custom = [...(S.custom || []), ...arr]; save(); renderNav(); renderCustom(); toast(`Added ${arr.length} chart${arr.length > 1 ? 's' : ''}`, 'ok'); }
    catch(err){ m.className = 'msg err'; m.textContent = 'That code didn\'t work. Copy it again from the other device.'; }
    return;
  }
  if (d.tab){ if (d.tab !== V.tab){ if (V.tab === 'analysis' && V.editIdx != null){ S.analysis = V.prevAnalysis || S.analysis; V.editIdx = null; } V.tab = d.tab; V.sel = null; V.listLimit = 25; if (d.tab !== 'settings'){ S.lastTab = d.tab; save(); } render(); } return; }
  if (d.period){ V.period = d.period; V.sel = null; V.listLimit = 25; renderWorkout(); return; }
  if ('compare' in d){ S.compare = !S.compare; V.sel = null; save(); renderWorkout(); return; }
  if (d.metric || d.gmetric){
    const ti = typeInfo(V.tab), k = d.metric || d.gmetric; let a = selMetrics(V.tab, ti);
    if (d.gmetric) a = [k, ...a.slice(1).filter(x => x !== k)];
    else if (a.includes(k)){ if (a.length > 1) a = a.filter(x => x !== k); }   // tap a selected box: remove it (keep at least one)
    else a = a.length < 2 ? [...a, k] : [a[0], k];                             // a third tap replaces the line
    S.metric[V.tab] = a; save(); const sy = window.scrollY; renderWorkout(); window.scrollTo({top:sy}); return;
  }
  if (d.vmode){ S.viewMode = d.vmode; V.sel = null; save(); renderWorkout(); window.scrollTo({top:0}); return; }
  if (d.gby){ S.graphsBy = d.gby; V.sel = null; save(); renderWorkout(); return; }
  if ('clearsel' in d){ V.sel = null; renderWorkout(); return; }
  if ('more' in d){ const sy = window.scrollY; V.listLimit += 50; renderWorkout(); window.scrollTo({top:sy}); return; }
  if (d.allf){
    const keys = Object.keys(presentTypes());
    if (d.allf === '__all') S.allFilter = null;
    else {
      let f = S.allFilter ? S.allFilter.slice() : keys.slice();
      // first tap from "all types" isolates the tapped type; afterwards taps toggle
      if (!S.allFilter) f = [d.allf];
      else if (f.includes(d.allf)) f = f.filter(k => k !== d.allf); else f.push(d.allf);
      S.allFilter = !f.length || keys.every(k => f.includes(k)) ? null : f;
    }
    V.sel = null; save(); renderWorkout(); return;
  }
  // settings
  if (d.mv != null){ const i = +d.mv, j = i + +d.dir, o = S.navOrder; [o[i], o[j]] = [o[j], o[i]]; save(); renderNav(); renderSettings(); return; }
  if (d.navtog){ const k = d.navtog; S.navOn = S.navOn.includes(k) ? S.navOn.filter(x => x !== k) : [...S.navOn, k];
    S.navOn = S.navOrder.filter(x => S.navOn.includes(x)); if (S.start !== 'last' && !S.navOn.includes(S.start)) S.start = 'last'; save(); renderNav(); renderSettings(); return; }
  if (d.units){ S.units = d.units; save(); renderSettings(); return; }
  if (d.themeSet){ S.theme = d.themeSet; save(); applyTheme(); renderSettings(); return; }
  if ('sample' in d){ store.del('data'); S.source = 'sample'; S.allFilter = null; save(); setData(genSample(), {label:'Sample data'}); render(); dataMsg('Switched back to sample data.', 'ok'); return; }
  if ('paste' in d){
    try { const res = parseAny($('#pasteIn').value); setData(res.acts, {label:'Pasted data', at:Date.now()}); afterDataChange(res, 'Pasted data'); }
    catch(err){ dataMsg('Could not read that: ' + err.message, 'err'); }
    return;
  }
  if ('sheet' in d){
    const url = $('#sheetIn').value.trim(); if (!url){ dataMsg('Paste the published CSV link first.', 'err'); return; }
    dataMsg('Loading…');
    try { const res = await loadSheet(url); S.sheetUrl = url; S.source = 'sheet'; save(); afterDataChange(res, DATA_INFO.label); S.source = 'sheet'; save(); }
    catch(err){ dataMsg(`Couldn't load the Sheet (${err.message}). If you are viewing this inside Claude, outside links are blocked here; host the page yourself, or download the CSV and use Import a file.`, 'err'); }
    return;
  }
  if ('unsheet' in d){ S.sheetUrl = ''; if (S.source === 'sheet') S.source = 'local'; save(); renderSettings(); return; }
  if ('copyschema' in d){ try { await navigator.clipboard.writeText(SCHEMA.split('\n')[0]); b.textContent = 'Copied'; } catch(err){ b.textContent = 'Copy blocked – select the text above'; } return; }
  if ('reset' in d){ const keep = {source:S.source, sheetUrl:S.sheetUrl, gh:S.gh, custom:S.custom}; Object.keys(S).forEach(k => delete S[k]); Object.assign(S, structuredClone(DEFAULTS), keep); ensureNav(); save(); applyTheme(); V.tab = 'settings'; render(); return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.ac){
    const c = curCfg(), k = t.dataset.ac; let v = t.value;
    if (k === 'bins') v = Math.max(3, Math.min(30, parseInt(v) || 12));
    c[k] = v;
    if (k === 'measure') c.how = fixHow(c.measure, c.how);
    if (k === 'measure2') c.how2 = v ? AM[v].hows[0] : '';
    if (k === 'by' && c.split === v) c.split = '';
    if (k === 'chart' && v === 'stack' && !c.split) c.split = 'type';
    if (k === 'chart' && v === 'scatter' && c.xm === c.measure){ c.xm = 'distance'; c.measure = c.measure === 'distance' ? 'pace' : c.measure; c.how = fixHow(c.measure, c.how); }
    c.title = '';
    save(); const y = window.scrollY; renderAnalysis(); window.scrollTo({top:y}); return;
  }
  if (t.dataset.af2){ const c = curCfg(); c.f[t.dataset.af2] = t.value; V.filtersOpen = true; save(); const y = window.scrollY; renderAnalysis(); window.scrollTo({top:y}); return; }

  if (t.id === 'fileIn' && t.files[0]){
    const f = t.files[0];
    f.text().then(txt => { const res = parseAny(txt); const label = 'File: ' + f.name; setData(res.acts, {label, at:Date.now()}); afterDataChange(res, label); })
           .catch(err => dataMsg('Could not read that file: ' + err.message, 'err'));
    return;
  }
  if (t.dataset.set){
    const k = t.dataset.set; let v = t.value;
    if (k === 'maxHr'){ v = Math.min(230, Math.max(120, parseInt(v) || 190)); t.value = v; ACTS.forEach(a => delete a._load); }
    if (k === 'age' || k === 'restHr'){ v = parseInt(v) || ''; t.value = v; }
    S[k] = v; save();
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.tcolor){ S.typeColors = Object.assign({}, S.typeColors, {[t.dataset.tcolor]: t.value}); applyColors(); save(); }
  else if ('accent' in t.dataset){ S.accent = t.value; applyColors(); save(); }
  else if ('linecolor' in t.dataset){ S.lineColor = t.value; applyColors(); save(); }
});
document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('filters')) V.filtersOpen = e.target.open; }, true);
let compactHdr = false;
window.addEventListener('scroll', () => {
  const y = window.scrollY;
  if (!compactHdr && y > 60){ compactHdr = true; $('#hdr').classList.add('scrolled'); }
  else if (compactHdr && y < 8){ compactHdr = false; $('#hdr').classList.remove('scrolled'); }
}, {passive:true});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (V.redraw) V.redraw(); else if (V.tab !== 'settings') drawAll(); }, 120); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && V.sel != null){ V.sel = null; renderWorkout(); } });

/* installable app: offline helper (only when hosted, e.g. on GitHub Pages) */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch(e){}
}

/* ---------------- boot ---------------- */
(async function boot(){
  applyTheme(); applyColors();
  if (S.source === 'sample' || !loadLocal()) { setData(genSample(), {label:'Sample data'}); if (S.source !== 'sample'){ S.source = 'sample'; } }
  ensureNav(); save();
  const tabs = navTabs();
  V.tab = S.start === 'last' ? (tabs.includes(S.lastTab) ? S.lastTab : tabs[0]) : (tabs.includes(S.start) ? S.start : tabs[0]);
  V.period = S.startPeriod || 'd7';
  render();
  if (hasGH()){
    try { await loadGitHubData(); S.source = 'github'; save(); ensureNav(); rerender(); } catch(err){ toast(esc(err.message), 'err'); }
  } else if (S.source === 'sheet' && S.sheetUrl){
    try { await loadSheet(S.sheetUrl); ensureNav(); rerender(); } catch(err){ /* keep cached copy */ }
  }
})();
</script>
