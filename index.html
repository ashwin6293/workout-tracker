<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Tracker</title>
<meta name="theme-color" content="#07090d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  color-scheme:light;
  --page:#f1f3f6; --surface:#fcfcfd; --ink:#0b0d12; --ink2:#4b5260; --muted:#868c99;
  --grid:#e3e6ec; --axis:#c4c9d3; --border:rgba(11,13,18,.09); --chip:#e6e9ef; --chip-on:#0b0d12; --chip-on-ink:#fcfcfd;
  --accent:#0094ab; --line:#0b0d12; --glow:0px; --glow-hi:0px; --bar-fade:.55; --tip-bg:rgba(252,252,253,.96);
  --good:#006300; --bad:#d03b3b;
  --c-run:#00a3bf; --c-cycle:#e14f00; --c-yoga:#ca358b; --c-walk:#009e34;
  --c-swim:#1f5ed9; --c-hike:#ce9400; --c-strength:#703dc6; --c-hiit:#d02940; --c-other:#868c99;
  --z1:#3adaf2; --z2:#00bad1; --z3:#009ab1; --z4:#007b92; --z5:#005d74;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --page:#07090d; --surface:#0f1218; --ink:#eef3fa; --ink2:#a9b3c4; --muted:#6f7a8c;
    --grid:#1b212b; --axis:#2b3442; --border:rgba(120,200,255,.10); --chip:#181d26; --chip-on:#00d0e2; --chip-on-ink:#06090d;
    --accent:#00d0e2; --line:#eef3fa; --glow:5px; --glow-hi:10px; --bar-fade:.28; --tip-bg:rgba(15,18,24,.92);
    --good:#0ca30c; --bad:#e66767;
    --c-run:#009db8; --c-cycle:#d34100; --c-yoga:#d13d91; --c-walk:#00ab41;
    --c-swim:#2867e4; --c-hike:#c08600; --c-strength:#9568f3; --c-hiit:#c51a38; --c-other:#6f7a8c;
    --z1:#005f6e; --z2:#007c8c; --z3:#009bab; --z4:#00bbcb; --z5:#40e2f3;
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --page:#07090d; --surface:#0f1218; --ink:#eef3fa; --ink2:#a9b3c4; --muted:#6f7a8c;
    --grid:#1b212b; --axis:#2b3442; --border:rgba(120,200,255,.10); --chip:#181d26; --chip-on:#00d0e2; --chip-on-ink:#06090d;
    --accent:#00d0e2; --line:#eef3fa; --glow:5px; --glow-hi:10px; --bar-fade:.28; --tip-bg:rgba(15,18,24,.92);
    --good:#0ca30c; --bad:#e66767;
    --c-run:#009db8; --c-cycle:#d34100; --c-yoga:#d13d91; --c-walk:#00ab41;
    --c-swim:#2867e4; --c-hike:#c08600; --c-strength:#9568f3; --c-hiit:#c51a38; --c-other:#6f7a8c;
    --z1:#005f6e; --z2:#007c8c; --z3:#009bab; --z4:#00bbcb; --z5:#40e2f3;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.35;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(14px + env(safe-area-inset-top)) 16px 10px;transition:box-shadow .2s}
header.top .hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
header.top.scrolled{box-shadow:0 1px 0 var(--border),0 8px 24px -12px rgba(0,0,0,.35)}
header.top.scrolled .eyebrow{display:none}
header.top.scrolled h1{font-size:19px}
#controls:empty{display:none}
#controls .seg{margin:10px 0 0}
#controls .subrow{margin:8px 0 0;min-height:26px}
header.top h1{font-size:26px;line-height:1.1;margin:2px 0 0;font-weight:700;letter-spacing:-.01em}
.eyebrow{font-size:12px;color:var(--muted)}
.pill{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--ink2);white-space:nowrap}
.pad{padding:0 16px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px;margin:4px 16px 0}
.seg button{flex:1;border:0;background:transparent;padding:7px 0;border-radius:8px;font-size:13px;color:var(--ink2);min-height:34px}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.subrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 16px 0;min-height:30px}
.subrow .desc{font-size:12px;color:var(--ink2)}
.switch{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);border:0;background:none;padding:4px 0;white-space:nowrap}
.switch .tr{width:34px;height:20px;border-radius:999px;background:var(--axis);position:relative;transition:background .15s}
.switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch.on .tr{background:var(--accent);box-shadow:0 0 var(--glow) var(--accent)}
.switch.on .tr::after{transform:translateX(14px);background:var(--surface)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:6px 11px;background:var(--chip);color:var(--ink2);font-size:13px;white-space:nowrap;min-height:32px}
.chip.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1.5px var(--accent)}
.chip .sw{width:9px;height:9px;border-radius:3px}
.chip.off .sw{opacity:.35}
.caption{font-size:12px;color:var(--muted);margin:14px 16px 6px;display:flex;justify-content:space-between;gap:8px}
.caption button{border:0;background:none;color:var(--ink2);font-size:12px;padding:0;text-decoration:underline}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 16px}
.tile{background:var(--surface);border-radius:12px;box-shadow:0 0 0 1px var(--border);padding:9px 10px;border:0;text-align:left;min-height:64px;display:flex;flex-direction:column;justify-content:space-between}
.tile{position:relative}
.tile .tag{position:absolute;top:6px;right:7px;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.tile.ov{box-shadow:0 0 0 2px var(--ink)}
.tile.ov .tag{color:var(--ink)}
.tile.on{box-shadow:0 0 0 2px var(--accent),0 0 calc(var(--glow)*2) -2px var(--accent)}
.tile .l{font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:17px;font-weight:650;margin-top:2px;white-space:nowrap}
.tile .v small{font-size:11px;font-weight:500;color:var(--ink2);margin-left:2px}
.tile .s{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:14px}
.card{background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--border);padding:14px;margin:12px 16px}
.card h2{font-size:15px;margin:0;font-weight:650}
.card h2 .u{font-weight:500;color:var(--muted);font-size:13px}
.card .meta{font-size:12px;color:var(--ink2);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.delta{font-weight:600;display:inline-flex;align-items:center;gap:3px}
.delta.good{color:var(--good)} .delta.bad{color:var(--bad)} .delta.neutral{color:var(--ink2)}
.chartwrap{position:relative;margin-top:8px;touch-action:pan-y}
.chartwrap svg{display:block;width:100%;overflow:visible}
.chartwrap text{font-family:inherit}
.tick{font-size:10px;fill:var(--muted);font-variant-numeric:tabular-nums}
.xl{font-size:10px;fill:var(--ink2)} .xs{font-size:9.5px;fill:var(--muted)}
.vlabel{font-size:10px;fill:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums}
.vlabel.hi{fill:var(--ink);font-weight:700}
.inl{font-size:9px;font-weight:700;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2px;pointer-events:none}
.ovline{stroke:var(--line);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 var(--glow) var(--line));pointer-events:none}
.ovdot{fill:var(--line);stroke:var(--surface);stroke-width:2;pointer-events:none}
.ovlabel.hi{font-size:10.5px}
.ovlabel{font-size:9px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;font-variant-numeric:tabular-nums;pointer-events:none}
.lnsw{display:inline-block;width:14px;height:2px;border-radius:1px;background:var(--line);vertical-align:middle}
.tip{position:absolute;z-index:4;pointer-events:none;background:var(--tip-bg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 0 0 1px var(--border),0 6px 20px rgba(0,0,0,.14);min-width:130px;max-width:260px}
.tip .t{font-weight:650;margin-bottom:4px}
.tip .r{display:flex;align-items:center;gap:12px;justify-content:space-between;white-space:nowrap;color:var(--ink2);font-variant-numeric:tabular-nums}
.tip .r b{color:var(--ink);font-weight:600}
.tip .k{display:flex;align-items:center;gap:6px}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
details.tbl{margin-top:10px;font-size:12px;color:var(--ink2)}
details.tbl summary{cursor:pointer;color:var(--muted)}
details.tbl table{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
details.tbl td,details.tbl th{padding:4px 2px;border-bottom:1px solid var(--grid);text-align:right}
details.tbl td:first-child,details.tbl th:first-child{text-align:left}
.zrow{display:grid;grid-template-columns:84px 1fr 92px;align-items:center;gap:8px;margin-top:9px;font-size:12px}
.zrow .zl{color:var(--ink2)} .zrow .zl b{color:var(--ink);font-weight:600}
.zrow .zv{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.zrow .track{height:10px;border-radius:0 4px 4px 0;position:relative}
.zrow .fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;box-shadow:0 0 var(--glow) var(--zc)}
.gcard{padding:12px 14px 10px}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.gt{display:flex;align-items:center;gap:8px}
.gv{font-size:17px;font-weight:650;white-space:nowrap}
.gv small{font-size:11px;font-weight:500;color:var(--ink2);margin-left:2px}
.ico.sm{width:24px;height:24px;border-radius:7px}
.ico.sm svg{width:15px;height:15px}
header.top .miniseg{margin-bottom:2px}
.note{font-size:11px;color:var(--muted);margin-top:8px}
.list .row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--grid)}
.list .row:first-of-type{border-top:0}
.ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.ico svg{width:20px;height:20px}
.list .main{flex:1;min-width:0}
.list .a{font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.list .a span:last-child{font-weight:400;color:var(--muted);font-size:12px;white-space:nowrap}
.list .b{font-size:12px;color:var(--ink2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.more{display:block;width:100%;margin-top:6px;border:0;background:var(--chip);border-radius:10px;padding:9px;font-size:13px;color:var(--ink2)}
.empty{padding:26px 6px;text-align:center;color:var(--muted);font-size:13px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);box-shadow:0 -1px 0 var(--border);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .in{max-width:560px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none}
nav.bottom .in::-webkit-scrollbar{display:none}
nav.bottom button{flex:1 0 58px;border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);position:relative;min-height:56px}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button.on{color:var(--ink);font-weight:600}
nav.bottom button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--bar,var(--accent));box-shadow:0 0 var(--glow-hi) var(--bar,var(--accent))}
/* settings */
.set h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 16px 6px;font-weight:600}
.set .card{padding:4px 14px}
.srow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--grid);min-height:50px}
.srow:first-child{border-top:0}
.srow .grow{flex:1;min-width:0}
.srow .grow .n{font-size:12px;color:var(--muted)}
.srow select,.srow input[type=number],.srow input[type=url],.srow input[type=text]{background:var(--chip);border:0;border-radius:8px;padding:7px 9px;max-width:100%}
.srow input[type=url]{width:100%}
.iconbtn{border:0;background:var(--chip);border-radius:8px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2)}
.iconbtn:disabled{opacity:.3;cursor:default}
.iconbtn svg{width:16px;height:16px}
.btn{border:0;background:var(--chip);border-radius:9px;padding:8px 12px;font-size:13px;white-space:nowrap}
.btn.primary{background:var(--chip-on);color:var(--chip-on-ink);font-weight:600}
.btn.file{position:relative;overflow:hidden;display:inline-block}
.btn.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.miniseg{display:flex;background:var(--chip);border-radius:8px;padding:2px}
.miniseg button{border:0;background:none;padding:5px 10px;border-radius:6px;font-size:13px;color:var(--ink2)}
.miniseg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
textarea{width:100%;min-height:110px;background:var(--chip);border:0;border-radius:8px;padding:8px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.msg{font-size:12px;margin:6px 0 10px;color:var(--ink2)}
.msg.err{color:var(--bad)} .msg.ok{color:var(--good)}
pre.schema{background:var(--chip);border-radius:8px;padding:10px;font-size:11.5px;overflow-x:auto;margin:8px 0;white-space:pre}
.stack{padding:12px 0;display:flex;flex-direction:column;gap:8px}
.stack .lbl{font-size:13px;font-weight:600}
.stack .n{font-size:12px;color:var(--muted)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

html,body{overscroll-behavior-y:contain}
#ptr{position:fixed;left:50%;top:-44px;z-index:20;transform:translateY(0);margin-left:-70px;width:140px;height:36px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 1px var(--border),0 6px 18px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink2);opacity:0;transition:opacity .15s}
#ptr.on{opacity:1}
#ptr.armed{color:var(--accent);box-shadow:0 0 0 1.5px var(--accent),0 0 16px -2px var(--accent)}
.toast{position:fixed;left:50%;transform:translate(-50%,-20px);top:calc(10px + env(safe-area-inset-top));z-index:30;max-width:min(92vw,480px);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:0 0 0 1px var(--border),0 10px 28px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{box-shadow:0 0 0 1.5px var(--good),0 10px 28px rgba(0,0,0,.3)}
.toast.err{box-shadow:0 0 0 1.5px var(--bad),0 10px 28px rgba(0,0,0,.3)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--grid);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.hright{display:flex;align-items:center;gap:8px}
.sublink{border:0;background:none;padding:0 0 0 4px;color:var(--accent);font-size:12px;display:inline-flex;align-items:center;gap:3px;vertical-align:-2px}
.sublink svg{width:12px;height:12px}
body.syncing .sublink svg{animation:sp 1s linear infinite}
header.top.scrolled .eyebrow{display:none}
.srow select{max-width:58%}
.banner{margin:10px 16px 0;padding:10px 12px;border-radius:12px;background:var(--chip);font-size:13px;color:var(--ink2)}
.banner span{margin-top:8px}
.banner span{display:flex;gap:6px}
.atbl td b{white-space:nowrap}
.atbl td:nth-child(2){white-space:nowrap}
.builder{padding:12px}
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.bgrid label,.fl{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.bgrid select,.bgrid input,.fl input{text-transform:none;letter-spacing:0;font-weight:500;font-size:13px;color:var(--ink);background:var(--chip);border:0;border-radius:8px;padding:8px 9px;width:100%;min-height:36px}
.bgrid input[type=color]{padding:2px;height:36px}
.filters{margin-top:12px;border-top:1px solid var(--grid);padding-top:10px}
.filters summary{cursor:pointer;font-size:13px;font-weight:600}
.filters summary span{font-weight:400;color:var(--muted)}
.flbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin:12px 0 4px;display:flex;gap:8px;align-items:center}
.linkbtn{border:0;background:none;color:var(--accent);font-size:11px;padding:0;text-transform:none;letter-spacing:0}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding:0}
.chips.wrap .chip{min-height:30px;padding:5px 10px;font-size:12px}
.tblwrap{overflow-x:auto}
.atbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.atbl th{font-size:11px;color:var(--muted);text-align:left;font-weight:600;padding:6px 6px 6px 0;border-bottom:1px solid var(--grid)}
.atbl td{padding:7px 6px 7px 0;border-bottom:1px solid var(--grid);vertical-align:top}
.atbl td.n,.atbl .n{color:var(--muted);font-size:11.5px}
.donutwrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;padding:6px 0}
.dtot{font-size:20px;font-weight:700;fill:var(--ink)}
.dleg{flex:1;min-width:170px;font-size:12.5px}
.dleg div{display:flex;align-items:center;gap:7px;padding:4px 0;border-bottom:1px solid var(--grid)}
.dleg span{flex:1;color:var(--ink2)} .dleg b{font-weight:600} .dleg em{font-style:normal;color:var(--muted);width:36px;text-align:right}
.heatscroll{overflow-x:auto}
.reflab{font-size:9px;fill:var(--muted)}
.sug h2.big{font-size:21px;margin:4px 0 4px;line-height:1.2}
.sug.good h2.big{color:var(--good)} .sug.bad h2.big{color:var(--bad)} .sug.warn h2.big{color:var(--c-hike)}
.sug ul{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--ink2)} .sug li{margin:4px 0}
.tiles4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.tiles4>div{background:var(--chip);border-radius:10px;padding:8px}
.tiles4 span{display:block;font-size:10px;color:var(--muted);line-height:1.2}
.tiles4 b{font-size:16px;font-weight:700;display:block;margin-top:3px}
h3.sub{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 4px}
.sum{font-size:13px;margin:10px 0 4px;color:var(--ink2)}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px}
.cpick{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink2)}

/* ---------------- utilities ---------------- */
const APP_VERSION = '10 Nov 2026 · Pro, Analysis, Custom';
const DAY = 864e5;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem('wt_'+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('wt_'+k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem('wt_'+k); }catch(e){} }
};
function today0(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function dim(y, m){ return new Date(y, m+1, 0).getDate(); }
function fmtDM(d){ return d.getDate()+' '+MON[d.getMonth()]; }
function fmtDay(d){ return WD[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''); }
function fmtNum(v, dp=0){ if (v == null || !isFinite(v)) return '–'; return v.toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp}); }
function compact(v){
  const a = Math.abs(v);
  if (a >= 1e6) return (v/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if (a >= 1e4) return (v/1e3).toFixed(a >= 1e5 ? 0 : 1).replace(/\.0$/,'')+'K';
  return fmtNum(v, a < 10 && v % 1 ? 1 : 0);
}
function fmtDur(s){
  if (s == null || !isFinite(s)) return '–';
  s = Math.round(s);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  if (h) return h+'h '+String(m).padStart(2,'0')+'m';
  if (m) return m+'m';
  return s ? s+'s' : '0m';
}
function fmtMS(sec){ if (sec == null || !isFinite(sec)) return '–'; sec = Math.round(sec); return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------------- workout types & metrics ---------------- */
const SLOT_ORDER = ['run','cycle','yoga','walk','swim','hike','strength','hiit'];   // fixed colour order

}

const U = () => S.units === 'mi'
  ? {d:'mi', dm:1609.344, e:'ft', em:0.3048, sp:'mph'}
  : {d:'km', dm:1000, e:'m', em:1, sp:'km/h'};
const distAxis = () => ({conv: v => v/U().dm, tick: v => compact(+v.toFixed(2))});
const M = {
  count:    {label:'Workouts', kind:'sum', v:a=>1, fmt:v=>fmtNum(v, v % 1 ? 1 : 0), unit:()=>'', perLabel:true},
  duration: {label:'Time', kind:'sum', v:a=>a.duration, fmt:fmtDur, unit:()=>'', perLabel:true,

  pace:     {label:'Avg pace', kind:'ratio', num:a=>a.distance>0?a.duration:0, den:a=>a.duration>0?(a.distance||0):0, f:(n,d)=>n/(d/U().dm),
             fmt:fmtMS, unit:()=>'/'+U().d, lowerBetter:true, axis:()=>({conv:v=>v/60, tick:v=>fmtMS(v*60)})},
  pace100:  {label:'Pace /100m', kind:'ratio', num:a=>a.distance>0?a.duration:0, den:a=>a.duration>0?(a.distance||0):0, f:(n,d)=>n/(d/100),
             fmt:fmtMS, unit:()=>'', lowerBetter:true, axis:()=>({conv:v=>v/60, tick:v=>fmtMS(v*60)})},
  speed:    {label:'Avg speed', kind:'ratio', num:a=>a.distance>0?a.duration:0, den:a=>a.duration>0?(a.distance||0):0, f:(n,d)=>(d/U().dm)/(n/3600),
             fmt:v=>fmtNum(v,1), unit:()=>U().sp},
  avg_hr:   {label:'Avg HR', kind:'ratio', num:a=>a.hr?a.hr*a.duration:0, den:a=>a.hr?a.duration:0, f:(n,d)=>n/d, fmt:v=>fmtNum(v), unit:()=>'bpm', neutral:true},
  max_hr:   {label:'Max HR', kind:'max', v:a=>a.maxHr||0, fmt:v=>fmtNum(v), unit:()=>'bpm', neutral:true},
  avg_dur:  {label:'Avg time', kind:'ratio', num:a=>a.duration, den:a=>1, f:(n,d)=>n/d, fmt:fmtDur, unit:()=>'',
             axis:max => max >= 7200 ? {conv:v=>v/3600, tick:v=>(+v.toFixed(2))+'h'} : {conv:v=>v/60, tick:v=>Math.round(v)+'m'}},
};
function agg(list, key){
  const m = M[key];
  if (m.kind === 'sum'){ let s = 0; for (const a of list) s += m.v(a) || 0; return s; }
  if (m.kind === 'max'){ let x = 0; for (const a of list) x = Math.max(x, m.v(a) || 0); return x || null; }
  let n = 0, d = 0; for (const a of list){ const dd = m.den(a); if (dd > 0){ n += m.num(a); d += dd; } }
  return d > 0 ? m.f(n, d) : null;
}
const valStr = (key, v) => { const u = M[key].unit(); return v == null ? '–' : M[key].fmt(v) + (u ? ' '+u : ''); };
const valHtml = (key, v) => { const u = M[key].unit(); return v == null ? '–' : esc(M[key].fmt(v)) + (u ? `<small>${esc(u)}</small>` : ''); };

/* HR zones (% of max HR) */
const ZONES = [{n:'Warm-up',lo:.5},{n:'Easy',lo:.6},{n:'Aerobic',lo:.7},{n:'Threshold',lo:.8},{n:'Maximum',lo:.9}];
function zoneOf(hr){ const p = hr / (S.maxHr || 190); let z = 0; ZONES.forEach((Z,i) => { if (p >= Z.lo) z = i; }); return z; }

                  source:'sample', sheetUrl:'', allFilter:null, metric:{}, lastTab:null, compare:false, viewMode:'overview', graphsBy:'metric', palette:'neon', typeColors:{}, accent:'', lineColor:'', age:'', restHr:'', custom:[], analysis:null};

/* ---------------- data: sample generator ---------------- */
function genSample(){
  const rnd = mulberry32(20240101), out = [];
  const t = today0(), start = new Date(t.getFullYear()-2, 0, 1), span = t - start;
  const between = (a,b) => a + (b-a)*rnd();
  const zonesFor = (hr, dur) => {
    const zc = zoneOf(hr) + (hr/(S.maxHr||190) - ZONES[zoneOf(hr)].lo)*10 - .5;
    const w = ZONES.map((_,i) => Math.exp(-((i-zc)**2)/0.9)), s = w.reduce((a,b)=>a+b,0);
    return w.map(x => Math.round(dur*x/s));
  };
  let id = 1;
  const add = (d, hour, type, o) => {
    const st = new Date(d); st.setHours(hour, Math.floor(rnd()*60), 0, 0);
    if (st > new Date()) return;
    const a = {id:'s'+(id++), start:st, type, duration:Math.round(o.duration), distance:Math.round(o.distance||0),
      hr:o.hr?Math.round(o.hr):null, maxHr:o.hr?Math.round(o.hr+between(12,24)):null, cal:Math.round(o.cal||0),
      elev:Math.round(o.elev||0), steps:Math.round(o.steps||0)};
    if (a.hr) a.zones = zonesFor(a.hr, a.duration);
    a.sport = {run:'outdoor_running', walk:'walking', cycle:'outdoor_cycling', hike:'hiking', swim:'pool_swimming', strength:'strength_training', yoga:'yoga', hiit:'hiit'}[type];
    a.elapsed = Math.round(a.duration * between(1.0, 1.08));
    if (type === 'run') a.cadence = Math.round(between(164, 178)); else if (type === 'walk' || type === 'hike') a.cadence = Math.round(between(100, 118));
    out.push(a);
  };
  for (let d = new Date(start); d <= t; d = addDays(d,1)){
    const dow = d.getDay(), prog = (d - start)/span, mo = d.getMonth();
    const wet = (mo === 6 || mo === 7) ? .6 : 1;        // monsoon dip
    if ((dow === 2 || dow === 4) && rnd() < .8*wet){
      const km = between(5, 8.5), pace = between(330, 375) - 25*prog;
      add(d, 6, 'run', {distance:km*1000, duration:km*pace, hr:between(142,158), cal:km*between(62,70), elev:km*between(4,12), steps:km*1000/1.15});
    }
    if (dow === 6 && rnd() < .75*wet){
      const km = between(10, 14) + 6*prog*rnd(), pace = between(350, 390) - 25*prog;
      add(d, 6, 'run', {distance:km*1000, duration:km*pace, hr:between(140,152), cal:km*66, elev:km*between(6,15), steps:km*1000/1.1});
    }
    if (rnd() < .55){
      const km = between(2.5, 6), pace = between(600, 720);
      add(d, 19, 'walk', {distance:km*1000, duration:km*pace, hr:between(98,115), cal:km*45, elev:km*3, steps:km*1000/.74});
    }
    if (dow === 0 && rnd() < .5*wet){
      const km = between(20, 45), spd = between(22, 27);
      add(d, 7, 'cycle', {distance:km*1000, duration:km/spd*3600, hr:between(128,145), cal:km*26, elev:km*between(5,14)});
    }
    if ((dow === 1 || dow === 3) && rnd() < .7){
      const min = between(40, 65);
      add(d, 18, 'strength', {duration:min*60, hr:between(105,125), cal:min*between(5.5,7)});
    }
    if (dow === 5 && rnd() < .4) { const min = between(30, 60); add(d, 7, 'yoga', {duration:min*60, hr:between(85,100), cal:min*3.4}); }
    if ((dow === 0 || dow === 6) && rnd() < .035){
      const km = between(8, 16), pace = between(720, 900);
      add(d, 6, 'hike', {distance:km*1000, duration:km*pace, hr:between(118,135), cal:km*72, elev:between(400,1200), steps:km*1000/.7});
    }
    if (dow === 3 && rnd() < .2){ const m = between(1000, 2000), p = between(140, 165); add(d, 7, 'swim', {distance:m, duration:m/100*p, hr:between(125,140), cal:m/100*36}); }
    if (dow === 4 && rnd() < .2){ const min = between(20, 35); add(d, 18, 'hiit', {duration:min*60, hr:between(150,165), cal:min*11}); }
  }
  return out;
}

/* ---------------- data: import / normalise ---------------- */
function parseCSV(text){
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(f); f = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  const clean = rows.filter(r => r.some(x => x.trim() !== ''));
  if (!clean.length) return [];
  const head = clean[0].map(h => h.trim());
  return clean.slice(1).map(r => Object.fromEntries(head.map((h,i) => [h, r[i]])));
}
function normType(raw){
  const s = String(raw ?? '').toLowerCase().replace(/[^a-z]/g,'');
  if (!s) return 'other';
  if (/ride|cycl|bik|spin|bmx/.test(s)) return 'cycle';
  if (/hik|trek|climb|boulder|mountaineer/.test(s)) return 'hike';
  if (/run|jog|treadmill/.test(s)) return 'run';
  if (/walk|rucking/.test(s)) return 'walk';
  if (/swim/.test(s)) return 'swim';
  if (/hiit|crossfit|interval|circuit|bootcamp/.test(s)) return 'hiit';
  if (/strength|weight|gym|lift|functional/.test(s)) return 'strength';
  if (/yoga|pilates|stretch/.test(s)) return 'yoga';
  return s.slice(0, 24);
}
function num(v){ if (v == null || v === '') return null; if (typeof v === 'number') return isFinite(v) ? v : null;
  const s = String(v).trim();
  if (/^\d+:\d{1,2}(:\d{1,2})?$/.test(s)){ const p = s.split(':').map(Number); return p.length === 3 ? p[0]*3600+p[1]*60+p[2] : p[0]*60+p[1]; }
  const n = parseFloat(s.replace(/,/g,'')); return isFinite(n) ? n : null; }
const KNOWN_COLS = new Set(['start_time','start','start_date_local','start_date','date','datetime','timestamp','time','duration_s','duration_sec','moving_time','duration','elapsed_time','total_time',
  'distance_m','distance','distance_meters','distance_km','id','trackid','track_id','activity_id','type','sport','sport_type','activity_type','activity','workout_type','avg_hr','average_heartrate','avg_heart_rate',
  'average_hr','heart_rate_avg','avg_heartrate','max_hr','max_heartrate','max_heart_rate','calories','kcal','calorie','active_calories','elevation_gain_m','total_elevation_gain','elevation_gain','elev_gain',
  'ascent','total_ascent','elevation','steps','total_steps','elapsed_s','total_time_s','sport_name','sport_code','avg_cadence','cadence','average_cadence','_load']);
function normalise(rows){
  const out = []; let bad = 0;
  rows.forEach((r, i) => {
    const o = {}; for (const k in r) o[k.toLowerCase().trim().replace(/[^a-z0-9]+/g,'_')] = r[k];
    const pick = ks => { for (const k of ks) if (o[k] != null && o[k] !== '') return o[k]; return null; };
    const st = pick(['start_time','start','start_date_local','start_date','date','datetime','timestamp','time']);
    let date = null;
    if (st != null){ date = /^\d{9,13}$/.test(String(st)) ? new Date(+st * (String(st).length <= 10 ? 1000 : 1)) : new Date(String(st).replace(' ','T')); }
    const dur = num(pick(['duration_s','duration_sec','moving_time','duration','elapsed_time','total_time']));
    if (!date || isNaN(date) || dur == null){ bad++; return; }
    let dist = num(pick(['distance_m','distance','distance_meters']));
    if (dist == null && o.distance_km != null) dist = num(o.distance_km)*1000;
    const z = [1,2,3,4,5].map(n => num(pick(['hr_zone_'+n,'zone_'+n,'z'+n,'zone'+n,'hr_zone'+n])));
    const a = {
      id: String(pick(['id','trackid','track_id','activity_id']) ?? ('r'+i)), start: date,
      type: normType(pick(['type','sport','sport_type','activity_type','activity','workout_type'])),
      duration: dur, distance: dist || 0,
      hr: num(pick(['avg_hr','average_heartrate','avg_heart_rate','average_hr','heart_rate_avg','avg_heartrate'])),
      maxHr: num(pick(['max_hr','max_heartrate','max_heart_rate'])),
      cal: num(pick(['calories','kcal','calorie','active_calories'])) || 0,
      elev: num(pick(['elevation_gain_m','total_elevation_gain','elevation_gain','elev_gain','ascent','total_ascent','elevation'])) || 0,
      steps: num(pick(['steps','total_steps'])) || 0
    };
    if (z.some(x => x != null)) a.zones = z.map(x => x || 0);
    const el = num(pick(['elapsed_s','elapsed_time','total_time_s'])); if (el) a.elapsed = el;
    const sp = pick(['sport','sport_name']); if (sp != null) a.sport = String(sp);
    const sc = num(pick(['sport_code'])); if (sc != null) a.sportCode = sc;
    const cad = num(pick(['avg_cadence','cadence','average_cadence'])); if (cad) a.cadence = cad;
    // any other numeric column becomes an extra measure in Analysis
    for (const k in o){
      if (KNOWN_COLS.has(k) || /^(hr_)?z(one)?_?\d$/.test(k)) continue;
      if (!/^-?\d+(\.\d+)?$/.test(String(o[k]).trim())) continue; (a.x = a.x || {})[k] = +o[k];
    }
    out.push(a);
  });
  out.sort((a,b) => a.start - b.start);
  return {acts:out, bad};
}
function parseAny(text){
  text = text.trim();
  if (!text) throw new Error('No data found.');
  let rows;
  if (text[0] === '[' || text[0] === '{'){
    const j = JSON.parse(text);
    rows = Array.isArray(j) ? j : (j.activities || j.workouts || j.data || []);
  } else rows = parseCSV(text);
  const r = normalise(rows);
  if (!r.acts.length) throw new Error('No usable rows. Each row needs at least a start time and a duration.');
  return r;
}
const serial = acts => acts.map(a => ({...a, start:a.start.toISOString()}));
const deserial = arr => arr.map(a => ({...a, start:new Date(a.start)}));

function setData(acts, info){ ACTS = acts; DATA_INFO = info; }
function loadLocal(){
  const d = store.get('data', null);
  if (d && d.acts){ setData(deserial(d.acts), {label:d.label || 'Imported data', at:d.at, synced:d.synced}); return true; }
  return false;
}
async function loadSheet(url){
  const r = await fetch(url, {cache:'no-store'});
  if (!r.ok) throw new Error('HTTP '+r.status);
  const res = parseAny(await r.text());
  const label = /docs\.google\.com/.test(url) ? 'Google Sheet' : 'Data link';
  store.set('data', {acts:serial(res.acts), label, at:Date.now()});
  setData(res.acts, {label, at:Date.now()});
  return res;
}

/* ---------------- periods & buckets ---------------- */
const PERIODS = [
  {k:'d7', l:'7D', unit:'day', desc:'Last 7 days, by day'},
  {k:'d14', l:'14D', unit:'day', desc:'Last 14 days, by day'},
  {k:'w7', l:'Weeks', unit:'wk', desc:'Rolling 7-day blocks ending today'},
  {k:'m12', l:'Months', unit:'mo', desc:'Last 12 months'},
  {k:'y', l:'Years', unit:'yr', desc:'By year'},
];
function buckets(period, compare){
  const t = today0(), tom = addDays(t, 1), out = [];
  if (period === 'd7' || period === 'd14'){
    const n = period === 'd7' ? 7 : 14;
    for (let i = n-1; i >= 0; i--){ const s = addDays(t, -i);
      out.push({start:s, end:addDays(s,1), lab:String(s.getDate()), sub:WD[s.getDay()].slice(0,1), title:fmtDay(s), cur:i===0}); }
  } else if (period === 'w7'){
    for (let k = 6; k >= 0; k--){ const e = addDays(tom, -7*k), s = addDays(e, -7), last = addDays(e, -1);
      out.push({start:s, end:e, lab:fmtDM(s), sub:fmtDM(last), title:fmtDM(s)+' – '+fmtDM(last), cur:k===0}); }
  } else if (period === 'm12'){
    for (let k = 11; k >= 0; k--){
      const s = new Date(t.getFullYear(), t.getMonth()-k, 1), y = s.getFullYear(), m = s.getMonth();
      const full = new Date(y, m+1, 1), cut = Math.min(t.getDate(), dim(y, m));
      let e = compare ? new Date(y, m, cut+1) : full; if (k === 0) e = tom;
      const title = (compare || k === 0) ? `${MON[m]} 1–${k===0 ? t.getDate() : cut}, ${y}` : `${MON[m]} ${y}`;
      out.push({start:s, end:e, full, lab:MON[m], sub:(m === 0 || k === 11) ? "'"+String(y).slice(2) : '', title, cur:k===0});
    }
  } else {
    const cy = t.getFullYear();
    let minY = ACTS.length ? ACTS[0].start.getFullYear() : cy; minY = Math.max(minY, cy - 9);
    for (let y = minY; y <= cy; y++){
      const s = new Date(y, 0, 1), full = new Date(y+1, 0, 1);
      const cut = Math.min(t.getDate(), dim(y, t.getMonth()));
      let e = compare ? new Date(y, t.getMonth(), cut+1) : full; if (y === cy) e = tom;
      const title = (compare || y === cy) ? `${y} to ${t.getDate()} ${MON[t.getMonth()]}` : String(y);
      out.push({start:s, end:e, full, lab:String(y), sub:'', title, cur:y===cy});
    }
  }
  return out;
}
const inRange = (list, s, e) => list.filter(a => a.start >= s && a.start < e);

/* current period vs the equivalent previous one */
function comparison(period, list, mk){
  const t = today0(), tom = addDays(t, 1);
  let cur, prev, label;
  if (period === 'd7' || period === 'd14'){
    const n = period === 'd7' ? 7 : 14;
    cur = agg(inRange(list, addDays(tom,-n), tom), mk); prev = agg(inRange(list, addDays(tom,-2*n), addDays(tom,-n)), mk);
    label = `vs previous ${n} days`;
  } else if (period === 'w7'){
    cur = agg(inRange(list, addDays(tom,-7), tom), mk);
    const pl = inRange(list, addDays(tom,-49), addDays(tom,-7));
    prev = M[mk].kind === 'sum' ? agg(pl, mk)/6 : agg(pl, mk);
    label = M[mk].kind === 'sum' ? 'vs avg of previous 6 blocks' : 'vs previous 6 blocks';
  } else if (period === 'm12'){
    const ps = new Date(t.getFullYear(), t.getMonth()-1, 1);
    const pe = new Date(ps.getFullYear(), ps.getMonth(), Math.min(t.getDate(), dim(ps.getFullYear(), ps.getMonth()))+1);
    cur = agg(inRange(list, new Date(t.getFullYear(), t.getMonth(), 1), tom), mk); prev = agg(inRange(list, ps, pe), mk);
    label = `month to date vs ${MON[ps.getMonth()]} 1–${pe.getDate()-1}`;
  } else {
    const y = t.getFullYear();
    const pe = new Date(y-1, t.getMonth(), Math.min(t.getDate(), dim(y-1, t.getMonth()))+1);
    cur = agg(inRange(list, new Date(y,0,1), tom), mk); prev = agg(inRange(list, new Date(y-1,0,1), pe), mk);
    label = `year to date vs ${y-1} to the same date`;
  }
  return {cur, prev, label};
}

/* ---------------- views ---------------- */
function presentTypes(){
  const c = {}; ACTS.forEach(a => c[a.type] = (c[a.type]||0) + 1);
  return c;
}
function navCandidates(){
  const c = presentTypes();
  const known = SLOT_ORDER.filter(k => c[k]).sort((a,b) => c[b]-c[a]);
  const extra = Object.keys(c).filter(k => !TYPES[k]).sort((a,b) => c[b]-c[a]);
  const absent = SLOT_ORDER.filter(k => !c[k]);
  return ['all', 'pro', 'analysis', 'custom', ...known, ...extra, ...absent];
}
function ensureNav(){
  const cands = navCandidates();
  if (!S.navOrder){
    S.navOrder = cands.slice();
    const present = cands.filter(k => presentTypes()[k]).slice(0, 3);
    S.navOn = ['all', ...present, 'pro', 'analysis', 'custom'];
    S.navV2 = true;
  } else {
    if (!S.navV2){      // upgrade: add the new pages after "All" and switch them on
      const i = Math.max(0, S.navOrder.indexOf('all') + 1);
      const add = ['pro', 'analysis', 'custom'].filter(k => !S.navOrder.includes(k));
      S.navOrder.splice(i, 0, ...add);
      S.navOn = [...(S.navOn || []), ...add.filter(k => !(S.navOn || []).includes(k))];
      S.navOn = S.navOrder.filter(k => S.navOn.includes(k));
      S.navV2 = true;
    }
    cands.forEach(k => { if (!S.navOrder.includes(k)) S.navOrder.push(k); });
  }
  if (!S.navOn || !S.navOn.length) S.navOn = ['all'];
}
const navTabs = () => S.navOrder.filter(k => S.navOn.includes(k));

function renderNav(){
  const tabs = navTabs();
  $('#nav').innerHTML = tabs.map(k => { const ti = typeInfo(k);
      return `<button data-tab="${esc(k)}" class="${V.tab===k?'on':''}" style="--bar:${ti.color}" aria-label="${esc(ti.label)}">${icon(ti.icon)}<span>${esc(ti.label)}</span></button>`; }).join('')
    + `<button data-tab="settings" class="${V.tab==='settings'?'on':''}" aria-label="Settings">${icon('settings',1.6)}<span>Settings</span></button>`;
}

function actsFor(tab){
  if (tab !== 'all') return ACTS.filter(a => a.type === tab);
  const f = S.allFilter; return f ? ACTS.filter(a => f.includes(a.type)) : ACTS;
}
function allSeries(){
  // stacking order = fixed slot order; unknown types fold into "Other"
  const c = presentTypes(), f = S.allFilter;
  const on = k => !f || f.includes(k);
  const ser = SLOT_ORDER.filter(k => c[k] && on(k)).map(k => ({key:k, label:TYPES[k].label, color:`var(--c-${k})`, test:a => a.type === k}));
  const others = Object.keys(c).filter(k => !TYPES[k] && on(k));
  if (others.length) ser.push({key:'other', label:'Other', color:'var(--c-other)', test:a => !TYPES[a.type]});
  return ser;
}

function route(){

function renderWorkout(){

  ctl += `<div class="subrow"><div class="desc">${esc(per.desc)}${compare ? (V.period==='m12' ? ` · each month 1–${today0().getDate()}` : ` · each year to ${fmtDM(today0())}`) : ''}</div>` +
       (cmpAble ? `<button class="switch ${compare?'on':''}" data-compare aria-pressed="${compare}"><span>Same-date compare</span><span class="tr"></span></button>` : '') + `</div>`;

  V.specs.push({el:'chart', legendEl:'legend', tblEl:'tbl', unitEl:'u_chart', ovUnitEl:'u2_chart', bks, mk, ov, H:ov ? 230 : 210, ...seriesFor(tab, mk)});

const BY_WORD = {d7:'by day', d14:'by day', w7:'by 7-day block', m12:'by month', y:'by year'};
function deltaInfo(list, mk){
  const cmp = comparison(V.period, list, mk), m = M[mk];
  if (cmp.cur == null || !cmp.prev) return {html:`<span>${esc(cmp.label)}: not enough data</span>`, badge:'', label:cmp.label};
  const pct = (cmp.cur - cmp.prev) / cmp.prev * 100;
  const better = m.lowerBetter ? pct < 0 : pct > 0;
  const cls = m.neutral || Math.abs(pct) < 0.5 ? 'neutral' : better ? 'good' : 'bad';
  const arrow = Math.abs(pct) < 0.5 ? '→' : pct > 0 ? '▲' : '▼';
  const badge = `<span class="delta ${cls}">${arrow} ${fmtNum(Math.abs(pct), Math.abs(pct) < 10 ? 1 : 0)}%</span>`;
  return {html:`${badge}<span>${esc(cmp.label)} (${esc(valStr(mk, cmp.cur))} vs ${esc(valStr(mk, cmp.prev))})</span>`, badge, label:cmp.label};
}
function selMetrics(tab, ti){
  let a = S.metric[tab]; if (!Array.isArray(a)) a = a ? [a] : [];
  a = a.filter(k => ti.metrics.includes(k)).slice(0, 2);
  return a.length ? a : [ti.metrics[0]];
}
function seriesFor(tab, mk){
  if (tab === 'all' && M[mk].kind === 'sum') return {series:allSeries(), stacked:true};
  const color = tab === 'all' ? 'var(--accent)' : typeInfo(tab).color;
  return {series:[{key:tab, label:typeInfo(tab).label, color, test:() => true}], stacked:false};
}

/* graphs-only view: every chart shares the same periods so they line up */

    V.specs.push({el:'gc'+i, unitEl:'u_gc'+i, legendEl:'lg'+i, bks, mk:k, H:150, ...seriesFor(tab, k)});

function zonesCard(list){
  const z = [0,0,0,0,0]; let est = false, any = false;
  for (const a of list){
    if (a.zones){ a.zones.forEach((s,i) => z[i] += s); any = true; }
    else if (a.hr){ z[zoneOf(a.hr)] += a.duration; est = true; any = true; }
  }
  if (!any) return '';
  const tot = z.reduce((a,b) => a+b, 0) || 1, mx = Math.max(...z) || 1;
  let h = `<section class="card"><h2>Heart-rate zones</h2><div class="meta">Time in each zone · max HR ${S.maxHr} bpm</div>`;
  ZONES.forEach((Z,i) => {
    const lo = Math.round(Z.lo*S.maxHr), hi = i < 4 ? Math.round(ZONES[i+1].lo*S.maxHr)-1 : S.maxHr;

function actRow(a, tab){

/* ---------------- chart ---------------- */
function niceScale(max, n = 4){
  if (!(max > 0)) return {step:1, top:n};
  const raw = max / n, p = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(x => x*p).find(x => x >= raw - 1e-12);
  return {step, top:Math.ceil(max/step - 1e-9)*step};
}
let UID = 0;
function drawAll(){ (V.specs || []).forEach(drawSpec); }
/* short value labels that fit on a bar */
function shortFmt(mk, v){
  if (v == null || !isFinite(v)) return '';
  const u = U();
  switch (mk){
    case 'duration': case 'avg_dur':
      return v < 3600 ? Math.round(v/60) + 'm' : (v/3600).toFixed(v < 36000 ? 1 : 0).replace(/\.0$/,'') + 'h';
    case 'pace': case 'pace100': return fmtMS(v);
    case 'distance': case 'longest': case 'avg_dist': {
      const d = v / u.dm; return d >= 1000 ? compact(d) : d >= 100 ? String(Math.round(d)) : d.toFixed(1); }
    case 'elevation': return compact(Math.round(v / u.em));
    case 'speed': return v.toFixed(1);
    case 'count': case 'avg_hr': case 'max_hr': return String(Math.round(v));
    default: return compact(Math.round(v));
  }
}
const CW = 5.9;   // ~px per character at 10px
/* one unit per chart: the heading shows it, the numbers don't repeat it */
function chartUnit(mk, maxRaw){
  const u = U(), r1 = v => (v >= 100 ? Math.round(v) : +v.toFixed(1)).toString();
  switch (mk){
    case 'duration': case 'avg_dur':
      return maxRaw < 7200 ? {u:'min', f:v => String(Math.round(v/60))} : {u:'h', f:v => r1(v/3600)};
    case 'distance': case 'longest': case 'avg_dist': return {u:u.d, f:v => { const d = v/u.dm; return d >= 1000 ? compact(d) : r1(d); }};
    case 'pace': return {u:'min/' + u.d, f:fmtMS};
    case 'pace100': return {u:'min/100m', f:fmtMS};
    case 'speed': return {u:u.sp, f:v => v.toFixed(1)};
    case 'elevation': return {u:u.e, f:v => compact(Math.round(v/u.em))};
    case 'calories': return {u:'kcal', f:v => compact(Math.round(v))};
    case 'steps': return {u:'steps', f:v => compact(Math.round(v))};
    case 'count': return {u:'', f:v => String(Math.round(v))};
    case 'avg_hr': case 'max_hr': return {u:'bpm', f:v => String(Math.round(v))};
    default: return {u:'', f:v => compact(v)};
  }
}
function smoothPath(p){
  if (!p.length) return '';
  if (p.length === 1) return `M${p[0][0]},${p[0][1]}`;
  const n = p.length, dx = [], m = [], t = new Array(n);
  for (let i = 0; i < n-1; i++){ dx[i] = p[i+1][0] - p[i][0]; m[i] = (p[i+1][1] - p[i][1]) / dx[i]; }
  t[0] = m[0]; t[n-1] = m[n-2];
  for (let i = 1; i < n-1; i++) t[i] = m[i-1] * m[i] <= 0 ? 0 : (m[i-1] + m[i]) / 2;
  for (let i = 0; i < n-1; i++){            // Fritsch–Carlson: keep it monotone between points
    if (m[i] === 0){ t[i] = t[i+1] = 0; continue; }
    const a = t[i] / m[i], b = t[i+1] / m[i], h = a*a + b*b;
    if (h > 9){ const k = 3 / Math.sqrt(h); t[i] = k*a*m[i]; t[i+1] = k*b*m[i]; }
  }
  let d = `M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
  for (let i = 0; i < n-1; i++){
    const h = dx[i] / 3;
    d += `C${(p[i][0]+h).toFixed(1)},${(p[i][1]+h*t[i]).toFixed(1)} ${(p[i+1][0]-h).toFixed(1)},${(p[i+1][1]-h*t[i+1]).toFixed(1)} ${p[i+1][0].toFixed(1)},${p[i+1][1].toFixed(1)}`;
  }
  return d;
}

function drawSpec(sp){
  const el = document.getElementById(sp.el); if (!el) return;
  const {bks, mk, series, stacked, ov} = sp, m = M[mk], uid = ++UID;
  const vals = bks.map(b => stacked ? series.map(se => agg(b.list.filter(se.test), mk)) : [agg(b.list.filter(series[0].test), mk)]);
  const tot = vals.map(v => v.every(x => x == null) ? null : v.reduce((a,b) => a + (b || 0), 0));
  const ovals = ov ? bks.map(b => { const l = stacked ? b.list : b.list.filter(series[0].test); return l.length ? agg(l, ov) : null; }) : null;   // no workouts = gap in the line
  const rawMax = sp.maxRaw != null ? sp.maxRaw : Math.max(0, ...tot.filter(x => x != null));
  const H = sp.H || 210, W = Math.max(260, el.clientWidth), pl = 4, pr = 4, pb = 34;
  const n = bks.length, slot = (W - pl - pr) / n, bw = Math.min(26, Math.max(6, slot * .64));
  const cu = chartUnit(mk, rawMax);
  const labels = tot.map(v => (v != null && v > 0) || (v != null && M[mk].kind !== 'sum') ? cu.f(v) : '');
  const longest = Math.max(1, ...labels.map(l => l.length));
  // always horizontal: shrink the type to fit the column (down to 8px), then stagger every other label
  const fs = Math.max(8, Math.min(10.5, (slot - 2) / (longest * .6)));

  const pt = 18 + (stagger ? fs + 3 : 0);
  const ph = H - pt - pb;
  const top = Math.max(rawMax, 1e-9);
  const y = v => pt + ph - (v / top) * ph;
  if (sp.unitEl){ const e = document.getElementById(sp.unitEl); if (e) e.textContent = cu.u ? `(${cu.u})` : ''; }
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(m.label)} bar chart"><defs>` +
    series.map((se, si) => `<linearGradient id="g${uid}_${si}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${se.color}"/><stop offset="1" style="stop-color:${se.color};stop-opacity:var(--bar-fade)"/></linearGradient>`).join('') + `</defs>`;
  s += `<line x1="${pl}" x2="${W-pr}" y1="${pt+ph}" y2="${pt+ph}" stroke="var(--axis)" stroke-width="1"/>`;
  const hiIdx = V.sel != null ? V.sel : (tot[n-1] != null ? n-1 : null);
  const barTops = [], barLabelBox = [];
  bks.forEach((b, i) => {
    const x = pl + i*slot + (slot - bw)/2, cx = x + bw/2, dimmed = V.sel != null && V.sel !== i, hi = i === hiIdx;
    s += `<rect x="${x}" y="${pt}" width="${bw}" height="${ph}" rx="4" style="fill:var(--chip);opacity:${dimmed ? .25 : .55}"/>`;
    let acc = 0; const segs = [];
    vals[i].forEach((v, si) => { if (v > 0){ segs.push({y0:acc, y1:acc+v, v, si}); acc += v; } });
    s += `<g opacity="${dimmed ? .3 : 1}">`;
    segs.forEach((g, gi) => {
      const t = y(g.y1), bot = y(g.y0) - (gi > 0 ? 2 : 0), hgt = bot - t;
      if (hgt <= 0.5) return;
      const col = series[g.si].color, st = `fill:url(#g${uid}_${g.si});filter:drop-shadow(0 0 ${hi ? 'var(--glow-hi)' : 'var(--glow)'} ${col})`;
      if (gi === segs.length - 1){
        const r = Math.min(4, hgt, bw/2);
        s += `<path d="M${x},${bot}V${t+r}Q${x},${t} ${x+r},${t}H${x+bw-r}Q${x+bw},${t} ${x+bw},${t+r}V${bot}Z" style="${st}"/>`;

      } else s += `<rect x="${x}" y="${t}" width="${bw}" height="${hgt}" style="${st}"/>`;
      // value of each stacked segment, inside it when there is room

      }
    });
    s += `</g>`;
    // total on top of every bar
    const bt = tot[i] != null ? y(Math.max(0, tot[i])) : pt + ph;
    barTops.push(bt);
    const lift = stagger && (n - 1 - i) % 2 === 1 ? fs + 2 : 0;

  if (ov){

    const oy = v => pt + ph - (v / omax) * ph * .7;     // line peaks at 70% height so it runs through the bars, not over their labels

  s += `</svg><div class="tip" hidden></div>`;
  el.innerHTML = s;

  if (sp.legendEl){
    const shown = series.filter((se, si) => vals.some(v => v[si] > 0));
    let lg = stacked && shown.length > 1 ? shown.map(se => `<span><i class="sw" style="background:${se.color}"></i>${esc(se.label)}</span>`).join('') : '';
    if (ov) lg = (stacked && shown.length > 1 ? '' : `<span><i class="sw" style="background:${series[0].color}"></i>${esc(m.label)} (bars)</span>`) + lg + `<span><i class="lnsw"></i>${esc(M[ov].label)} (line)</span>`;

  const tip = el.querySelector('.tip');

function dataMsg(t, cls){ const m = $('#dataMsg'); if (m){ m.textContent = t; m.className = 'msg ' + (cls||''); } }
function afterDataChange(res, label){

/* =====================================================================
   Generic chart engine — used by Analysis, Custom and Pro
   ===================================================================== */
const CAT_COLORS = ['var(--c-run)','var(--c-cycle)','var(--c-yoga)','var(--c-walk)','var(--c-swim)','var(--c-hike)','var(--c-strength)','var(--c-hiit)'];
let GUID = 0;

function tipFor(el){
  let t = el.querySelector(':scope > .tip');
  if (!t){ t = document.createElement('div'); t.className = 'tip'; t.hidden = true; el.appendChild(t); }
  return t;
}
function showTipAt(el, html, cx, top, W){
  const tip = tipFor(el); tip.innerHTML = html; tip.hidden = false;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(Math.max(0, cx - tw/2), W - tw) + 'px';
  tip.style.top = Math.max(-th + 10, top - th - 10) + 'px';
}
function bindTips(el, n, html, pos, W){
  const tip = tipFor(el);
  el.querySelectorAll('[data-gi]').forEach(r => {
    const i = +r.dataset.gi;
    r.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') showTipAt(el, html(i), ...pos(i), W); });
    r.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') tip.hidden = true; });
    r.addEventListener('click', () => {
      if (!tip.hidden && tip.dataset.i === String(i)){ tip.hidden = true; tip.dataset.i = ''; return; }
      showTipAt(el, html(i), ...pos(i), W); tip.dataset.i = String(i);
    });
  });
}
const tipRow = (k, v, color, line) => `<div class="r"><span class="k">${color ? (line ? `<i class="lnsw" style="background:${color}"></i>` : `<i class="sw" style="background:${color}"></i>`) : ''}${esc(k)}</span><b>${esc(v)}</b></div>`;

/* Category charts: bar, grouped bar, stacked bar, line, area, and mixes.
   c = {cats:[{lab,sub,title}], series:[{name,color,values,as:'bar'|'line'|'area',ownScale,fmt,full}],
        stack, fmt, full, H, refLines:[{v,label}], labelLines, hi} */
function renderCat(el, c){
  if (!el) return;
  const uid = ++GUID, n = c.cats.length;
  const W = Math.max(260, el.clientWidth), H = c.H || 220, pb = 34, pl = 4, pr = 4;
  const bars = c.series.filter(s => (s.as || 'bar') === 'bar');
  const lines = c.series.filter(s => s.as === 'line' || s.as === 'area');
  const shared = lines.filter(s => !s.ownScale);
  // value range (bars stacked or not, plus shared lines)
  let vmax = 0, vmin = 0;
  const totals = c.cats.map((_, i) => bars.reduce((t, s) => t + (s.values[i] > 0 ? s.values[i] : 0), 0));
  if (c.stack) vmax = Math.max(0, ...totals);
  bars.forEach(s => s.values.forEach(v => { if (v != null){ if (!c.stack) vmax = Math.max(vmax, v); vmin = Math.min(vmin, v); } }));
  shared.forEach(s => s.values.forEach(v => { if (v != null){ vmax = Math.max(vmax, v); vmin = Math.min(vmin, v); } }));
  let zoomed = false;
  if (!bars.length && c.zero !== true){
    const vs = shared.flatMap(se => se.values).filter(v => v != null);
    const lo = Math.min(...vs), hi = Math.max(...vs);
    if (vs.length && lo > 0 && lo / hi > .4){ const pad = (hi - lo) * .25 || hi * .05; vmin = lo - pad; vmax = hi + pad; zoomed = true; }
  }
  (c.refLines || []).forEach(r => { vmax = Math.max(vmax, r.v); vmin = Math.min(vmin, r.v); });
  if (vmax === vmin) vmax = vmin + 1;
  const fmt = c.fmt || (v => compact(v)), full = c.full || fmt;
  const slot = (W - pl - pr) / n;
  // bar value labels: horizontal, shrink then stagger, else skip
  const showBarLabels = c.labels !== false && bars.length && (c.stack || bars.length === 1);
  const labelVals = c.cats.map((_, i) => c.stack ? (c.totals === false ? null : totals[i] || null) : (bars[0] ? bars[0].values[i] : null));
  const labs = labelVals.map(v => v == null || (v === 0 && c.hideZero !== false) ? '' : fmt(v));
  const longest = Math.max(1, ...labs.map(l => l.length));
  const fs = Math.max(8, Math.min(10.5, (slot - 2) / (longest * .6)));
  const fitsOne = longest * .6 * fs <= slot - 2, fitsTwo = longest * .6 * fs <= 2 * slot - 4;
  const barLabelMode = !showBarLabels ? 'none' : fitsOne ? 'all' : fitsTwo ? 'stagger' : 'none';
  const pt = 18 + (barLabelMode === 'stagger' ? fs + 3 : 0) + (lines.length && c.labelLines !== false ? 4 : 0);
  const ph = H - pt - pb;
  const y = v => pt + (vmax - v) / (vmax - vmin) * ph;
  const y0 = zoomed ? pt + ph : y(0);
  const hi = c.hi != null ? c.hi : n - 1;
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img"><defs>`;
  c.series.forEach((se, si) => {
    s += `<linearGradient id="gg${uid}_${si}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${se.color}"/><stop offset="1" style="stop-color:${se.color};stop-opacity:var(--bar-fade)"/></linearGradient>`;
    s += `<linearGradient id="ga${uid}_${si}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${se.color};stop-opacity:.45"/><stop offset="1" style="stop-color:${se.color};stop-opacity:0"/></linearGradient>`;
  });
  s += `</defs>`;
  (c.refLines || []).forEach(r => {
    const yy = y(r.v);
    s += `<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>`;
    if (r.label) s += `<text class="reflab" x="${W-pr-2}" y="${yy-3}" text-anchor="end">${esc(r.label)}</text>`;
  });
  s += `<line x1="${pl}" x2="${W-pr}" y1="${y0}" y2="${y0}" stroke="var(--axis)" stroke-width="1"/>`;
  // bars
  const nb = bars.length, groupW = Math.min(slot * .72, c.stack || nb === 1 ? 26 : 12 * nb + 4);
  const bw = c.stack || nb <= 1 ? Math.max(3, Math.min(26, slot * .64)) : Math.max(2, (groupW - (nb - 1) * 2) / nb);
  c.cats.forEach((cat, i) => {
    const cx = pl + i * slot + slot / 2;
    if (nb){
      if (c.stack){
        let acc = 0; const segs = [];
        bars.forEach((se, si) => { const v = se.values[i]; if (v > 0){ segs.push({a:acc, b:acc + v, v, se, si}); acc += v; } });
        const x = cx - bw / 2;
        segs.forEach((g, gi) => {
          const t = y(g.b), bot = y(g.a) - (gi > 0 ? 1.5 : 0), h = bot - t; if (h <= .5) return;
          const st = `fill:url(#gg${uid}_${c.series.indexOf(g.se)});filter:drop-shadow(0 0 ${i === hi ? 'var(--glow-hi)' : 'var(--glow)'} ${g.se.color})`;
          if (gi === segs.length - 1){ const r = Math.min(4, h, bw / 2); s += `<path d="M${x},${bot}V${t+r}Q${x},${t} ${x+r},${t}H${x+bw-r}Q${x+bw},${t} ${x+bw},${t+r}V${bot}Z" style="${st}"/>`; }
          else s += `<rect x="${x}" y="${t}" width="${bw}" height="${h}" style="${st}"/>`;
          if (segs.length > 1){ const lab = (g.se.fmt || fmt)(g.v), ifs = Math.min(9, (bw - 2) / (lab.length * .58));
            if (ifs >= 7 && h >= ifs + 4) s += `<text class="inl" x="${cx}" y="${t + h/2 + ifs*.36}" text-anchor="middle" style="font-size:${ifs.toFixed(1)}px">${esc(lab)}</text>`; }
        });
      } else {
        bars.forEach((se, bi) => {
          const v = se.values[i]; if (v == null || v === 0) return;
          const x = nb === 1 ? cx - bw / 2 : cx - groupW / 2 + bi * (bw + 2);
          const t = Math.min(y(v), y0), h = Math.abs(y(v) - y0); if (h <= .5) return;
          const neg = v < 0, r = Math.min(4, h, bw / 2);
          const st = `fill:${neg ? se.color : `url(#gg${uid}_${c.series.indexOf(se)})`};opacity:${neg ? .75 : 1};filter:drop-shadow(0 0 ${i === hi ? 'var(--glow-hi)' : 'var(--glow)'} ${se.color})`;
          s += neg ? `<path d="M${x},${t}V${t+h-r}Q${x},${t+h} ${x+r},${t+h}H${x+bw-r}Q${x+bw},${t+h} ${x+bw},${t+h-r}V${t}Z" style="${st}"/>`
                   : `<path d="M${x},${t+h}V${t+r}Q${x},${t} ${x+r},${t}H${x+bw-r}Q${x+bw},${t} ${x+bw},${t+r}V${t+h}Z" style="${st}"/>`;
        });
      }
      // label on top (or below for negatives)
      if (barLabelMode !== 'none' && labs[i]){
        const v = labelVals[i], lift = barLabelMode === 'stagger' && (n - 1 - i) % 2 === 1 ? fs + 2 : 0;
        const ly = v < 0 ? y(v) + fs + 3 : y(v) - 5 - lift;
        s += `<text class="vlabel${i === hi ? ' hi' : ''}" x="${cx}" y="${ly}" text-anchor="middle" style="font-size:${fs.toFixed(1)}px">${esc(labs[i])}</text>`;
      }
    }
  });
  // lines / areas
  lines.forEach((se, li) => {
    const vals = se.values, ok = vals.filter(v => v != null);
    if (!ok.length) return;
    let yy = y;
    if (se.ownScale){ const mx = Math.max(...ok), mn = Math.min(0, ...ok); yy = v => pt + ph - ((v - mn) / ((mx - mn) || 1)) * ph * .7; }
    const pts = vals.map((v, i) => v == null ? null : [pl + i * slot + slot / 2, yy(v)]);
    const P = pts.filter(Boolean), d = smoothPath(P);
    if (se.as === 'area' && P.length > 1) s += `<path d="${d}L${P[P.length-1][0]},${y0}L${P[0][0]},${y0}Z" style="fill:url(#ga${uid}_${c.series.indexOf(se)})"/>`;
    s += `<path d="${d}" fill="none" style="stroke:${se.color};stroke-width:2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 var(--glow) ${se.color})"/>`;
    const lf = se.fmt || fmt;
    const labelAll = c.labelLines !== false && c.lineLabels !== 'hi' && n <= 14 && lines.length <= 2;
    pts.forEach((p, i) => {
      if (!p) return;
      const showDot = n <= 60 || i === hi;
      if (showDot) s += `<circle cx="${p[0]}" cy="${p[1]}" r="${i === hi ? 4 : n > 30 ? 2 : 3}" style="fill:${se.color};stroke:var(--surface);stroke-width:1.5"/>`;
      if (c.labelLines !== false && (labelAll || i === hi)){
        const ly = li % 2 === 1 ? p[1] + 14 : p[1] - 8;
        s += `<text class="ovlabel${i === hi ? ' hi' : ''}" x="${p[0]}" y="${ly}" text-anchor="middle" style="fill:${se.color === 'var(--line)' ? 'var(--ink)' : 'var(--ink)'}">${esc(lf(vals[i]))}</text>`;
      }
    });
  });
  // x labels (thinned to fit)
  const lw = Math.max(...c.cats.map(k => String(k.lab).length)) * 5.6 + 6;
  const step = Math.max(1, Math.ceil(lw / slot));
  c.cats.forEach((cat, i) => {
    if ((n - 1 - i) % step) return;
    const cx = pl + i * slot + slot / 2;
    s += `<text class="xl" x="${cx}" y="${H-pb+15}" text-anchor="middle" style="${i === n - 1 && c.boldLast !== false ? 'font-weight:700;fill:var(--ink)' : ''}">${esc(cat.lab)}</text>`;
    if (cat.sub) s += `<text class="xs" x="${cx}" y="${H-pb+28}" text-anchor="middle">${esc(cat.sub)}</text>`;
  });
  c.cats.forEach((_, i) => { s += `<rect data-gi="${i}" x="${pl + i*slot}" y="0" width="${slot}" height="${H}" fill="transparent" style="cursor:pointer"/>`; });
  s += `</svg>`;
  el.innerHTML = s;
  const html = i => {
    let t = `<div class="t">${esc(c.cats[i].title || c.cats[i].lab)}</div>`;
    if (c.stack && bars.length > 1) t += tipRow('Total', full(totals[i]));
    c.series.forEach(se => { const v = se.values[i]; if (v != null && !(c.stack && !v)) t += tipRow(se.name, (se.full || full)(v), se.color, se.as === 'line' || se.as === 'area'); });
    if (c.extraTip) t += c.extraTip(i);
    return t;
  };
  const pos = i => { const top = c.stack ? y(totals[i] || 0) : Math.min(...c.series.map(se => se.values[i] != null && !se.ownScale ? y(Math.max(0, se.values[i])) : y0)); return [pl + i * slot + slot / 2, top]; };
  bindTips(el, n, html, pos, W);
}

/* Scatter: p = {points:[{x,y,color,title}], xf, yf, xLabel, yLabel} */
function renderScatter(el, p){
  if (!el) return;
  const W = Math.max(260, el.clientWidth), H = p.H || 260, pl = 40, pr = 10, pt = 12, pb = 34;
  const xs = p.points.map(q => q.x), ys = p.points.map(q => q.y);
  if (!xs.length){ el.innerHTML = `<div class="empty">No workouts have both values.</div>`; return; }
  const pad = (a, b) => { const d = (b - a) || Math.abs(a) || 1; return [a - d * .06, b + d * .06]; };
  const [x0, x1] = pad(Math.min(...xs), Math.max(...xs)), [y0, y1] = pad(Math.min(...ys), Math.max(...ys));
  const X = v => pl + (v - x0) / (x1 - x0) * (W - pl - pr), Y = v => pt + (y1 - v) / (y1 - y0) * (H - pt - pb);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
  for (let k = 0; k <= 2; k++){
    const xv = x0 + (x1 - x0) * (.08 + k * .42), yv = y0 + (y1 - y0) * (.08 + k * .42);
    s += `<line x1="${pl}" x2="${W-pr}" y1="${Y(yv)}" y2="${Y(yv)}" stroke="var(--grid)"/>`;
    s += `<text class="tick" x="${pl-5}" y="${Y(yv)+3}" text-anchor="end">${esc(p.yf(yv))}</text>`;
    s += `<text class="tick" x="${X(xv)}" y="${H-pb+14}" text-anchor="middle">${esc(p.xf(xv))}</text>`;
  }
  s += `<text class="xs" x="${(pl + W - pr)/2}" y="${H-4}" text-anchor="middle">${esc(p.xLabel)}</text>`;
  s += `<text class="xs" x="10" y="${(pt + H - pb)/2}" text-anchor="middle" transform="rotate(-90 10 ${(pt + H - pb)/2})">${esc(p.yLabel)}</text>`;
  p.points.forEach((q, i) => {
    s += `<circle data-gi="${i}" cx="${X(q.x)}" cy="${Y(q.y)}" r="${p.points.length > 300 ? 3 : 4.5}" style="fill:${q.color};fill-opacity:.8;stroke:var(--surface);stroke-width:1;cursor:pointer;filter:drop-shadow(0 0 var(--glow) ${q.color})"/>`;
  });
  s += `</svg>`;
  el.innerHTML = s;
  bindTips(el, p.points.length, i => { const q = p.points[i]; return `<div class="t">${esc(q.title)}</div>` + tipRow(p.xLabel, p.xf(q.x)) + tipRow(p.yLabel, p.yf(q.y)); },
           i => [X(p.points[i].x), Y(p.points[i].y)], W);
}

/* Donut: d = {slices:[{name,color,value}], full, total} */
function renderDonut(el, d){
  if (!el) return;
  const tot = d.slices.reduce((a, b) => a + b.value, 0);
  if (!tot){ el.innerHTML = `<div class="empty">Nothing to show for this selection.</div>`; return; }
  const R = 78, r = 50, C = 90; let a0 = -Math.PI / 2, s = `<svg viewBox="0 0 180 180" width="180" height="180" class="donut">`;
  d.slices.forEach((sl, i) => {
    const frac = sl.value / tot; if (frac <= 0) return;
    const a1 = a0 + frac * Math.PI * 2 - (d.slices.length > 1 ? .025 : 0);
    const large = a1 - a0 > Math.PI ? 1 : 0, P = (rad, a) => [C + rad * Math.cos(a), C + rad * Math.sin(a)];
    const [x1, y1] = P(R, a0), [x2, y2] = P(R, a1), [x3, y3] = P(r, a1), [x4, y4] = P(r, a0);
    s += frac >= .9999 ? `<circle cx="${C}" cy="${C}" r="${(R + r)/2}" fill="none" style="stroke:${sl.color};stroke-width:${R - r}"/>`
      : `<path data-gi="${i}" d="M${x1},${y1}A${R},${R} 0 ${large} 1 ${x2},${y2}L${x3},${y3}A${r},${r} 0 ${large} 0 ${x4},${y4}Z" style="fill:${sl.color};cursor:pointer;filter:drop-shadow(0 0 var(--glow) ${sl.color})"/>`;
    a0 += frac * Math.PI * 2;
  });
  s += `<text x="${C}" y="${C-2}" text-anchor="middle" class="dtot">${esc(d.short(tot))}</text><text x="${C}" y="${C+14}" text-anchor="middle" class="xs">${esc(d.unit || 'total')}</text></svg>`;
  const legend = `<div class="dleg">${d.slices.map(sl => `<div><i class="sw" style="background:${sl.color}"></i><span>${esc(sl.name)}</span><b>${esc(d.full(sl.value))}</b><em>${Math.round(sl.value / tot * 100)}%</em></div>`).join('')}</div>`;
  el.innerHTML = `<div class="donutwrap">${s}${legend}</div>`;
}

/* Calendar heatmap: h = {from, to, values: Map(dayKey -> v), full, color} */
function renderHeat(el, h){
  if (!el) return;
  const start = new Date(h.from); start.setDate(start.getDate() - ((start.getDay() + 6) % 7));   // Monday
  const days = Math.round((h.to - start) / DAY) + 1, weeks = Math.ceil(days / 7);
  const W = Math.max(260, el.clientWidth), lab = 22, gap = 2;
  const cell = Math.max(10, Math.min(16, Math.floor((W - lab - 14) / weeks) - gap));
  const totalW = lab + weeks * (cell + gap) + 14, Hh = 16 + 7 * (cell + gap);
  const vals = [...h.values.values()].filter(v => v > 0), mx = Math.max(1e-9, ...vals);
  let s = `<svg viewBox="0 0 ${totalW} ${Hh}" width="${totalW}" height="${Hh}">`;
  ['M','','W','','F','','S'].forEach((d, i) => { if (d) s += `<text class="xs" x="0" y="${16 + i*(cell+gap) + cell*.8}">${d}</text>`; });
  let lastM = -1;
  for (let i = 0; i < days; i++){
    const d = addDays(start, i), w = Math.floor(i / 7), r = i % 7;
    if (d < h.from || d > h.to) continue;
    if (r === 0 && d.getMonth() !== lastM && d.getDate() <= 7){ lastM = d.getMonth(); s += `<text class="xs" x="${lab + w*(cell+gap)}" y="10">${MON[d.getMonth()]}</text>`; }
    const v = h.values.get(dayKey(d)) || 0, op = v > 0 ? .25 + .75 * Math.sqrt(v / mx) : 0;
    s += `<rect data-gi="${i}" x="${lab + w*(cell+gap)}" y="${16 + r*(cell+gap)}" width="${cell}" height="${cell}" rx="2" style="fill:${v > 0 ? h.color : 'var(--chip)'};fill-opacity:${v > 0 ? op.toFixed(2) : 1};cursor:pointer"/>`;
  }
  s += `</svg>`;
  el.innerHTML = `<div class="heatscroll">${s}</div>`;
  const sc = el.querySelector('.heatscroll'); sc.scrollLeft = sc.scrollWidth;
  el.querySelectorAll('[data-gi]').forEach(rc => rc.addEventListener('click', () => {
    const d = addDays(start, +rc.dataset.gi), v = h.values.get(dayKey(d)) || 0;
    const t = tipFor(el); t.innerHTML = `<div class="t">${esc(fmtDay(d))}</div>` + tipRow(h.label, v ? h.full(v) : 'Rest day'); t.hidden = false;
    t.style.left = '0px'; t.style.top = (Hh + 4) + 'px';
  }));
}
function dayKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

function legendHtml(series){
  return `<div class="legend">${series.map(se => `<span>${se.as === 'line' || se.as === 'area' ? `<i class="lnsw" style="background:${se.color}"></i>` : `<i class="sw" style="background:${se.color}"></i>`}${esc(se.name)}</span>`).join('')}</div>`;
}

/* =====================================================================
   Analysis: measures (every column in the data), dimensions, filters
   ===================================================================== */
// Per-workout training load (Edwards TRIMP: minutes in each zone x zone number)
function loadOf(a){

/* ---------- filters ---------- */
const PRESETS = [['all','All time'],['7d','Last 7 days'],['30d','Last 30 days'],['90d','Last 90 days'],['12m','Last 12 months'],['tw','This week'],['lw','Last week'],['tm','This month'],['lm','Last month'],['ty','This year'],['ly','Last year'],['custom','Custom dates']];
function presetRange(f){
  const t = today0(), tom = addDays(t, 1);
  switch (f.preset){
    case '7d': return [addDays(tom, -7), tom];
    case '30d': return [addDays(tom, -30), tom];
    case '90d': return [addDays(tom, -90), tom];
    case '12m': return [new Date(t.getFullYear() - 1, t.getMonth(), t.getDate() + 1), tom];
    case 'tw': return [monday(t), tom];
    case 'lw': { const m = monday(t); return [addDays(m, -7), m]; }
    case 'tm': return [new Date(t.getFullYear(), t.getMonth(), 1), tom];
    case 'lm': return [new Date(t.getFullYear(), t.getMonth() - 1, 1), new Date(t.getFullYear(), t.getMonth(), 1)];
    case 'ty': return [new Date(t.getFullYear(), 0, 1), tom];
    case 'ly': return [new Date(t.getFullYear() - 1, 0, 1), new Date(t.getFullYear(), 0, 1)];
    case 'custom': return [f.from ? new Date(f.from + 'T00:00') : null, f.to ? addDays(new Date(f.to + 'T00:00'), 1) : null];
    default: return [null, null];
  }
}

  const [s, e] = presetRange(f);

    (!f.types || !f.types.length || f.types.includes(a.type)) &&
    (!s || a.start >= s) && (!e || a.start < e) &&
    (!f.years || !f.years.length || f.years.includes(a.start.getFullYear())) &&
    (!f.months || !f.months.length || f.months.includes(a.start.getMonth())) &&
    (!f.weekdays || !f.weekdays.length || f.weekdays.includes(a.start.getDay())) &&
    (!f.tod || !f.tod.length || f.tod.includes(todOf(a.start))));

/* ---------- grouping ---------- */
function timeCats(unit, list, f){

    for (; d < e; d = addDays(d, 1)) push(d, addDays(d, 1), String(d.getDate()), d.getDate() === 1 || !cats.length ? MON[d.getMonth()] : '', fmtDay(d));
  } else if (unit === 'week'){
    for (let d = monday(s); d < e; d = addDays(d, 7)) push(d, addDays(d, 7), fmtDM(d), '', `Week of ${fmtDM(d)} ${d.getFullYear()}`);
  } else if (unit === 'month'){
    for (let d = new Date(s.getFullYear(), s.getMonth(), 1); d < e; d = new Date(d.getFullYear(), d.getMonth() + 1, 1))
      push(d, new Date(d.getFullYear(), d.getMonth() + 1, 1), MON[d.getMonth()], d.getMonth() === 0 || !cats.length ? "'" + String(d.getFullYear()).slice(2) : '', `${MON[d.getMonth()]} ${d.getFullYear()}`);
  } else if (unit === 'quarter'){
    for (let d = new Date(s.getFullYear(), Math.floor(s.getMonth() / 3) * 3, 1); d < e; d = new Date(d.getFullYear(), d.getMonth() + 3, 1)){
      const q = Math.floor(d.getMonth() / 3) + 1; push(d, new Date(d.getFullYear(), d.getMonth() + 3, 1), 'Q' + q, "'" + String(d.getFullYear()).slice(2), `Q${q} ${d.getFullYear()}`);
    }

    renderDonut(el, {slices:top, full:v => fullA(cfg.measure, v, mx), short:v => u.f(v), unit:u.u || m.label.toLowerCase()});
    if (foot && !m.hows.includes('sum')) foot.innerHTML = `<div class="note">${esc(m.label)} can't be added up, so slices show ${howLabel(cfg.measure, how2).toLowerCase()} per group.</div>`;
    return u.u ? `(${u.u})` : '';
  }
  // category charts and table
  let series;
  const splitOn = cfg.split && cfg.split !== by && ['stack','group','line','area','table','bar'].includes(cfg.chart);
  if (splitOn){
    series = splitSeries(cfg.split, list).map(se => ({...se, values:g.cats.map(c => aggA(c.list.filter(se.test), cfg.measure, how))}))
      .filter(se => se.values.some(v => v != null && v !== 0));
    if (!series.length) series = [{name:m.label, color, values:g.cats.map(() => null)}];
  } else series = [{name:m.label, color, values:g.cats.map(c => aggA(c.list, cfg.measure, how))}];
  const all = series.flatMap(s => s.values).filter(v => v != null);
  const mx = cfg.chart === 'stack' ? Math.max(0, ...g.cats.map((_, i) => series.reduce((t, s) => t + (s.values[i] || 0), 0))) : Math.max(0, ...all);
  const u = m.unit(mx), full = v => fullA(cfg.measure, v, mx);
  let overlay = null, ou = null;
  if (cfg.measure2 && AM[cfg.measure2] && ['bar','stack','group'].includes(cfg.chart)){
    const m2 = AM[cfg.measure2], h2 = fixHow(cfg.measure2, cfg.how2 || m2.hows[0]);
    const v2 = g.cats.map(c => c.list.length ? aggA(c.list, cfg.measure2, h2) : null);
    ou = m2.unit(Math.max(0, ...v2.filter(v => v != null)));
    overlay = {name:`${howLabel(cfg.measure2, h2)} ${m2.label.toLowerCase()}`, color:'var(--line)', values:v2, as:'line', ownScale:true, fmt:ou.f, full:v => fullA(cfg.measure2, v)};
  }
  if (cfg.chart === 'table'){
    el.innerHTML = `<div class="tblwrap"><table class="atbl"><tr><th>${esc(DIMS[by].label)}</th>${series.map(s => `<th>${esc(s.name)}</th>`).join('')}${overlay ? `<th>${esc(overlay.name)}</th>` : ''}<th>Workouts</th></tr>` +
      g.cats.map((c, i) => `<tr><td>${esc(c.title || c.lab)}</td>${series.map(s => `<td>${esc(s.values[i] == null ? '–' : full(s.values[i]))}</td>`).join('')}${overlay ? `<td>${esc(overlay.values[i] == null ? '–' : overlay.full(overlay.values[i]))}</td>` : ''}<td>${c.list.length}</td></tr>`).reverse().join('') + `</table></div>`;
  } else {
    const kind = cfg.chart;
    const ser = series.map(s => ({...s, as:kind === 'line' ? 'line' : kind === 'area' ? 'area' : 'bar'}));
    if (overlay) ser.push(overlay);

    if (foot && (ser.length > 1)) foot.innerHTML = legendHtml(ser);
  }
  if (foot && g.note) foot.innerHTML += `<div class="note">${esc(g.note)}</div>`;
  return `(${[u.u, ou && ou.u ? ou.u + ' line' : ''].filter(Boolean).join(' · ')})`.replace('()', '');
}
